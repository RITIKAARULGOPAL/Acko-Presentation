<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Möbius promise · six pulses</title>
<style>
  :root { --purple: #5222d0; --ink: #111; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: var(--ink); background: #f3f0fb; }
  header { padding: 14px 20px 10px; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { margin: 0; color: #555; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 20px; }
  button { font: inherit; padding: 8px 14px; border: 1px solid #cfc6ea; border-radius: 8px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--purple); color: #fff; border-color: var(--purple); }
  .desc { padding: 4px 20px 10px; min-height: 28px; }
  .frame { position: relative; margin: 0 20px 20px; aspect-ratio: 16 / 9; max-height: calc(100vh - 190px); background: #fff; border: 1px solid #cfc6ea; border-radius: 10px; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; }
  .note { position: absolute; right: 12px; top: 10px; font-size: 12px; background: #fffc; padding: 2px 8px; border-radius: 6px; }
  a { color: var(--purple); }
</style>
</head>
<body>
<header>
  <h1>The Möbius promise: six ways to set it apart and pulse it</h1>
  <p>"It's never us versus you; it's always us with you." Each is the real slide at its final frame; the line pulses by itself.</p>
</header>
<div class="row" id="opts"></div>
<div class="desc" id="desc"></div>
<div class="frame"><iframe id="f" title="slide"></iframe><span class="note" id="note"></span></div>
<script>
const OPTS = {
  a: ["A · Band + ripple", "A lilac band that breathes while a soft ring ripples out of it; bold purple words."],
  b: ["B · Underline sweep", "Bold purple words; a purple line sweeps under each line, left to right, again and again."],
  c: ["C · Glow", "Bold purple words that breathe a soft violet glow, no box."],
  d: ["D · Marker wipe", "A lilac highlighter wipes across each line, holds, fades, and draws again."],
  e: ["E · Shimmer", "Bold purple words with a bright sheen that travels across them."],
  f: ["F · Framed promise", "A thin outline labelled THE PROMISE whose border and halo pulse."]
};
const q = new URLSearchParams(location.search);
let o = OPTS[q.get("pulse")] ? q.get("pulse") : "a";
function render() {
  const host = document.getElementById("opts"); host.innerHTML = "";
  for (const k in OPTS) { const b = document.createElement("button"); b.textContent = OPTS[k][0]; b.setAttribute("aria-pressed", k === o); b.onclick = () => { o = k; render(); }; host.appendChild(b); }
  document.getElementById("desc").textContent = OPTS[o][1];
  const url = "index-story3.html?pulse=" + o + "&v=" + Date.now() + "#s-campus-loop/6";
  document.getElementById("f").src = url;
  document.getElementById("note").innerHTML = '<a href="' + url + '" target="_blank">open full size</a>';
  history.replaceState(null, "", "?pulse=" + o);
}
render();
</script>
</body>
</html>
