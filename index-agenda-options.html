<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda and section starter · five looks</title>
<style>
  :root { --purple: #5222d0; --ink: #111; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: var(--ink); background: #f3f0fb; }
  header { padding: 14px 20px 10px; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { margin: 0; color: #555; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 20px; align-items: center; }
  .row b { min-width: 52px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #777; }
  button { font: inherit; padding: 8px 14px; border: 1px solid #cfc6ea; border-radius: 8px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--purple); color: #fff; border-color: var(--purple); }
  .desc { padding: 4px 20px 10px; min-height: 28px; }
  .frame { position: relative; margin: 0 20px 20px; aspect-ratio: 16 / 9; max-height: calc(100vh - 230px); background: #fff; border: 1px solid #cfc6ea; border-radius: 10px; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; }
  .note { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: #777; background: #fffc; padding: 2px 8px; border-radius: 6px; }
  a { color: var(--purple); }
</style>
</head>
<body>
<header>
  <h1>Agenda and section starter: five looks</h1>
  <p>Each one is the real slide with a different design. Pick a look, then step through the slides. Use → inside the slide for the second beat.</p>
</header>
<div class="row"><b>Look</b><span id="looks"></span></div>
<div class="row"><b>Slide</b><span id="slides"></span></div>
<div class="row" id="connrow"><b>Line</b><span id="conns"></span></div>
<div class="desc" id="desc"></div>
<div class="frame"><iframe id="f" title="slide"></iframe><span class="note" id="note"></span></div>
<script>
const LOOKS = {
  a: ["A · Giant numeral", "A huge purple number and a black title for the section; the other four shrink to a quiet row at the bottom."],
  b: ["B · Rail list", "The five sections as a ruled list on the left with a purple bar on the current one; its number, title and line large on the right."],
  c: ["C · Purple panel", "A deep-purple block on the left (like the Design inputs slide) holds the big white number; the black list sits on the right."],
  d: ["D · Editorial rows", "Full-width ruled rows: purple number, black name, grey line at the right; the current row grows and turns black bold."],
  e: ["E · Refined timeline", "Today's layout, retuned: purple line, dots and numbers, black names, bigger current stage."]
};
const SLIDES = {
  s1: ["Agenda", "s-overview/1"],
  s2: ["Opener · 01", "s-overview/2"],
  s3: ["Section 03", "s-div-3/1"],
  s4: ["Section 04", "s-div-4/1"]
};
const CONNS = {
  1: "1 · Chevron on the line",
  2: "2 · Dotted + arrowhead",
  3: "3 · Progress line",
  4: "4 · Segments only",
  5: "5 · One long arrow"
};
const q = new URLSearchParams(location.search);
let look = LOOKS[q.get("look")] ? q.get("look") : "a", slide = SLIDES[q.get("slide")] ? q.get("slide") : "s1", conn = CONNS[q.get("conn")] ? q.get("conn") : "1";
function mk(host, obj, cur, set, label) {
  host.innerHTML = "";
  for (const k in obj) { const b = document.createElement("button"); b.textContent = label(k); b.setAttribute("aria-pressed", k === cur); b.onclick = () => set(k); host.appendChild(b); }
}
function render() {
  mk(document.getElementById("looks"), LOOKS, look, (k) => { look = k; render(); }, (k) => LOOKS[k][0]);
  mk(document.getElementById("slides"), SLIDES, slide, (k) => { slide = k; render(); }, (k) => SLIDES[k][0]);
  mk(document.getElementById("conns"), CONNS, conn, (k) => { conn = k; render(); }, (k) => CONNS[k]);
  document.getElementById("connrow").style.display = (look === "a" || look === "e") ? "" : "none";
  document.getElementById("desc").textContent = LOOKS[look][1];
  const url = "index-story3.html?look=" + look + "&conn=" + conn + "&v=" + Date.now() + "#" + SLIDES[slide][1];
  const f = document.getElementById("f"); f.src = url;
  document.getElementById("note").innerHTML = '<a href="' + url + '" target="_blank">open full size</a>';
  history.replaceState(null, "", "?look=" + look + "&slide=" + slide + "&conn=" + conn);
}
render();
</script>
</body>
</html>
