<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Viewer</title>
<!-- the layout DXF's blocks as vectors (tools/acko/plan_vector.py), drawn on a canvas in AutoCAD's draw order and redrawn from the
     vectors on every pan and zoom (no pictures). Serve the repo (python tools/serve.py) and open
     /tools/acko/plan_view.html?dir=../_work/plan/ . Scroll zooms on the cursor, drag pans, double-click fits, click lists
     the layers under the cursor. -->
<style>
  :root { --paper:#ffffff; --ink:#1d1d1d; --muted:#6b6b6b; --line:#e3e0da; --panel:#fbfaf7; --accent:#5222D0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; color:var(--ink); font:13px/1.4 system-ui, "Segoe UI", sans-serif; background:var(--paper); }
  body { display:grid; grid-template-columns:300px 1fr; }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0 0 2px; }
  .muted { color:var(--muted); font-size:12px; }
  .sec { padding:10px 14px; border-bottom:1px solid var(--line); }
  .sec h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; font-weight:600; }
  .row { display:flex; gap:6px; align-items:center; }
  input[type=search] { flex:1; font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 9px; cursor:pointer; }
  button:hover { border-color:#bbb; }
  #layers { overflow:auto; flex:1; min-height:0; padding:4px 0; }
  .blk { padding:6px 14px 2px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; display:flex; gap:8px; align-items:center; }
  .lyr { display:flex; align-items:center; gap:8px; padding:3px 14px; cursor:pointer; }
  .lyr:hover { background:#f1eee8; }
  .lyr.hit { background:#ece6fb; }
  .sw { width:12px; height:12px; border-radius:2px; border:1px solid rgba(0,0,0,.2); flex:none; }
  .lyr .n { margin-left:auto; color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .lyr .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { position:relative; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; cursor:grab; touch-action:none; }
  canvas.drag { cursor:grabbing; }
  #hud { position:absolute; right:10px; bottom:10px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #pick { position:absolute; left:10px; top:10px; background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px; display:none; max-width:340px; }
  #check div { display:flex; justify-content:space-between; gap:8px; }
  #check .bad { color:#c0392b; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 9px; cursor:pointer; background:#fff; font:inherit; font-size:12px; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .hi { padding:6px 14px; border-bottom:1px solid #efece6; cursor:pointer; font-size:12px; }
  .hi:hover, .hi.on { background:#ece6fb; }
  .hi .k { font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; color:#c0392b; }
  .hi .k.note { color:#8a7a3a; }
  .sel { padding:5px 0; border-top:1px solid #efece6; font-size:12px; cursor:pointer; }
  .sel.on { background:#ece6fb; }
  .sel b.n { display:inline-block; min-width:22px; color:#fff; background:#d0021b; border-radius:9px; text-align:center; font-size:11px; margin-right:6px; }
  @media (max-width:760px) { body { grid-template-columns:1fr; grid-template-rows:40vh 1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <header><h1>Plan viewer</h1><div class="muted" id="src">loading…</div></header>
  <div class="sec">
    <h2>Selections</h2>
    <div class="muted" style="margin-bottom:6px">Click the plan to mark a spot (#1, #2, …), then tell Claude what's wrong with it. Shift-click to add without opening; Esc closes.</div>
    <div class="row"><button id="sclear">Clear all</button><button id="scopy">Copy</button></div>
    <div id="slist" style="margin-top:6px;max-height:26vh;overflow:auto"></div>
  </div>
  <div class="sec"><h2>Check</h2><div id="check" class="muted"></div></div>
  <div class="sec" id="hsec" style="display:none">
    <h2>Hover rooms</h2>
    <label class="row" style="gap:6px;margin-bottom:4px"><input type="checkbox" id="hon" checked> hover test</label>
    <label class="row" style="gap:6px;margin-bottom:6px"><input type="checkbox" id="hshapes"> show the hover shapes</label>
    <div id="hsum" class="muted"></div>
    <div class="row" id="hkinds" style="flex-wrap:wrap;margin-top:6px"></div>
  </div>
  <div id="hlist" style="max-height:30vh;overflow:auto;border-bottom:1px solid var(--line);display:none"></div>
  <div class="sec">
    <h2>Layers</h2>
    <div class="row"><input type="search" id="q" placeholder="filter layers"><button id="all">All</button><button id="none">None</button></div>
  </div>
  <div id="layers"></div>
</aside>
<main>
  <canvas id="cv"></canvas>
  <div id="pick"></div>
  <div id="tip" style="position:absolute;pointer-events:none;background:rgba(20,20,20,.9);color:#fff;padding:5px 9px;border-radius:5px;font-size:12px;display:none;max-width:320px"></div>
  <div id="hud"></div>
</main>
<script>
const DIR = new URLSearchParams(location.search).get("dir") || "../_work/plan/";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const TILE = 10000;          // mm: runs are split into 10 m tiles, so a view draws only what's in it
const FINE = 250;            // mm: pieces smaller than this are left out while they'd be under ~1 px
let meta, frame, view = { s: 1, x: 0, y: 0 }, parts = [], texts = [], hidden = new Set(), dpr = 1, queued = false;
// one group per source DXF (base plan, room hatches, outlines, labels, ...); a layer is keyed by its group, "group|layer"
let GROUP = "", hiddenG = new Set(), alpha = {};

// ---------------------------------------------------------------- load and decode
(async () => {
  meta = await fetch(DIR + "layers.json").then(r => r.json());
  const [x0, y0, x1, y1] = meta.frame;
  frame = { x0, y1, w: x1 - x0, h: y1 - y0 };
  document.getElementById("src").textContent = `${meta.sources ? meta.sources.length + " DXFs" : meta.source} · built ${meta.built}`;
  checkPanel();
  const tl = performance.now();
  for (const b of meta.blocks) {
    const data = await fetch(DIR + b.file).then(r => r.json());
    GROUP = b.group || b.block;
    if (data.defs) expand(data); else decode(data);
  }
  parts.sort((a, b) => a.order - b.order);
  loadMs = performance.now() - tl;
  layerPanel();
  try { ROOMS = await fetch(DIR + "rooms.json").then(r => r.ok ? r.json() : null); } catch (e) { ROOMS = null; }
  if (ROOMS) hoverSetup();
  selList(false);
  resize(); fit();
})();

const X = x => x - frame.x0, Y = y => frame.y1 - y;      // DXF mm -> canvas world (y down)
function pts(a) { const o = []; let x = a[0], y = a[1]; o.push(X(x), Y(y)); for (let i = 2; i < a.length; i += 2) { x += a[i]; y += a[i + 1]; o.push(X(x), Y(y)); } return o; }

let ORDER = 0, loadMs = 0;
// a flat block file: runs already in world mm
function decode(data) {
  for (const [layer, colour, lt, lw, kind, items] of data.runs) {
    if (kind === "t") { ORDER++; for (const t of items) texts.push({ layer, g: GROUP, key: GROUP + "|" + layer, colour, order: ORDER, t, x: X(t[0]), y: Y(t[1]), m: 1, ang: 0, k: 1 }); continue; }
    ingest(layer, colour, lt, lw, kind, items.map(it => (kind === "f" ? it : [it]).map(pts)));
  }
}

// an instanced block file: each definition once, placements by reference. Walk the placements from the root, carrying the
// placement's transform and its resolved layer / colour / linetype / lineweight for the definition's inheriting runs,
// and hand every run, placed, to ingest() in AutoCAD's draw order (consecutive runs with the same style are merged).
function expand(data) {
  const L = meta.layers, defs = data.defs;
  const resolve = (spec, ctx) => {
    const layer = spec[0] || ctx.layer;
    const colour = spec[1] === "L" ? (L[layer]?.colour || "#000000") : spec[1] === "B" ? ctx.colour : spec[1];
    const lt = spec[2] === "L" ? L[layer]?.lt : spec[2] === "B" ? ctx.lt : spec[2];
    const lw = spec[3] === -1 ? (L[layer]?.lw ?? -3) : spec[3] === -2 ? ctx.lw : spec[3];
    return { layer, colour, lt, lw };
  };
  const off = l => L[l] && (L[l].off || L[l].frozen);
  let pend = null;      // the run being gathered: [layer, colour, lt, lw, kind, items]
  const flush = () => { if (pend) { ingest(...pend); pend = null; } };
  const push = (st, kind, item) => {
    const key = [st.layer, st.colour, kind === "s" ? st.lt : "", kind === "s" || kind === "h" ? st.lw : 0, kind];
    if (!pend || pend[0] !== key[0] || pend[1] !== key[1] || pend[2] !== key[2] || pend[3] !== key[3] || pend[4] !== key[4]) { flush(); pend = [...key, []]; }
    pend[5].push(item);
  };
  const root = { layer: "0", colour: L["0"]?.colour || "#000000", lt: L["0"]?.lt || "Continuous", lw: L["0"]?.lw ?? -3 };
  const rootCtx = resolve(data.place.spec, root);
  const fx = frame.x0, fy = frame.y1;
  (function walk(di, M, ctx, depth) {
    const d = defs[di], k = Math.pow(10, -d.q);
    const [a, b, c, e, f, g] = M;                 // world = (a x + c y + f, b x + e y + g); canvas = (wx - x0, y1 - wy)
    const place = arr => {
      const o = new Array(arr.length); let x = arr[0], y = arr[1];
      for (let i = 0; i < arr.length; i += 2) {
        if (i) { x += arr[i]; y += arr[i + 1]; }
        const X0 = x * k, Y0 = y * k;
        o[i] = a * X0 + c * Y0 + f - fx; o[i + 1] = fy - (b * X0 + e * Y0 + g);
      }
      return o;
    };
    for (const [l, col, lt, lw, kind, items] of d.runs) {
      const st = resolve([l, col, lt, lw], ctx);
      if (kind === "i") {
        if (L[st.layer]?.frozen) continue;
        for (const it of items) {
          const [ci, ca, cb, cc, cd, ce, cf] = it;
          walk(ci, [a * ca + c * cb, b * ca + e * cb, a * cc + c * cd, b * cc + e * cd, a * ce + c * cf + f, b * ce + e * cf + g], st, depth + 1);
        }
        continue;
      }
      if (off(st.layer)) continue;
      if (kind === "t") {
        flush(); ORDER++;
        const det = a * e - b * c, sx = Math.hypot(a, b), sy = Math.abs(det) / (sx || 1);
        for (const t of items) {
          const X0 = t[0] * k, Y0 = t[1] * k, wx = a * X0 + c * Y0 + f, wy = b * X0 + e * Y0 + g;
          texts.push({ layer: st.layer, g: GROUP, key: GROUP + "|" + st.layer, colour: st.colour, order: ORDER, t, x: wx - fx, y: fy - wy,
                       ang: Math.atan2(b, a) * 180 / Math.PI, k: sy, m: det < 0 ? -1 : 1 });
        }
        continue;
      }
      for (const it of items) push(st, kind, (kind === "f" ? it : [it]).map(place));
    }
  })(data.root, data.place.m, rootCtx, 0);
  flush();
}

// one run, placed (arrays of canvas coordinates per loop), into tiled vector batches
function ingest(layer, colour, lt, lw, kind, items) {
  const order = ++ORDER;
  {
    const tiles = new Map();          // tile key -> {coarse, fine} pieces
    for (const P of items) {
      let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
      for (const p of P) for (let i = 0; i < p.length; i += 2) { const x = p[i], y = p[i + 1]; if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y; }
      const key = Math.floor(bx0 / TILE) + "," + Math.floor(by0 / TILE), fine = Math.max(bx1 - bx0, by1 - by0) < FINE;
      let t = tiles.get(key); if (!t) tiles.set(key, t = { c: [], f: [] });
      (fine ? t.f : t.c).push({ P, b: [bx0, by0, bx1, by1] });
    }
    for (const t of tiles.values()) for (const [list, fine] of [[t.c, false], [t.f, true]]) {
      if (!list.length) continue;
      let b = [Infinity, Infinity, -Infinity, -Infinity];
      const mk = () => new Path2D(); let path = mk(); const fills = [];
      for (const { P, b: ib } of list) {
        b = [Math.min(b[0], ib[0]), Math.min(b[1], ib[1]), Math.max(b[2], ib[2]), Math.max(b[3], ib[3])];
        const target = kind === "f" ? new Path2D() : path;      // each hatch is its own path, so even-odd stays inside it
        for (const p of P) {
          target.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) target.lineTo(p[i], p[i + 1]);
          if (kind === "f" || kind === "m") target.closePath();
        }
        if (kind === "f") fills.push(target);
      }
      parts.push({ layer, g: GROUP, key: GROUP + "|" + layer, colour, lt, lw, kind, order, fine, b, path, fills, n: list.length });
    }
  }
  COUNT[GROUP + "|" + layer] = (COUNT[GROUP + "|" + layer] || 0) + items.length;
}
const COUNT = {};      // items per group|layer, as placed

// ---------------------------------------------------------------- draw
function draw() {
  queued = false;
  const t0 = performance.now(), W = cv.width, H = cv.height, s = view.s * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(s, 0, 0, s, -view.x * s, -view.y * s);
  const vx0 = view.x, vy0 = view.y, vx1 = view.x + W / s, vy1 = view.y + H / s;
  const hair = 1 / s, skipFine = FINE * s < 1.2;
  let drawn = 0, segs = 0;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const p of parts) {
    if (hidden.has(p.key) || hiddenG.has(p.g) || (p.fine && skipFine)) continue;
    if (p.b[2] < vx0 || p.b[0] > vx1 || p.b[3] < vy0 || p.b[1] > vy1) continue;
    drawn++; segs += p.n;
    ctx.globalAlpha = alpha[p.g] ?? 1;
    if (p.kind === "f") { ctx.fillStyle = p.colour; for (const f of p.fills) ctx.fill(f, "evenodd"); continue; }
    if (p.kind === "m") { ctx.fillStyle = "#fff"; ctx.fill(p.path, "nonzero"); continue; }
    ctx.strokeStyle = p.colour;
    const w = p.lw > 0 ? Math.max(1, p.lw / 25) : 1;            // lineweight in 1/100 mm; 0.25 mm and under draw as a hairline
    ctx.lineWidth = (p.kind === "h" ? 0.7 : w) * hair * Math.min(dpr, 1.5);
    const dash = p.kind === "s" && p.lt ? meta.linetypes[p.lt] : null;
    if (dash && dash.length && dash.some(v => v > 0) && Math.max(...dash) * meta.ltscale * s > 2) ctx.setLineDash(dash.map(v => Math.max(v, 0.5 / s / meta.ltscale) * meta.ltscale));
    else ctx.setLineDash([]);
    ctx.stroke(p.path);
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  // text, as vector glyphs from the browser's fonts (the CAD fonts are stood in for)
  let nt = 0;
  for (const T of texts) {
    if (hidden.has(T.key) || hiddenG.has(T.g)) continue;
    // h is the capitals' height (AutoCAD's text height); a font's em is about h / 0.716 (Arial's cap height)
    const [, , h0, rot, align, row, words, style, wf, ls, font] = T.t, h = h0 * (T.k || 1), fs = h / 0.716;
    if (fs * s < 2.5 || T.x < vx0 - 20000 || T.x > vx1 + 20000 || T.y < vy0 - 20000 || T.y > vy1 + 20000) continue;
    nt++;
    // placed: the placement's rotation, then its mirror (a negative scale flips the text, as AutoCAD shows it), then the text's own
    ctx.save(); ctx.translate(T.x, T.y); ctx.rotate(-(T.ang || 0) * Math.PI / 180); if (T.m < 0) ctx.scale(1, -1);
    ctx.rotate(-rot * Math.PI / 180); ctx.scale(wf || 1, 1);
    ctx.fillStyle = T.colour; ctx.font = `${fs}px ${FONT(font || style)}`;
    ctx.textAlign = align; ctx.textBaseline = "alphabetic";
    const lines = String(words).split("\n"), lh = h * 5 / 3 * (ls || 1);           // AutoCAD's line pitch: 5/3 of the height
    const block = (lines.length - 1) * lh + h;                                       // first line's cap top to last baseline
    let base = row === 0 ? h : row === 1 ? h - block / 2 : row === 2 ? -(lines.length - 1) * lh : 0;   // first baseline
    for (const l of lines) { ctx.fillText(l, 0, base); base += lh; }
    ctx.restore();
  }
  hoverDraw(s);
  selDraw(s);
  document.getElementById("hud").textContent = `${(performance.now() - t0).toFixed(0)} ms · ${drawn} runs · ${nt} texts · ${(1 / view.s).toFixed(0)} mm/px · loaded in ${(loadMs / 1000).toFixed(1)} s`;
}
// a style or inline font name -> the browser's nearest font (the CAD fonts aren't installed here)
const FONT = name => /gothic/i.test(name) ? `"Century Gothic", "Futura", "Avenir", sans-serif` : /romans|txt|standard/i.test(name) ? `"Arial Narrow", Arial, sans-serif` : `${/^[\w ]+$/.test(name) && !/^(RD|STYLE\d*)$/i.test(name) ? `"${name}", ` : ""}Arial, Helvetica, sans-serif`;
const redraw = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };

// ---------------------------------------------------------------- view
function resize() { dpr = devicePixelRatio || 1; const r = cv.getBoundingClientRect(); cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); redraw(); }
function fit() {
  const r = cv.getBoundingClientRect(), pad = 0.03;
  view.s = Math.min(r.width / (frame.w * (1 + 2 * pad)), r.height / (frame.h * (1 + 2 * pad)));
  view.x = frame.w / 2 - r.width / 2 / view.s; view.y = frame.h / 2 - r.height / 2 / view.s; redraw();
}
addEventListener("resize", resize);
let drag = null, moved = false;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; cv.setPointerCapture(e.pointerId); cv.classList.add("drag"); });
cv.addEventListener("pointermove", e => {
  if (!drag) { hoverMove(e); return; }
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) moved = true;
  view.x = drag.vx - (e.clientX - drag.x) / view.s; view.y = drag.vy - (e.clientY - drag.y) / view.s; redraw();
});
cv.addEventListener("pointerup", e => { cv.classList.remove("drag"); if (drag && !moved) pick(e); drag = null; });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), k = Math.exp(-e.deltaY * 0.0015), mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = view.x + mx / view.s, wy = view.y + my / view.s;
  view.s *= k; view.x = wx - mx / view.s; view.y = wy - my / view.s; redraw();
}, { passive: false });
cv.addEventListener("dblclick", fit);

// ---------------------------------------------------------------- hover test (tools/acko/plan_rooms.py's rooms.json)
// The deck lights a room when the cursor is over it. Here each room's hover shape (its hatch's outer edge, split per room)
// is tested the same way: the smallest shape under the cursor wins, as a room drawn over an open area does in the deck.
let ROOMS = null, hot = null, hkinds = new Set(), hsel = null;
function hoverSetup() {
  document.getElementById("hsec").style.display = "block"; document.getElementById("hlist").style.display = "block";
  for (const r of ROOMS.rooms) {
    r.pts = r.shape.map(([x, y]) => [X(x), Y(y)]);
    const xs = r.pts.map(p => p[0]), ys = r.pts.map(p => p[1]);
    r.b = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
    r.path = new Path2D(); r.pts.forEach(([x, y], i) => i ? r.path.lineTo(x, y) : r.path.moveTo(x, y)); r.path.closePath();
    r.issues = [];
  }
  ROOMS.issues.forEach((it, i) => { it.i = i; it.cx = X(it.x); it.cy = Y(it.y); if (it.room != null) ROOMS.rooms[it.room].issues.push(it); });
  const c = {}; ROOMS.issues.forEach(it => { const k = it.kind + ":" + it.level; c[k] = (c[k] || 0) + 1; });
  Object.keys(c).filter(k => k.endsWith(":issue")).forEach(k => hkinds.add(k));
  const by = {}; ROOMS.rooms.forEach(r => by[r.type] = (by[r.type] || 0) + 1);
  const clean = ROOMS.rooms.filter(r => !r.issues.some(i => i.level === "issue")).length;
  document.getElementById("hsum").innerHTML = `${ROOMS.rooms.length} rooms in ${Object.keys(by).length} types · <b>${clean}</b> with no issue`;
  document.getElementById("hkinds").innerHTML = Object.entries(c).sort().map(([k, n]) => `<button class="chip${hkinds.has(k) ? " on" : ""}" data-k="${k}">${k.replace(":issue", "").replace(":note", " (note)")} ${n}</button>`).join("");
  document.querySelectorAll("#hkinds .chip").forEach(b => b.onclick = () => { const k = b.dataset.k; hkinds.has(k) ? hkinds.delete(k) : hkinds.add(k); b.classList.toggle("on"); hoverList(); redraw(); });
  document.getElementById("hon").onchange = () => { hot = null; document.getElementById("tip").style.display = "none"; redraw(); };
  document.getElementById("hshapes").onchange = redraw;
  hoverList();
}
function hoverList() {
  const box = document.getElementById("hlist");
  box.innerHTML = ROOMS.issues.filter(it => hkinds.has(it.kind + ":" + it.level)).map(it =>
    `<div class="hi${hsel === it.i ? " on" : ""}" data-i="${it.i}"><div class="k ${it.level}">${it.kind}${it.level === "note" ? " · note" : ""}</div>${esc(it.what)}</div>`).join("");
  box.querySelectorAll(".hi").forEach(d => d.onclick = () => {
    const it = ROOMS.issues[+d.dataset.i]; hsel = it.i;
    const r = cv.getBoundingClientRect(); view.s = r.width / 14000; view.x = it.cx - 7000; view.y = it.cy - r.height / view.s / 2;
    hot = it.room != null ? ROOMS.rooms[it.room] : null; hoverList(); redraw();
  });
}
function inPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function hoverMove(e) {
  if (!ROOMS || !document.getElementById("hon").checked) return;
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = view.x + mx / view.s, wy = view.y + my / view.s;
  const under = ROOMS.rooms.filter(R => wx >= R.b[0] && wx <= R.b[2] && wy >= R.b[1] && wy <= R.b[3] && inPoly(wx, wy, R.pts));
  under.sort((a, b) => a.m2 - b.m2);
  const top = under[0] || null, tip = document.getElementById("tip");
  if (top !== hot) { hot = top; redraw(); }
  if (!top) { tip.style.display = "none"; return; }
  const iss = top.issues.filter(i => i.level === "issue");
  tip.style.display = "block"; tip.style.left = (mx + 14) + "px"; tip.style.top = (my + 14) + "px";
  tip.innerHTML = `<b>${esc(top.type.slice(3).replace(/_/g, " "))}</b> · ${top.m2} m²` + (top.labels.length ? `<br>${esc(top.labels.slice(0, 2).join(" · "))}` : "") +
    (top.zone ? `<br>Neighbourhood: ${esc(top.zone)}` : "") + (under.length > 1 ? `<br><span style="color:#ffd27a">${under.length} hover shapes under the cursor</span>` : "") +
    (iss.length ? `<br><span style="color:#ff9b9b">${iss.length} issue${iss.length > 1 ? "s" : ""}: ${esc(iss[0].what)}</span>` : "");
}
function hoverDraw(s) {
  if (!ROOMS) return;
  const px = 1 / s;
  if (document.getElementById("hshapes").checked) {
    ctx.lineWidth = 1.5 * px * dpr; ctx.strokeStyle = "#d0021b"; ctx.setLineDash([]);
    for (const r of ROOMS.rooms) ctx.stroke(r.path);
  }
  if (hot && document.getElementById("hon").checked) {
    ctx.globalAlpha = .35; ctx.fillStyle = "#5222D0"; ctx.fill(hot.path); ctx.globalAlpha = 1;
    ctx.lineWidth = 2.5 * px * dpr; ctx.strokeStyle = "#5222D0"; ctx.stroke(hot.path);
  }
  ctx.lineWidth = 2 * px * dpr;
  for (const it of ROOMS.issues) {
    if (!hkinds.has(it.kind + ":" + it.level)) continue;
    ctx.strokeStyle = it.i === hsel ? "#d0021b" : "rgba(208,2,27,.6)";
    ctx.beginPath(); ctx.arc(it.cx, it.cy, (it.i === hsel ? 14 : 9) * px * dpr, 0, Math.PI * 2); ctx.stroke();
  }
}

// ---------------------------------------------------------------- what's under the cursor
// ---------------------------------------------------------------- selections: what you clicked, numbered, for feedback
// Every click records what's under the cursor: the room it would light, every group's layers hit there, the nearest
// label, the hover issues nearby, and the DXF coordinates. window.SELECTIONS holds them (Claude reads it from the page);
// they're kept in this browser across reloads.
const SKEY = "plan-selections:" + DIR;
let SELECTIONS = [], scur = null;
try { SELECTIONS = JSON.parse(localStorage.getItem(SKEY) || "[]"); } catch (e) { SELECTIONS = []; }
window.SELECTIONS = SELECTIONS;
const saveSel = () => { try { localStorage.setItem(SKEY, JSON.stringify(SELECTIONS)); } catch (e) {} };

function pick(e) {
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * dpr, my = (e.clientY - r.top) * dpr;
  const wx = view.x + mx / (view.s * dpr), wy = view.y + my / (view.s * dpr), tol = 4 / view.s;
  const found = new Map(), s = view.s * dpr;
  ctx.setTransform(s, 0, 0, s, -view.x * s, -view.y * s);
  for (const p of parts) {
    if (hidden.has(p.key) || hiddenG.has(p.g) || p.b[2] < wx - tol || p.b[0] > wx + tol || p.b[3] < wy - tol || p.b[1] > wy + tol) continue;
    let hit = false;
    if (p.kind === "f") hit = p.fills.some(f => ctx.isPointInPath(f, mx, my, "evenodd"));
    else if (p.kind === "m") hit = ctx.isPointInPath(p.path, mx, my);
    else { ctx.lineWidth = tol * 2; hit = ctx.isPointInStroke(p.path, mx, my); }
    if (hit) found.set(p.key, (found.get(p.key) || new Set()).add({ f: "fill", m: "wipeout", s: "line", h: "pattern" }[p.kind]));
  }
  const X_ = wx + frame.x0, Y_ = frame.y1 - wy;             // back to DXF mm
  const sel = { n: (SELECTIONS.at(-1)?.n || 0) + 1, at: [Math.round(X_), Math.round(Y_)], cx: wx, cy: wy,
                zoom_mm_per_px: Math.round(1 / view.s), time: new Date().toLocaleTimeString(),
                hits: [...found].map(([k, kinds]) => ({ group: k.split("|")[0], layer: k.split("|").slice(1).join("|"), kinds: [...kinds] })) };
  if (ROOMS) {
    const under = ROOMS.rooms.filter(R => wx >= R.b[0] && wx <= R.b[2] && wy >= R.b[1] && wy <= R.b[3] && inPoly(wx, wy, R.pts)).sort((a, b) => a.m2 - b.m2);
    sel.rooms = under.map(R => ({ id: R.id, type: R.type, m2: R.m2, labels: R.labels, zone: R.zone, outline_area_ratio: R.outline_area_ratio, issues: R.issues.map(i => i.what) }));
    const near = ROOMS.issues.map(it => [Math.hypot(it.cx - wx, it.cy - wy), it]).filter(([d]) => d < 1500).sort((a, b) => a[0] - b[0]).slice(0, 3);
    sel.issues_nearby = near.map(([d, it]) => ({ what: it.what, kind: it.kind, level: it.level, mm: Math.round(d) }));
  }
  const tn = texts.map(T => [Math.hypot(T.x - wx, T.y - wy), T]).sort((a, b) => a[0] - b[0])[0];
  if (tn && tn[0] < 3000) sel.nearest_label = { text: String(tn[1].t[6]).replace(/\n/g, " "), group: tn[1].g, layer: tn[1].layer, mm: Math.round(tn[0]) };
  SELECTIONS.push(sel); scur = sel.n; saveSel(); selList(!e.shiftKey);
  document.querySelectorAll(".lyr.hit").forEach(d => d.classList.remove("hit"));
  for (const k of found.keys()) document.querySelector(`.lyr[data-k="${CSS.escape(k)}"]`)?.classList.add("hit");
  redraw();
}
function selSummary(x) {
  const room = x.rooms?.[0] ? `${x.rooms[0].type.slice(3).replace(/_/g, " ")} ${x.rooms[0].m2} m²${x.rooms.length > 1 ? ` (+${x.rooms.length - 1} under)` : ""}` : "no room";
  const lay = x.hits.length ? x.hits.slice(0, 3).map(h => `${h.group}: ${h.layer}`).join(" · ") + (x.hits.length > 3 ? ` · +${x.hits.length - 3}` : "") : "nothing drawn here";
  return `${esc(room)}${x.nearest_label ? ` · “${esc(x.nearest_label.text.slice(0, 30))}”` : ""}<br><span class="muted">${esc(lay)}</span>`;
}
function selList(open = true) {
  const box = document.getElementById("slist");
  box.innerHTML = SELECTIONS.slice().reverse().map(x => `<div class="sel${x.n === scur ? " on" : ""}" data-n="${x.n}"><b class="n">#${x.n}</b>${selSummary(x)}</div>`).join("") || `<div class="muted">Nothing selected yet.</div>`;
  box.querySelectorAll(".sel").forEach(d => d.onclick = () => {
    const x = SELECTIONS.find(s => s.n === +d.dataset.n); scur = x.n;
    const r = cv.getBoundingClientRect(); view.x = x.cx - r.width / view.s / 2; view.y = x.cy - r.height / view.s / 2; selList(); redraw();
  });
  const pk = document.getElementById("pick"), x = SELECTIONS.find(s => s.n === scur);
  if (!open || !x) { pk.style.display = "none"; return; }
  pk.style.display = "block";
  pk.innerHTML = `<div><b class="n" style="background:#d0021b;color:#fff;border-radius:9px;padding:0 6px">#${x.n}</b> <span class="muted">at ${x.at.join(", ")}</span></div>` +
    (x.rooms?.length ? x.rooms.map(R => `<div>Room: <b>${esc(R.type.slice(3).replace(/_/g, " "))}</b> ${R.m2} m²${R.zone ? " · " + esc(R.zone) : ""}${R.labels.length ? " · " + esc(R.labels.slice(0, 2).join(" · ")) : ""}</div>`).join("") : `<div class="muted">No hover room here</div>`) +
    x.hits.map(h => `<div><span class="muted">${esc(h.group)}</span> <b>${esc(h.layer)}</b> <span class="muted">${h.kinds.join(", ")}</span></div>`).join("") +
    (x.issues_nearby?.length ? `<div style="color:#c0392b">${esc(x.issues_nearby[0].what)}</div>` : "");
}
function selDraw(s) {
  const px = dpr / s;
  ctx.font = `600 ${11 * px}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const x of SELECTIONS) {
    const on = x.n === scur, r = (on ? 11 : 9) * px;
    ctx.fillStyle = on ? "#d0021b" : "rgba(208,2,27,.85)"; ctx.beginPath(); ctx.arc(x.cx, x.cy - r * 1.6, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x.cx, x.cy); ctx.lineTo(x.cx - r * .5, x.cy - r * 1.1); ctx.lineTo(x.cx + r * .5, x.cy - r * 1.1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillText(String(x.n), x.cx, x.cy - r * 1.6);
  }
}
document.getElementById("sclear").onclick = () => { SELECTIONS.length = 0; scur = null; saveSel(); selList(); redraw(); };
document.getElementById("scopy").onclick = () => {
  const t = SELECTIONS.map(x => `#${x.n} at ${x.at.join(", ")}: ${x.rooms?.[0] ? x.rooms[0].type + " " + x.rooms[0].m2 + " m²" : "no room"}; ${x.hits.map(h => h.group + "/" + h.layer).join(", ")}`).join("\n");
  navigator.clipboard?.writeText(t);
};
addEventListener("keydown", e => { if (e.key === "Escape") { scur = null; selList(false); redraw(); } });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------------------------------------------------------- panels
function checkPanel() {
  const groups = meta.check.seen ? { [meta.source || "plan"]: meta.check } : meta.check, rows = [];
  for (const [g, c] of Object.entries(groups)) {
    const d = Object.values(c.drawn).reduce((a, v) => a + v, 0), f = Object.values(c.failed).reduce((a, v) => a + v[0], 0);
    const st = c.stats || {}, notes = [];
    if (st.duplicate_placement_skipped) notes.push(`${st.duplicate_placement_skipped} duplicate placement skipped`);
    if (st.hatch_textbox_loops_dropped) notes.push(`${st.hatch_textbox_loops_dropped} stale text-box loops dropped`);
    if (st.skipped_layer_off) notes.push(`${st.skipped_layer_off} on layers off`);
    if (st.pattern_lines_outside) notes.push(`${st.pattern_lines_outside} stray pattern lines clipped`);
    const types = Object.entries(c.drawn).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${t} ${n.toLocaleString()}`).join(" · ");
    rows.push(`<details><summary class="${f ? "bad" : ""}"><b>${esc(g)}</b> · ${d.toLocaleString()} drawn${f ? ` · ${f} failed` : ""}</summary>` +
      `<div style="display:block;padding:2px 0 6px 12px">${types}${notes.length ? "<br>" + notes.join(" · ") : ""}` +
      `${f ? "<br>" + Object.entries(c.failed).map(([t, v]) => `${t}: ${esc(v.slice(1).join("; "))}`).join("<br>") : ""}</div></details>`);
  }
  document.getElementById("check").innerHTML = (meta.instanced ? `<div style="display:block;margin-bottom:4px">Counted once per block definition</div>` : "") + rows.join("");
}
function layerPanel() {
  const box = document.getElementById("layers"), q = document.getElementById("q").value.toLowerCase();
  const n = { ...COUNT }; texts.forEach(T => n[T.key] = (n[T.key] || 0) + 1);
  const groups = meta.groups || [...new Set(meta.blocks.map(b => b.group || b.block))];
  box.innerHTML = groups.map(g => {
    const bl = meta.blocks.filter(b => (b.group || b.block) === g), mb = bl.reduce((a, b) => a + b.bytes, 0) / 1e6;
    const keys = Object.keys(n).filter(k => k.startsWith(g + "|")).sort();
    const rows = keys.filter(k => k.toLowerCase().includes(q)).map(k => {
      const l = k.slice(g.length + 1), L = meta.layers[l] || {};
      return `<label class="lyr" data-k="${esc(k)}"><input type="checkbox" ${hidden.has(k) ? "" : "checked"}><span class="sw" style="background:${L.colour}"></span><span class="nm" title="${esc(l)}">${esc(l)}</span><span class="n">${n[k].toLocaleString()}</span></label>`;
    }).join("");
    return `<div class="blk"><input type="checkbox" data-g="${esc(g)}" ${hiddenG.has(g) ? "" : "checked"}><span>${esc(g)}</span>` +
      `<span style="font-weight:400;text-transform:none;letter-spacing:0">${mb.toFixed(2)} MB · ${bl.map(b => b.block).join(", ")}</span>` +
      `<input type="range" data-a="${esc(g)}" min="0" max="1" step=".05" value="${alpha[g] ?? 1}" title="opacity" style="margin-left:auto;width:70px"></div>` + rows;
  }).join("");
  box.querySelectorAll(".lyr input").forEach(cb => cb.onchange = () => { const k = cb.closest(".lyr").dataset.k; cb.checked ? hidden.delete(k) : hidden.add(k); redraw(); });
  box.querySelectorAll("input[data-g]").forEach(cb => cb.onchange = () => { cb.checked ? hiddenG.delete(cb.dataset.g) : hiddenG.add(cb.dataset.g); redraw(); });
  box.querySelectorAll("input[data-a]").forEach(r => r.oninput = () => { alpha[r.dataset.a] = +r.value; redraw(); });
}
document.getElementById("q").oninput = layerPanel;
document.getElementById("all").onclick = () => { hidden.clear(); hiddenG.clear(); layerPanel(); redraw(); };
document.getElementById("none").onclick = () => { (meta.groups || []).forEach(g => hiddenG.add(g)); layerPanel(); redraw(); };
</script>
</body>
</html>
