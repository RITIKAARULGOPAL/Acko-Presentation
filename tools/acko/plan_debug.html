<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Debug</title>
<!-- the plan audit's viewer: open it beside tools/_work/plan-debug/ (python tools/serve.py, then /tools/acko/plan_debug.html).
     Layers: the reference render (ezdxf's drawing of the whole DXF), and what the audit extracted: fills, outlines, labels,
     issues. Click an issue to fly to it. Scroll zooms on the cursor, drag pans, double-click fits the floor. -->
<style>
  :root { --paper:#fbfaf7; --ink:#1d1d1d; --muted:#6b6b6b; --line:#dedbd4; --panel:#fff; --accent:#5222D0; --bad:#d0021b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display:grid; grid-template-columns:340px 1fr; }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside header { padding:12px 14px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0 0 2px; }
  .src { color:var(--muted); font-size:12px; word-break:break-all; }
  .sec { padding:10px 14px; border-bottom:1px solid var(--line); }
  .sec h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; font-weight:600; }
  label.tg { display:flex; align-items:center; gap:8px; padding:2px 0; cursor:pointer; }
  label.tg input[type=range] { margin-left:auto; width:90px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:3px 10px; cursor:pointer; background:#fff; font:inherit; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip b { font-weight:600; margin-left:4px; }
  #issues { overflow:auto; flex:1; min-height:0; }
  .iss { padding:7px 14px; border-bottom:1px solid #f0eee9; cursor:pointer; }
  .iss:hover, .iss.on { background:#f3f0fb; }
  .iss .k { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--bad); font-weight:600; }
  .iss .l { font-family:ui-monospace, Consolas, monospace; font-size:11px; color:var(--muted); }
  main { position:relative; overflow:hidden; background:#fff; }
  #stage { position:absolute; inset:0; width:100%; height:100%; cursor:grab; touch-action:none; }
  #stage.drag { cursor:grabbing; }
  #tip { position:absolute; pointer-events:none; background:rgba(20,20,20,.88); color:#fff; padding:4px 8px; border-radius:4px; font-size:12px; display:none; max-width:360px; }
  #hud { position:absolute; right:12px; bottom:12px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--muted); }
  .iss-mark { fill:none; stroke:var(--bad); vector-effect:non-scaling-stroke; stroke-width:2; }
  .iss-mark.on { stroke-width:4; }
  #outlines path { fill:none; vector-effect:non-scaling-stroke; stroke-width:1.2; }
  #fills path.pt { vector-effect:non-scaling-stroke; }
  .t { font-family:Arial, sans-serif; }
  @media (max-width:760px) { body { grid-template-columns:1fr; grid-template-rows:45vh 1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <header><h1>Plan debug</h1><div class="src" id="src">loading…</div></header>
  <div class="sec">
    <h2>Layers</h2>
    <label class="tg"><input type="checkbox" data-g="ref" checked> Reference (CAD render) <input type="range" data-o="ref" min="0" max="1" step=".05" value=".55"></label>
    <label class="tg"><input type="checkbox" data-g="fills" checked> Fills (extracted) <input type="range" data-o="fills" min="0" max="1" step=".05" value=".7"></label>
    <label class="tg"><input type="checkbox" data-g="outlines" checked> Outlines</label>
    <label class="tg"><input type="checkbox" data-g="text" checked> Text</label>
    <label class="tg"><input type="checkbox" data-g="issues" checked> Issues</label>
  </div>
  <div class="sec"><h2>Summary</h2><div id="sum"></div></div>
  <div class="sec"><h2>Issues</h2><div class="chips" id="kinds"></div></div>
  <div id="issues"></div>
</aside>
<main>
  <svg id="stage" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
  <div id="tip"></div>
  <div id="hud">scroll to zoom · drag to pan · double-click to fit</div>
</main>
<script>
const BASE = new URLSearchParams(location.search).get("dir") || "../_work/plan-debug/";
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById("stage"), world = document.getElementById("world"), tip = document.getElementById("tip");
let vb = [0, 0, 1, 1], frame, rep, active = new Set(), selected = null;

const setVB = () => stage.setAttribute("viewBox", vb.join(" "));
function fit(b, pad = 0.04) {
  const r = stage.getBoundingClientRect(), a = r.width / r.height;
  let [x, y, w, h] = b; x -= w * pad; y -= h * pad; w *= 1 + 2 * pad; h *= 1 + 2 * pad;
  if (w / h > a) { const nh = w / a; y -= (nh - h) / 2; h = nh; } else { const nw = h * a; x -= (nw - w) / 2; w = nw; }
  vb = [x, y, w, h]; setVB();
}
const toSvg = (X, Y) => [X - frame.ox, frame.oy - Y];      // DXF mm -> audit.svg frame

(async () => {
  const [svgText, report] = await Promise.all([fetch(BASE + "audit.svg").then(r => r.text()), fetch(BASE + "report.json").then(r => r.json())]);
  rep = report;
  const doc = new DOMParser().parseFromString(svgText, "image/svg+xml").documentElement;
  frame = { ox: +doc.getAttribute("data-ox"), oy: +doc.getAttribute("data-oy"), w: doc.viewBox.baseVal.width, h: doc.viewBox.baseVal.height };
  document.getElementById("src").textContent = rep.source + " · " + rep.seconds + " s";
  // the reference render: ezdxf's page spans the drawing's extents (rep.ref_extents, DXF mm)
  if (rep.ref_extents) {
    const [x0, y0, x1, y1] = rep.ref_extents, [sx, sy] = toSvg(x0, y1);
    const img = document.createElementNS(NS, "image");
    img.setAttribute("href", BASE + "ref.svg"); img.setAttribute("x", sx); img.setAttribute("y", sy);
    img.setAttribute("width", x1 - x0); img.setAttribute("height", y1 - y0); img.setAttribute("preserveAspectRatio", "none");
    const g = document.createElementNS(NS, "g"); g.id = "ref"; g.appendChild(img); world.appendChild(g);
  }
  for (const id of ["fills", "outlines", "text"]) {
    const g = doc.querySelector("#" + id); if (g) world.appendChild(document.importNode(g, true));
  }
  const ig = document.createElementNS(NS, "g"); ig.id = "issues"; world.appendChild(ig);
  rep.issues.forEach((it, i) => {
    const [x, y] = toSvg(it.x, it.y), c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 700); c.setAttribute("class", "iss-mark"); c.dataset.i = i;
    ig.appendChild(c);
  });
  applyOpacity();
  // fit the floor: the space outlines' extent
  const sp = rep.spaces.flatMap(s => s.pts || []);
  if (sp.length) {
    const xs = sp.map(p => p[0]), ys = sp.map(p => p[1]);
    const [a, b] = toSvg(Math.min(...xs), Math.max(...ys));
    fit([a, b, Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)]);
  } else fit([0, 0, frame.w, frame.h]);
  frame.fit = vb.slice();
  summary(); kinds(); list();
})();

function summary() {
  const f = rep.fills, o = rep.outlines, t = rep.text, by = {};
  rep.spaces.forEach(s => by[s.kind] = (by[s.kind] || 0) + 1);
  document.getElementById("sum").innerHTML =
    `<div>${f.total} fills (${f.solid} solid, ${f.pattern} pattern)</div>` +
    `<div>${rep.spaces.length} outlined spaces: ${by.room || 0} rooms, ${by.open || 0} open areas, ${by.zone || 0} neighbourhoods</div>` +
    `<div>${t.shown} texts shown; ${t.fonts.filter(x => !x.ok).length} of ${t.fonts.length} fonts need a stand-in</div>` +
    (rep.stats.hatch_textbox_loops_dropped ? `<div>${rep.stats.hatch_textbox_loops_dropped} stale text-box loops dropped from ${rep.stats.hatches_with_textbox_loops} fills</div>` : "");
}
function kinds() {
  const c = {}; rep.issues.forEach(i => c[i.kind] = (c[i.kind] || 0) + 1);
  Object.keys(c).forEach(k => active.add(k));
  document.getElementById("kinds").innerHTML = Object.entries(c).map(([k, n]) => `<button class="chip on" data-k="${k}">${k}<b>${n}</b></button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const k = b.dataset.k; active.has(k) ? active.delete(k) : active.add(k); b.classList.toggle("on"); list();
  });
}
function list() {
  const box = document.getElementById("issues");
  box.innerHTML = rep.issues.map((it, i) => active.has(it.kind) ?
    `<div class="iss${selected === i ? " on" : ""}" data-i="${i}"><div class="k">${it.kind}</div><div>${esc(it.what)}</div><div class="l">${esc(it.layer)} · ${it.x}, ${it.y}</div></div>` : "").join("");
  box.querySelectorAll(".iss").forEach(d => d.onclick = () => go(+d.dataset.i));
  document.querySelectorAll(".iss-mark").forEach(c => c.style.display = active.has(rep.issues[+c.dataset.i].kind) ? "" : "none");
}
function go(i) {
  selected = i; const it = rep.issues[i], [x, y] = toSvg(it.x, it.y);
  fit([x - 6000, y - 4000, 12000, 8000], 0);
  document.querySelectorAll(".iss-mark.on").forEach(c => c.classList.remove("on"));
  document.querySelector(`.iss-mark[data-i="${i}"]`)?.classList.add("on");
  document.querySelectorAll(".iss.on").forEach(d => d.classList.remove("on"));
  document.querySelector(`.iss[data-i="${i}"]`)?.classList.add("on");
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function applyOpacity() {
  document.querySelectorAll("input[data-o]").forEach(r => { const g = document.getElementById(r.dataset.o); if (g) g.style.opacity = r.value; });
}
document.querySelectorAll("input[data-g]").forEach(cb => cb.onchange = () => { const g = document.getElementById(cb.dataset.g); if (g) g.style.display = cb.checked ? "" : "none"; });
document.querySelectorAll("input[data-o]").forEach(r => r.oninput = applyOpacity);

// pan / zoom
let drag = null;
stage.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vb: vb.slice() }; stage.setPointerCapture(e.pointerId); stage.classList.add("drag"); });
stage.addEventListener("pointermove", e => {
  if (drag) {
    const r = stage.getBoundingClientRect(), k = vb[2] / r.width;
    vb[0] = drag.vb[0] - (e.clientX - drag.x) * k; vb[1] = drag.vb[1] - (e.clientY - drag.y) * k; setVB();
  }
  const t = e.target, l = t.getAttribute && t.getAttribute("data-l");
  if (!drag && (l || t.classList?.contains("iss-mark"))) {
    tip.style.display = "block"; tip.style.left = (e.offsetX + 14) + "px"; tip.style.top = (e.offsetY + 14) + "px";
    tip.textContent = t.classList.contains("iss-mark") ? rep.issues[+t.dataset.i].what : l + (t.getAttribute("data-p") ? " · " + t.getAttribute("data-p") : "");
  } else tip.style.display = "none";
});
stage.addEventListener("pointerup", () => { drag = null; stage.classList.remove("drag"); });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect(), k = Math.exp(e.deltaY * 0.0015);
  const mx = vb[0] + (e.clientX - r.left) / r.width * vb[2], my = vb[1] + (e.clientY - r.top) / r.height * vb[3];
  vb = [mx - (mx - vb[0]) * k, my - (my - vb[1]) * k, vb[2] * k, vb[3] * k]; setVB();
}, { passive: false });
stage.addEventListener("dblclick", () => frame?.fit && (vb = frame.fit.slice(), setVB()));
addEventListener("resize", () => frame?.fit && fit(frame.fit, 0));
</script>
</body>
</html>
