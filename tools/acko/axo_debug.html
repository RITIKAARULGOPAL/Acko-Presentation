<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axo Debug</title>
<!-- the axo's walls, one object at a time (Ritika, 30 Oct: "remove all walls apart from the core walls of sketchup.. i want the
     debug to be like the plan hover debug wher i can selecct each object", then "have it as layer so i can turn on and off the
     objects./.. alos show the vector plan so i can select the objects", "now extrude all columns alone.. have a separate layer", "now the external glazing").
     Open it beside tools/_work/axo-debug/ (python -I
     tools/acko/axo_debug.py, python tools/serve.py 8774, then /tools/acko/axo_debug.html).
     The SketchUp model's core alone (its "mass" part, data/axo-skp.js), every wall piece A day in ACKO extrudes from the floor
     plan as its own object, and the floor plan itself (data/plan-base.js, walked as assets/js/plan-canvas.js walks it, in the
     Layout slide's colours or its layers') flat on the floor under them. A joined run of walls is its segments, each its own
     object, and each can be called wall, solid, glass or door (W S G D; Shift-click selects more): the calls stay in this
     browser and download as axo-debug-calls.json. Hover for what a piece or a plan line is; click a piece
     to select it (purple; its plan lines in red), click a plan line or fill to select it (the pieces it makes in purple). Each
     floor plan layer can be turned off: its lines, and the pieces made from it. The deck's axo mouse: drag pans, right-drag (or
     Shift-drag) turns, scroll zooms on the cursor, double-click fits the floor; Esc lets go. -->
<style>
  :root { --paper:#fbfaf7; --ink:#1d1d1d; --muted:#6b6b6b; --line:#dedbd4; --panel:#fff; --accent:#5222D0; --bad:#d0021b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display:grid; grid-template-columns:380px 1fr; }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside header { padding:10px 14px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0 0 2px; }
  .src { color:var(--muted); font-size:12px; word-break:break-word; }
  .sec { padding:8px 14px; border-bottom:1px solid var(--line); }
  .sec h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chips + .chips { margin-top:6px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 9px; cursor:pointer; background:#fff; font:inherit; font-size:12px; display:inline-flex; align-items:center; gap:5px; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip b { font-weight:600; }
  .chips .lab { color:var(--muted); font-size:12px; align-self:center; }
  .sw { width:10px; height:10px; border-radius:2px; display:inline-block; flex:none; border:1px solid rgba(0,0,0,.15); }
  #sum { font-size:12px; }
  #sum .bad { color:var(--bad); }
  #info { display:none; max-height:42vh; overflow:auto; }
  #info.on { display:block; }
  #info .hd { display:flex; align-items:baseline; gap:8px; }
  #info .hd b { font-size:14px; }
  .calls { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin:6px 0 4px; }
  .tagd { color:#fff; border-radius:999px; padding:0 8px; font-size:11px; font-weight:600; }
  .pc .t { font-size:10px; color:#fff; border-radius:999px; padding:0 6px; margin-left:4px; font-weight:600; text-transform:none; letter-spacing:0; }
  #calls .bad { color:var(--bad); }
  #info .x { margin-left:auto; border:0; background:none; cursor:pointer; color:var(--muted); font-size:16px; line-height:1; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; margin:6px 0 8px; }
  .kv span:nth-child(odd) { color:var(--muted); }
  .kv .p { font-family:ui-monospace, Consolas, monospace; font-size:11px; word-break:break-all; }
  .cut { color:#b35c00; font-weight:600; }
  table.sl { width:100%; border-collapse:collapse; font-size:11px; }
  table.sl th { text-align:left; color:var(--muted); font-weight:600; padding:2px 4px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; }
  table.sl td { padding:3px 4px; border-bottom:1px solid #f0eee9; vertical-align:top; }
  table.sl tr[data-j], table.sl tr[data-p] { cursor:pointer; }
  table.sl tr:hover td { background:#fff1f0; }
  table.sl tr.no td { color:#9a9a9a; }
  table.sl .p { font-family:ui-monospace, Consolas, monospace; word-break:break-all; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:0; border-bottom:2px solid transparent; background:none; padding:7px 0; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; }
  .tabs button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .pane { display:none; flex:1; min-height:0; flex-direction:column; }
  .pane.on { display:flex; }
  .filter { display:flex; gap:6px; padding:8px 14px; border-bottom:1px solid var(--line); align-items:center; }
  .filter input { flex:1; min-width:0; font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:4px; }
  .filter .chip { flex:none; }
  .scroll { overflow:auto; flex:1; min-height:0; }
  .pc { padding:6px 14px; border-bottom:1px solid #f0eee9; cursor:pointer; display:grid; grid-template-columns:auto 1fr auto; gap:0 8px; align-items:baseline; }
  .pc:hover, .pc.hov { background:#f7f5fc; }
  .pc.on { background:#ece6fb; }
  .pc .k { font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .pc .a { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  .pc .l { grid-column:1 / -1; font-family:ui-monospace, Consolas, monospace; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lh { padding:6px 14px 3px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; background:#faf9f6; border-bottom:1px solid #f0eee9; }
  .ly { display:flex; align-items:center; gap:7px; padding:3px 14px; border-bottom:1px solid #f4f2ee; cursor:pointer; }
  .ly:hover { background:#f7f5fc; }
  .ly.off { color:#9a9a9a; }
  .ly .n { font-family:ui-monospace, Consolas, monospace; font-size:11px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ly .c { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ly .only { border:1px solid var(--line); background:#fff; border-radius:4px; font:inherit; font-size:10px; padding:0 5px; cursor:pointer; visibility:hidden; color:var(--muted); }
  .ly:hover .only { visibility:visible; }
  main { position:relative; overflow:hidden; background:#fff; }
  #stage { position:absolute; inset:0; width:100%; height:100%; cursor:grab; touch-action:none; display:block; }
  #stage.hot { cursor:pointer; }
  #stage.drag { cursor:grabbing; }
  #tip { position:absolute; pointer-events:none; background:rgba(20,20,20,.88); color:#fff; padding:4px 8px; border-radius:4px; font-size:12px; display:none; max-width:400px; }
  #hud { position:absolute; right:12px; bottom:12px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--muted); }
  #msg { position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); color:var(--muted); }
  #xmsg { position:absolute; left:50%; top:16px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:6px 12px; border-radius:999px; font-size:12px; }
  #xout { position:absolute; right:12px; top:12px; width:min(420px, calc(100% - 24px)); max-height:calc(100% - 60px); overflow:auto; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; box-shadow:0 6px 24px rgba(0,0,0,.12); }
  #xout .hd { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  #xout .hd span { color:var(--muted); font-size:12px; }
  #xout .x { margin-left:auto; border:0; background:none; cursor:pointer; color:var(--muted); font-size:16px; }
  #xout .im { display:block; margin-bottom:8px; color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  #xout .im img { display:block; width:100%; }
  #xout .im.tr img { background:repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  #xout .im span { display:flex; justify-content:space-between; padding:4px 8px; font-size:12px; text-transform:capitalize; }
  #xout .im i { font-style:normal; color:var(--muted); }
  @media (max-width:760px) { body { grid-template-columns:1fr; grid-template-rows:50vh 1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <header><h1>Axo debug</h1><div class="src" id="src">loading…</div></header>
  <div class="sec"><h2>Show</h2><div class="chips" id="show"></div><div class="chips" id="opts"></div></div>
  <div class="sec"><div id="sum"></div></div>
  <div class="sec" id="calls"></div>
  <div class="sec" id="info"></div>
  <div class="tabs"><button class="on" data-t="pieces">Pieces</button><button data-t="layers">Layers</button></div>
  <div class="pane on" id="p-pieces">
    <div class="filter"><input id="q" type="search" placeholder="filter by layer or block name…" autocomplete="off"></div>
    <div class="scroll" id="list"></div>
  </div>
  <div class="pane" id="p-layers">
    <div class="filter"><input id="lq" type="search" placeholder="filter layers…" autocomplete="off">
      <button class="chip" data-a="all">all</button><button class="chip" data-a="none">none</button><button class="chip" data-a="walls">wall layers</button></div>
    <div class="scroll" id="layers"></div>
  </div>
</aside>
<main>
  <canvas id="stage"></canvas>
  <div id="tip"></div>
  <div id="msg">loading the model and the floor plan…</div>
  <div id="hud">drag to pan · right-drag to turn · scroll to zoom · double-click to fit · Shift-click to select more · W S G D to call · Esc to let go</div>
</main>
<script src="../../assets/vendor/three.min.js"></script>
<script>
const BASE = new URLSearchParams(location.search).get("dir") || "../_work/axo-debug/";
const T = THREE, $ = (s) => document.querySelector(s);
const COL = { wall: 0x77716a, solid: 0xd9cbb0, glass: 0x52b6d1, door: 0xd97706, column: 0x5b6770, facade: 0x2fa58c, booth: 0x9a7650, cut: 0xff9f1c, core: 0xbdb8b0, pick: 0x5222d0, src: 0xd0021b, hot: 0xff4040 };
// the Layout slide's plan theme (assets/css/plan-hover.css, --ph-*) and its classes (assets/js/plan-canvas.js)
const PH = { wall: 0x1a1a1a, glass: 0x3a7bbf, door: 0x555555, furn: 0x5d5d5d, green: 0x4c8a46, shade: 0xa3a3a3, anno: 0x555555, base: 0x2a2a2a,
  hatch: 0xc4c4c4, fill: 0xe8e6e1, fillGreen: 0xcfe3cb, fillGlass: 0xd6e6f5 };
const GLASS = /GLASS|GLSS|GLS|GLAZ|_IN_GL\b/i, GREEN = /PLANT|PLNT|GRASS|LANDSCAP|TREE|SHRUB|VEG/i, DOORS = /DOOR|_DOR_|DOR-/i, WALL = /WALL|PART|PRTN|COLS|S-COL|CORE|STRU/i;
const FURN = /FURN|\bFUR\b|_FUR_|CHAIR|TABLE|SEAT|SOFA|STORAGE|TV UNIT|^AC_WS_|EQPM|MLWK|FIXT|PLBG|ELEV/i, SHADE = /SHADE|PATT|HATCH/i, ANNO = /ANNO|TEXT|DIM|TAG|IDEN/i;
const cls = (layer, group, veg) => veg || group === "vegetation" || GREEN.test(layer) ? "green" : GLASS.test(layer) ? "glass"
  : DOORS.test(layer) ? "door" : WALL.test(layer) ? "wall" : FURN.test(layer) ? "furn" : SHADE.test(layer) ? "shade" : ANNO.test(layer) ? "anno" : "base";
const KINDS = ["line", "fill", "hatch", "mask"], KIND = { s: 0, f: 1, h: 2, m: 3 };
const show = { wall: true, solid: true, glass: true, door: true, furniture: true, column: true, facade: true, booth: true, cut: false, core: true, plan: true };
const opt = { colour: "plan", ghost: false, through: false };
let D, P, cam, renderer, scene, view, touched = false, asp = 1, X, Z, query = "", lquery = "", tab = "pieces";
let sel = null, hovered = -1, hotItem = -1, linked = new Set(), picked = new Set(), onlyCalled = false;   // sel: {piece: id} or {item: i}
// Ritika's calls on the segments ("so i can say which is glass and which are doors"): {segment key: wall|solid|glass|door}
const TAGS = { wall: 0x77716a, solid: 0xd9cbb0, glass: 0x52b6d1, door: 0xd97706 }, TKEY = { w: "wall", s: "solid", g: "glass", d: "door" };
let tags = {}; try { tags = JSON.parse(localStorage.getItem("axo-debug-calls") || "{}") || {}; } catch (_) { tags = {}; }
const saveTags = () => { try { localStorage.setItem("axo-debug-calls", JSON.stringify(tags)); } catch (_) { /* private window: this session only */ } };
const meshes = [], G = {}, layerOn = {}, layerObj = {};
const stage = $("#stage"), tip = $("#tip");

const script = (src) => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error(src)); document.head.appendChild(s); });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hex = (n) => "#" + n.toString(16).padStart(6, "0");

(async () => {
  try {
    [D] = await Promise.all([fetch(BASE + "debug.json").then((r) => { if (!r.ok) throw new Error(BASE + "debug.json: " + r.status + " (run python -I tools/acko/axo_debug.py)"); return r.json(); }),
      script("../../data/axo-skp.js"), script("../../data/plan-base.js"), script("../../data/plan-dxf.js"), script("../../data/axo-dxf.js")]);
    await script("../../assets/js/axo-model.js"); await script("../../assets/js/axo-skp.js");
  } catch (e) { $("#msg").textContent = e.message; $("#src").textContent = "not loaded"; return; }
  X = (x) => (x - D.CX) / 1000; Z = (y) => (y - D.CY) / 1000;
  $("#src").textContent = `floor plan (data/plan-base.js) shifted ${D.shift.join(", ")} mm onto ${window.AXO_SKP.source || "the SketchUp model"}`;
  P = walkPlan(); link(); heal();
  build(); chips(); summary(); list(); layers(); callsBox();
  addEventListener("resize", resize); resize(); fit(); $("#msg").remove();
})();

// ---------- the floor plan: data/plan-base.js walked as tools/acko/axo_skp_28_walls.plan_base_lines walks it (its "base" group
// in that order, so item k there is item k here; the other groups after it), as plan-canvas.js: an insert on a frozen layer and
// anything on an off one left out; in plan mm, shifted onto the model as the axo's walls are ----------
function walkPlan() {
  const PB = window.PLAN_BASE, LY = PB.layers, [ox, oy] = PB.origin, [sx, sy] = D.shift;
  const pts = [], start = [], n = [], lay = [], kind = [], path = [], py = [], cl = [], grp = [], names = [], nameIx = new Map(), paths = [], pathIx = new Map();
  const id = (map, list, s) => { let i = map.get(s); if (i === undefined) { i = list.length; map.set(s, i); list.push(s); } return i; };
  let k0 = 0, g0 = 0;
  for (const blk of PB.blocks) {
    const base = blk.group === "base", Dd = blk.data, defs = Dd.defs, lay_ = (l, ctx) => (l === "" || l === "0" ? ctx : l);
    const walk = (di, M, ctx, pth, veg) => {
      const d = defs[di], k = Math.pow(10, -d.q), [a, b, c, e, f, g] = M, pid = id(pathIx, paths, pth || "(the plan itself)"); veg = veg || !!d.veg;
      for (const [l, , , , kd, items] of d.runs) {
        const st = lay_(l, ctx);
        if (kd === "i") {
          if (LY[st] && LY[st].frozen) continue;
          for (const [ci, ca, cb, cc, cd, ce, cf] of items) {
            const nm = defs[ci].name;
            walk(ci, [a * ca + c * cb, b * ca + e * cb, a * cc + c * cd, b * cc + e * cd, a * ce + c * cf + f, b * ce + e * cf + g], st, nm ? (pth ? pth + " > " + nm : nm) : pth, veg);
          }
          continue;
        }
        if (kd === "t" || (LY[st] && (LY[st].off || LY[st].frozen))) continue;
        const li = id(nameIx, names, st), cs = cls(st, blk.group, veg);
        for (const item of items) {
          g0++;
          for (const arr of kd === "f" ? item : [item]) {
            start.push(pts.length / 2); let x = arr[0], y = arr[1];
            for (let i = 0; i < arr.length; i += 2) { if (i) { x += arr[i]; y += arr[i + 1]; } const XX = x * k, YY = y * k; pts.push(a * XX + c * YY + f - ox + sx, oy - (b * XX + e * YY + g) + sy); }
            n.push(arr.length / 2); lay.push(li); kind.push(KIND[kd] ?? 0); path.push(pid); py.push(base ? k0++ : -1); cl.push(cs); grp.push(g0);
          }
        }
      }
    };
    walk(Dd.root, Dd.place.m, lay_(Dd.place.spec[0], "0"), "", false);
  }
  const N = start.length, I = { pts: new Float64Array(pts), start: Uint32Array.from(start), n: Uint32Array.from(n), lay: Uint16Array.from(lay), kind: Uint8Array.from(kind),
    path: Uint32Array.from(path), py: Int32Array.from(py), cls: cl, grp: Uint32Array.from(grp), names, paths, N, colours: Object.fromEntries(names.map((L) => [L, (LY[L] && LY[L].colour) || "#000000"])) };
  I.byPy = new Int32Array(k0).fill(-1); for (let i = 0; i < N; i++) if (I.py[i] >= 0) I.byPy[I.py[i]] = i;
  // a grid of the items' boxes (CELL mm) to find what is under the cursor
  const CELL = 2000; I.box = new Float64Array(N * 4); I.grid = new Map(); I.CELL = CELL;
  for (let i = 0; i < N; i++) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; const s = I.start[i] * 2;
    for (let j = 0; j < I.n[i]; j++) { const x = I.pts[s + 2 * j], y = I.pts[s + 2 * j + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    I.box.set([x0, y0, x1, y1], i * 4);
    for (let cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++) for (let cy = Math.floor(y0 / CELL); cy <= Math.floor(y1 / CELL); cy++) {
      const key = cx * 100000 + cy, c = I.grid.get(key); if (c) c.push(i); else I.grid.set(key, [i]);
    }
  }
  return I;
}
const ptsOf = (i) => { const s = P.start[i] * 2, out = []; for (let j = 0; j < P.n[i]; j++) out.push([P.pts[s + 2 * j], P.pts[s + 2 * j + 1]]); return out; };
const layerOf = (i) => P.names[P.lay[i]];
const lenOf = (i) => { const q = ptsOf(i); let m = 0; for (let j = 1; j < q.length; j++) m += Math.hypot(q[j][0] - q[j - 1][0], q[j][1] - q[j - 1][1]); if (P.kind[i] === 1 && q.length > 2) m += Math.hypot(q[0][0] - q.at(-1)[0], q[0][1] - q.at(-1)[1]); return m; };
const areaOf = (q) => { let s = 0; for (let j = 0, k = q.length - 1; j < q.length; k = j++) s += q[k][0] * q[j][1] - q[j][0] * q[k][1]; return Math.abs(s) / 2; };

// the debug.json's wall lines onto the plan's items (their place in plan_base_lines), and each line's pieces
function link() {
  D.item = new Int32Array(D.lines.length).fill(-1); let bad = 0;
  D.lines.forEach((l, j) => {
    const i = l.i !== undefined && l.i < P.byPy.length ? P.byPy[l.i] : -1;
    if (i < 0 || layerOf(i) !== l.L || Math.hypot(P.pts[P.start[i] * 2] - l.pts[0][0], P.pts[P.start[i] * 2 + 1] - l.pts[0][1]) > 2) { bad++; return; }
    D.item[j] = i;
  });
  D.unmatched = bad;
  P.line = new Int32Array(P.N).fill(-1); D.item.forEach((i, j) => i >= 0 && (P.line[i] = j));
  D.ofLine = D.lines.map(() => []);
  D.pieces.forEach((pc) => {
    const feeds = new Set(D.feeds[pc.ty]); pc.feedL = [...new Set(pc.src.map(([j]) => D.lines[j].L).filter((L) => feeds.has(L)))];
    pc.src.forEach(([j, m]) => D.ofLine[j].push([pc.id, m, feeds.has(D.lines[j].L)]));
  });
}

// ---------- the scene ----------
function build() {
  renderer = new T.WebGLRenderer({ canvas: stage, antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setClearColor(0xffffff);
  scene = new T.Scene(); cam = new T.OrthographicCamera(-1, 1, 1, -1, 1, 900);
  for (const k of ["floor", "skpfloor", "plan", "core", "wall", "solid", "glass", "column", "facade", "booth", "furniture", "cut", "src", "hot", "pick"]) { G[k] = new T.Group(); scene.add(G[k]); }
  G.skpfloor.visible = false;                                           // (the model's floors: the image export's alone)
  scene.add(new T.HemisphereLight(0xffffff, 0xb9b4c6, 0.8));
  const key = new T.DirectionalLight(0xffffff, 0.55); key.position.set(-40, 90, 60); scene.add(key);
  // the slab, a pale floor with its outline
  const slab = new T.Shape(D.slab.map(([x, y]) => new T.Vector2(X(x), -Z(y))));
  const fl = new T.Mesh(new T.ShapeGeometry(slab), new T.MeshBasicMaterial({ color: 0xfbfaf7, side: T.DoubleSide, polygonOffset: true, polygonOffsetFactor: 4, polygonOffsetUnits: 4 }));
  fl.rotation.x = -Math.PI / 2; G.floor.add(fl);

      (pc.core_box ? `<span>note</span><span class="cut">by the core: here only, the axo clips it away (it takes the core as its box)</span>` : "") +
      (pc.name ? `<span>façade type</span><span>${esc(pc.name)}</span><span>block</span><span class="p">${esc(pc.block)}</span>` : "") + `</div>` +
      `<table class="sl"><thead><tr><th>layer</th><th>block path</th><th>m</th><th>in</th></tr></thead><tbody>` +
      srcLines(pc).slice(0, 300).map(([l, m, j]) => `<tr data-j="${j}" class="${feeds.has(l.L) ? "" : "no"}" title="${feeds.has(l.L) ? "click: select it on the plan" : "this layer doesn't make " + pc.ty + " (only near it)"}"><td>${esc(l.L)}${l.k === "f" ? " (fill)" : ""}</td><td class="p">${esc(l.path)}</td><td>${l.m}</td><td>${m}</td></tr>`).join("") +
      `</tbody></table>` + (pc.src.length > 300 ? `<div class="src">… and ${pc.src.length - 300} more lines (all drawn red)</div>` : "") + (pc.src.length ? `<div class="src" style="margin-top:6px">m: the line's length · in: its length within 30 mm of the piece · grey: a layer that doesn't make ${pc.ty} · click a row to select the line</div>` : `<div class="src">no plan lines within 30 mm</div>`);

    info.querySelectorAll("tr[data-j]").forEach((tr) => {

  }
  info.classList.add("on");

// a call whose segment the data no longer has (its key, the segment's inner point to the mm, moved as the plan or the splitting
// changed): moved to the one segment of its type whose key is within HEAL mm of it, not called already
const HEAL = 100;
function heal() {
  const keys = new Set(D.pieces.map((p) => p.key)), at = (k) => { const m = /^(\w+):(-?\d+),(-?\d+)/.exec(k); return m && [m[1], +m[2], +m[3]]; };
  let moved = 0;
  for (const [key, t] of Object.entries(tags)) {

    const a = at(key); if (!a) continue;
    const near = D.pieces.filter((p) => { const b = at(p.key); return b && b[0] === a[0] && !tags[p.key] && Math.hypot(b[1] - a[1], b[2] - a[2]) <= HEAL; });
    if (near.length === 1) { delete tags[key]; tags[near[0].key] = t; moved++; }

// a call on the selected segments: kept in this browser (localStorage), shown in its type's colour
function call(tag) {

  saveTags(); pieceInfo(); chips(); list(); callsBox(); draw();
}
function callsBox() {
  const keys = new Set(D.pieces.map((p) => p.key)), n = {}; let lost = 0;
  for (const [key, t] of Object.entries(tags)) { if (keys.has(key)) n[t] = (n[t] || 0) + 1; else lost++; }
  const total = Object.values(n).reduce((a, b) => a + b, 0);
  $("#calls").innerHTML = `<h2>Calls</h2>` + (total || lost
    ? `<div>${Object.entries(n).map(([t, c]) => `<i class="sw" style="background:${hex(TAGS[t])}"></i> ${c} ${t}`).join(" · ") || "none"}${lost ? ` <span class="bad">· ${lost} on segments no longer drawn</span>` : ""}</div>` +
      `<div class="chips" style="margin-top:6px"><button class="chip" id="dl">download (axo-debug-calls.json)</button><button class="chip${onlyCalled ? " on" : ""}" id="oc">list the called only</button><button class="chip" id="ca">clear all</button></div>`
    : `<div class="src">Select a segment (Shift-click for more) and call it wall, solid, glass or door: keys W S G D, X takes the call off. The calls stay in this browser; download them to hand over.</div>`);
  $("#dl")?.addEventListener("click", download);
  $("#oc")?.addEventListener("click", () => { onlyCalled = !onlyCalled; list(); callsBox(); });
  $("#ca")?.addEventListener("click", () => { if (!confirm("Take every call off?")) return; tags = {}; saveTags(); D.pieces.forEach((p) => restyle(p.id)); if (picked.size) pieceInfo(); chips(); list(); callsBox(); draw(); });
}
function download() {
  const byKey = Object.fromEntries(D.pieces.map((p) => [p.key, p]));
  const out = { made: new Date().toISOString(), page: "tools/acko/axo_debug.html", frame: "plan mm, y down, the floor plan shifted " + D.shift.join(", ") + " mm onto the SketchUp model",
    calls: Object.entries(tags).map(([key, tag]) => { const p = byKey[key];
      return { key, call: tag, ...(p ? { was: p.ty, run: p.run || null, area: p.area, width: p.width, box: p.box, rings: p.rings, layers: p.feedL } : { lost: true }) }; }) };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
  a.download = "axo-debug-calls.json"; document.body.appendChild(a); a.click(); a.remove();
}
// a plan item: its layer, block path, size, and the pieces it makes (purple)
function selectItem(i, go) {
  clear(); if (i < 0) { draw(); return; }
  sel = { item: i }; const kd = P.kind[i], L = layerOf(i), j = P.line[i], q = ptsOf(i);
  const ps = j >= 0 ? D.ofLine[j] : [];
  ps.forEach(([id, , f]) => f && linked.add(id)); linked.forEach(paint);
  G.pick.add(flat([closed(i)], COL.src, 0.01, true)); if (kd === 1) { const f = fillOver(ringsOf(i), COL.src); f && G.pick.add(f); }
  document.querySelectorAll(".pc").forEach((d) => d.classList.toggle("on", linked.has(+d.dataset.i)));
  const xs = q.map((p) => p[0]), ys = q.map((p) => p[1]), axo = j >= 0, rings = kd === 1 ? ringsOf(i) : null;

    `<div class="kv"><span>layer</span><span><i class="sw" style="background:${hex(layerCol(L))}"></i> ${esc(L)}</span><span>block path</span><span class="p">${esc(P.paths[P.path[i]])}</span>` +
    (kd === 1 ? `<span>area</span><span>${(areaOf(q) / 1e6).toFixed(3)} m²${rings.length > 1 ? ` (one of ${rings.length} rings)` : ""}</span><span>perimeter</span><span>${(lenOf(i) / 1000).toFixed(2)} m</span>`
      : `<span>length</span><span>${(lenOf(i) / 1000).toFixed(2)} m</span>`) +
    `<span>points</span><span>${q.length}</span><span>extent</span><span>${((Math.max(...xs) - Math.min(...xs)) / 1000).toFixed(2)} × ${((Math.max(...ys) - Math.min(...ys)) / 1000).toFixed(2)} m</span>` +
    `<span>from</span><span>${Math.round(q[0][0])}, ${Math.round(q[0][1])} mm</span></div>` +
    (!axo ? `<div class="src">The axo doesn't read this layer: it makes no wall.</div>`
      : ps.length ? `<table class="sl"><thead><tr><th>piece</th><th>type</th><th>m²</th><th>in</th><th></th></tr></thead><tbody>` +
        ps.map(([id, m, f]) => { const pc = D.pieces[id]; return `<tr data-p="${id}" class="${f ? "" : "no"}"><td>#${id}</td><td>${pc.ty}${pc.cut ? " (cut)" : ""}</td><td>${pc.area}</td><td>${m}</td><td>${f ? "makes it" : "only near it"}</td></tr>`; }).join("") +
        `</tbody></table><div class="src" style="margin-top:6px">in: the line's length within 30 mm of the piece · click a row to select the piece</div>`
      : `<div class="src">A wall layer, but no piece within 30 mm of it (its region wasn't a wall: too wide, open, cut away by the slab's edge or the core).</div>`);
  info.classList.add("on");
  info.querySelector(".x").onclick = () => { clear(); draw(); };
  info.querySelectorAll("tr[data-p]").forEach((tr) => {
    const id = +tr.dataset.p; tr.onmouseenter = () => hover(id); tr.onmouseleave = () => hover(-1); tr.onclick = () => selectPiece(id, true);
  });
  if (go) flyTo(frame([[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]], view.theta, view.phi, 2.4, 1.2)); else draw();
}

// ---------- the mouse: the deck's axo one ----------
const ray = new T.Raycaster();
function pickPiece(e) {
  if (opt.through) return -1;
  const r = stage.getBoundingClientRect();
  ray.setFromCamera(new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), cam);
  const live = meshes.filter((m) => m && m.visible && m.parent.visible);
  const hit = ray.intersectObjects(live, false)[0];
  return hit ? hit.object.userData.id : -1;
}
// the plan item under the cursor: the nearest line within a few pixels (a hatch line only if nothing else is), else the smallest
// fill around it
function pickItem(e) {
  if (!show.plan) return -1;
  const g = ground(e, view), x = g.x * 1000 + D.CX, y = g.z * 1000 + D.CY, tol = (6 * 2 * view.half * 1000) / stage.clientHeight, C = P.CELL;
  let best = -1, bd = tol, fill = -1, fa = Infinity; const seen = new Set();
  for (let cx = Math.floor((x - tol) / C); cx <= Math.floor((x + tol) / C); cx++) for (let cy = Math.floor((y - tol) / C); cy <= Math.floor((y + tol) / C); cy++) {
    for (const i of P.grid.get(cx * 100000 + cy) || []) {
      if (seen.has(i)) continue; seen.add(i);
      if (!layerOn[layerOf(i)]) continue;
      const b = i * 4; if (x < P.box[b] - tol || x > P.box[b + 2] + tol || y < P.box[b + 1] - tol || y > P.box[b + 3] + tol) continue;
      const s = P.start[i] * 2, n = P.n[i], kd = P.kind[i], pen = kd === 2 ? tol * 0.6 : 0;
      for (let j = 1; j < n + (kd === 1 && n > 2 ? 1 : 0); j++) {
        const a = (j - 1) * 2, c = (j % n) * 2, ax = P.pts[s + a], ay = P.pts[s + a + 1], bx = P.pts[s + c], by = P.pts[s + c + 1];
        const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, t = L2 ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L2)) : 0;
        const d = Math.hypot(x - ax - t * dx, y - ay - t * dy) + pen; if (d < bd) { bd = d; best = i; }
      }
      if (kd === 1 && x >= P.box[b] && x <= P.box[b + 2] && y >= P.box[b + 1] && y <= P.box[b + 3]) {
        let inside = false; for (let j = 0, k = n - 1; j < n; k = j++) { const xj = P.pts[s + 2 * j], yj = P.pts[s + 2 * j + 1], xk = P.pts[s + 2 * k], yk = P.pts[s + 2 * k + 1];
          if ((yj > y) !== (yk > y) && x < ((xk - xj) * (y - yj)) / (yk - yj) + xj) inside = !inside; }
        const ar = (P.box[b + 2] - P.box[b]) * (P.box[b + 3] - P.box[b + 1]); if (inside && ar < fa) { fa = ar; fill = i; }
      }
    }

}
function ground(e, v) {
  const r = stage.getBoundingClientRect(), nx = ((e.clientX - r.left) / r.width) * 2 - 1, ny = -((e.clientY - r.top) / r.height) * 2 + 1;
  apply(v); const { f, right, up } = basis(v);
  const o = cam.position.clone().add(right.multiplyScalar(nx * v.half * asp)).add(up.multiplyScalar(ny * v.half));
  return o.add(f.multiplyScalar(-o.y / f.y));
}
function at(e) { apply(view); const id = pickPiece(e); return id >= 0 ? { piece: id } : { item: pickItem(e) }; }
let drag = null, moveDue = null;
stage.addEventListener("pointerdown", (e) => { if (!view || e.button > 2) return; fly = null; drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, on: false, turn: e.button === 2 || e.shiftKey, b: e.button }; try { stage.setPointerCapture(e.pointerId); } catch (_) { /* not an active pointer */ } });
stage.addEventListener("pointermove", (e) => {
  if (!view) return;
  if (!drag) {

    moveDue = e; requestAnimationFrame(() => { const ev = moveDue; moveDue = null; if (!drag) hoverAt(ev); });
    return;
  }
  if (!drag.on && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 3) return;      // a click, not a drag
  drag.on = true; touched = true; stage.classList.add("drag"); tip.style.display = "none"; hover(-1); hoverItem(-1);
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, v = view; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.turn) view = Object.assign({}, v, { theta: v.theta - dx * 0.005, phi: Math.max(0.05, Math.min(1.45, v.phi - dy * 0.004)) });
  else {
    const { right, up } = basis(v), k = (2 * v.half) / stage.clientHeight, m = right.multiplyScalar(-dx * k).add(up.multiplyScalar(dy * k));
    view = Object.assign({}, v, { t: [v.t[0] + m.x, v.t[1] + m.y, v.t[2] + m.z] });
  }
  draw();
});
function hoverAt(e) {
  const h = at(e), r = stage.getBoundingClientRect(); hover(h.piece ?? -1); hoverItem(h.item ?? -1);
  const on = (h.piece ?? -1) >= 0 || (h.item ?? -1) >= 0; stage.classList.toggle("hot", on);
  if (!on) { tip.style.display = "none"; return; }
  tip.style.display = "block"; tip.style.left = (e.clientX - r.left + 14) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px";
  if (h.piece !== undefined) {
    const pc = D.pieces[h.piece], L = layersOf(pc).slice(0, 3).map(([L, n]) => L + " ×" + n).join(", ");

  } else {
    const i = h.item, j = P.line[i], n = j >= 0 ? D.ofLine[j].filter(([, , f]) => f).length : 0;
    tip.textContent = `plan ${KINDS[P.kind[i]]} · ${layerOf(i)} · ${P.paths[P.path[i]]} · ${(lenOf(i) / 1000).toFixed(2)} m` + (j >= 0 ? ` · makes ${n} piece${n === 1 ? "" : "s"}` : "");
  }

const up = (e) => {

  }

stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("pointerleave", () => { if (!drag) { hover(-1); hoverItem(-1); tip.style.display = "none"; } });
stage.addEventListener("contextmenu", (e) => e.preventDefault());

  if (!view) return; e.preventDefault(); fly = null; touched = true;

stage.addEventListener("dblclick", () => { if (view) { touched = false; flyTo(frame(D.slab, view.theta, view.phi, 3.5, 0.04)); touched = false; } });
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && sel) { clear(); draw(); return; }
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey || !picked.size) return;
  const k = e.key.toLowerCase();

});
