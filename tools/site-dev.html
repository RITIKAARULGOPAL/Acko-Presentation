<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Site Dev</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0f0d; color: #e9efeb; font: 12px/1.4 ui-monospace, Consolas, monospace; overflow: hidden; }
  #host { position: fixed; inset: 0; }
  #host canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
  #ui button { background: rgba(20,28,25,.85); color: inherit; border: 1px solid #2f4a3f; border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<!-- dev harness for assets/js/site.js: the twin with the site layer, no chapters -->
<div id="host"></div>
<!-- ?overlay: SKV's atrium photomontage over the 3D view, for matching its camera -->
<img id="overlay" src="../assets/img/soc-night.webp" alt="" style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;pointer-events:none;display:none;z-index:1">
<div id="ui">
  <button data-v="site">site</button><button data-v="gate">gate</button><button data-v="forecourt">forecourt</button>
  <button data-v="atrium">atrium</button><button data-v="floor">into Level 03</button>
  <button id="theme">theme</button><button id="night">night</button><button id="opt">option</button><button id="cut">cut</button>
</div>
<script src="../assets/vendor/three.min.js"></script>
<script src="../data/plan-data.js"></script>
<script src="../data/plan-textures.js"></script>
<script src="../data/site-data.js"></script>
<script src="../assets/js/twin.js"></script>
<script src="../assets/js/site.js"></script>
<script>
const twin = new Twin();
twin.attach(document.getElementById("host"));
twin.attachSite(new TwinSite(twin));
twin.setLayers({ site: true, cut: false, furn: true, walls: true, people: false });
window.twin = twin;
// frame a view from an eye point at a target (twin coords; ground is y = -12)
const G = -MX_SITE.slabZ, EYE = G + 1.6;
function lookFrom(cam, tgt) {
  const dx = cam[0] - tgt[0], dy = cam[1] - tgt[1], dz = cam[2] - tgt[2], r = Math.hypot(dx, dy, dz);
  return { r, phi: Math.acos(dy / r), theta: Math.atan2(dx, dz), tx: tgt[0], ty: tgt[1], tz: tgt[2] };
}
const VIEWS = window.SITE_VIEWS = {
  site: { theta: -2.3, phi: 0.95, r: 330, tx: -30, ty: -8, tz: -10 },
  gate: lookFrom([-82, EYE, 6], [-30, -1, -8]),
  forecourt: lookFrom([-46, EYE, -24], [-14, 1, -14]),
  atrium: lookFrom([12, EYE, -25], [-12, 2, -16.3]),
  floor: { theta: -2.2, phi: 0.75, r: 95, tx: -4, ty: 0, tz: 0 },
};
document.querySelectorAll("#ui [data-v]").forEach((b) => (b.onclick = () => {
  twin.setLayers({ cut: b.dataset.v === "floor" });
  twin.fly(VIEWS[b.dataset.v], 1600);
}));
document.getElementById("theme").onclick = () => { const t = twin.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; twin.setTheme(t); };
document.getElementById("night").onclick = () => twin.setNight(twin.night > 0.5 ? 0 : 1, 900);
document.getElementById("opt").onclick = () => twin.setOption(twin.opt === "opt1" ? "opt2" : "opt1");
document.getElementById("cut").onclick = () => twin.setLayers({ cut: !twin.layers.cut });
Object.assign(twin.rig, VIEWS[location.hash.slice(1)] || VIEWS.gate);
if (location.search.includes("overlay")) document.getElementById("overlay").style.display = "block";
// match helper: eye + target in twin coords, vertical fov
window.matchCam = (cam, at, fov) => { twin.setControl("look"); twin.stopFly(); Object.assign(twin.rig, lookFrom(cam, at)); if (fov) { twin.camera.fov = fov; twin.camera.updateProjectionMatrix(); } };
</script>
</body>
</html>
