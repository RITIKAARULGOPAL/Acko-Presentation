<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which way in? · eight designs</title>
<style>
  :root { --purple: #5222d0; --ink: #111; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: var(--ink); background: #f3f0fb; }
  header { padding: 14px 20px 10px; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { margin: 0; color: #555; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 20px; align-items: center; }
  button { font: inherit; padding: 8px 14px; border: 1px solid #cfc6ea; border-radius: 8px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--purple); color: #fff; border-color: var(--purple); }
  .desc { padding: 4px 20px 10px; min-height: 28px; }
  .frame { position: relative; margin: 0 20px 20px; aspect-ratio: 16 / 9; max-height: calc(100vh - 230px); background: #fff; border: 1px solid #cfc6ea; border-radius: 10px; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; }
  .note { position: absolute; right: 12px; top: 10px; font-size: 12px; background: #fffc; padding: 2px 8px; border-radius: 6px; }
  a { color: var(--purple); }
</style>
</head>
<body>
<header>
  <h1>Which way in? Eight designs for the question slide</h1>
  <p>Each design names the two ways in, Walkthrough and Renders, with words and a simple line icon, and shows no film or render imagery. Each design works; the deck takes about 40 s to start here.</p>
</header>
<div class="row" id="opts"></div>
<div class="desc" id="desc"></div>
<div class="frame"><iframe id="f" title="slide"></iframe><span class="note" id="note"></span></div>
<script>
const OPTS = {
  a: ["A · Two doors", "Two tall purple doors, each with an icon and its word."],
  b: ["B · Left or right", "Split screen of two colour fields: icon, big arrow and word on each side; the hovered side widens."],
  c: ["C · Pick a number", "Two large circles holding the icons, the words beneath."],
  d: ["D · Face-down cards", "Two face-down purple cards, words printed under each; the chosen one flips."],
  e: ["E · A fork in the path", "A line that splits in two; each path end carries its word and lights up on hover."],
  f: ["F · A | B switch", "A big two-state switch, Walkthrough | Renders; the knob slides to the side you pick."],
  g: ["G · This way / that way", "Two huge black words with a purple underline sweeping in on hover; no imagery."],
  h: ["H · Frosted frames", "Two frosted-glass frames with icon, word and Tap to open; the chosen one clears and zooms."]
};
const q = new URLSearchParams(location.search);
let o = OPTS[q.get("choice")] ? q.get("choice") : "a";
function render() {
  const host = document.getElementById("opts"); host.innerHTML = "";
  for (const k in OPTS) { const b = document.createElement("button"); b.textContent = OPTS[k][0]; b.setAttribute("aria-pressed", k === o); b.onclick = () => { o = k; render(); }; host.appendChild(b); }
  document.getElementById("desc").textContent = OPTS[o][1];
  const url = "index-story3.html?choice=" + o + "&v=" + Date.now() + "#s-start-choice/1";
  document.getElementById("f").src = url;
  document.getElementById("note").innerHTML = '<a href="' + url + '" target="_blank">open full size</a>';
  history.replaceState(null, "", "?choice=" + o);
}
render();
</script>
</body>
</html>
