<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Möbius promise · five highlights</title>
<style>
  :root { --purple: #5222d0; --ink: #111; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: var(--ink); background: #f3f0fb; }
  header { padding: 14px 20px 10px; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { margin: 0; color: #555; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 20px; align-items: center; }
  button { font: inherit; padding: 8px 14px; border: 1px solid #cfc6ea; border-radius: 8px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--purple); color: #fff; border-color: var(--purple); }
  .desc { padding: 4px 20px 10px; min-height: 28px; }
  .frame { position: relative; margin: 0 20px 20px; aspect-ratio: 16 / 9; max-height: calc(100vh - 190px); background: #fff; border: 1px solid #cfc6ea; border-radius: 10px; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; }
  .note { position: absolute; right: 12px; top: 10px; font-size: 12px; background: #fffc; padding: 2px 8px; border-radius: 6px; }
  a { color: var(--purple); }
</style>
</head>
<body>
<header>
  <h1>The Möbius promise: five ways to highlight it</h1>
  <p>"It's never us versus you; it's always us with you." Each is the real slide, shown at its final frame (the floor animation then loops).</p>
</header>
<div class="row" id="tags"></div>
<div class="desc" id="desc"></div>
<div class="frame"><iframe id="f" title="slide"></iframe><span class="note" id="note"></span></div>
<script>
const TAGS = {
  p: ["Plain (today)", "No highlight: the line as it is now."],
  a: ["A · Purple italic", "The whole promise in purple italic, a touch heavier."],
  b: ["B · Marker band", "A soft lilac highlighter band behind “it’s always us with you.”"],
  c: ["C · Handwritten quote", "Set in the handwritten face with curly quotation marks, like something said."],
  d: ["D · Two tones", "The first clause quiet grey; “it’s always us with you.” bold purple."],
  e: ["E · Rule + lead-in", "A hairline lilac rule on the left and a small purple “THE PROMISE” above it."]
};
const q = new URLSearchParams(location.search);
let tag = TAGS[q.get("tag")] ? q.get("tag") : "a";
function render() {
  const host = document.getElementById("tags"); host.innerHTML = "";
  for (const k in TAGS) { const b = document.createElement("button"); b.textContent = TAGS[k][0]; b.setAttribute("aria-pressed", k === tag); b.onclick = () => { tag = k; render(); }; host.appendChild(b); }
  document.getElementById("desc").textContent = TAGS[tag][1];
  try { sessionStorage.removeItem("cplTag"); } catch (e) {}
  const url = "index-story3.html?tag=" + (tag === "p" ? "x" : tag) + "&v=" + Date.now() + "#s-campus-loop/6";
  document.getElementById("f").src = url;
  document.getElementById("note").innerHTML = '<a href="' + url + '" target="_blank">open full size</a>';
  history.replaceState(null, "", "?tag=" + tag);
}
render();
</script>
</body>
</html>
