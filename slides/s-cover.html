<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover · ACKO slide s-cover</title>
<!-- Open this file on its own to see and work on the slide (offline, no server). dev.js loads the deck's styles, data, chrome and
     engine around it. The build (tools/build.py) takes only what sits between the two markers below. -->
<base href="../">
<script src="assets/js/dev.js"></script>
</head>
<body>
<!-- slide:start -->
<section class="scene" id="s-cover" data-part="cover" data-mode="dark" data-title="Cover" data-steps="1" data-mins="0.25"
  data-notes="ACKO head office, design and build. Regalium, Koramangala: one floor of 91,000 sq ft. Technical bid by Studiokon Ventures for Anarock PMES, on behalf of ACKO.">
  <div class="cv-photo"></div><div class="cv-veil"></div>
  <div class="page">
    <div class="cv-rule at" style="left:1.6%;top:11.6%;width:96.8%"></div>
    <div class="cv-rule at" style="left:1.6%;top:45.6%;width:96.8%"></div>
  </div>
  <div class="page rv">
    <div class="cv-small at" style="left:1.6%;top:7.8%;--i:0">Studiokon Ventures</div>
    <div class="cv-small at" style="left:79.8%;top:7.8%;--i:0">RFP-ACKO-DB-001 · Technical bid</div>
    <div class="cv-small at" style="left:1.7%;top:19.7%;--i:1">Technical bid submission · August 2026</div>
    <img class="cv-logo at" src="assets/img/acko-white.webp" alt="ACKO" style="left:1.8%;top:24.6%;--i:2">
    <div class="cv-title at" style="left:1.3%;top:35.4%;--i:3">HEAD OFFICE DESIGN &amp; BUILD</div>
    <div class="cv-facts at" style="left:1.6%;top:47.6%;width:92%;--i:4">
      <div><span>Site</span><b>Regalium Building, Koramangala Industrial Layout, Bengaluru</b></div>
      <div><span>Floor plate</span><b>91,000 sqft, single floor</b></div>
      <div><span>Submitted to</span><b>Anarock PMES, for ACKO</b></div>
    </div>
  </div>
</section>
<style>
/* ---------- cover (slide 1) ---------- */
#s-cover .cv-photo { position: fixed; inset: 0; background: #0b0b0c url(assets/img/cover-stair.webp) center / cover no-repeat; opacity: 0; transition: opacity 1.6s var(--ease); }
#s-cover.active .cv-photo { opacity: .62; }
#s-cover .cv-veil { position: fixed; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.72), rgba(0,0,0,.25) 70%, rgba(0,0,0,.1)); }
#s-cover .page { color: #fff; }
.cv-small { font-size: calc(var(--pt) * 6); letter-spacing: .14em; text-transform: uppercase; color: #fff; }
.cv-rule { height: 1px; background: rgba(255,255,255,.55); transform-origin: left; transform: scaleX(0); transition: transform 1.4s var(--ease) .2s; }
#s-cover.active .cv-rule { transform: scaleX(1); }
.cv-logo { width: 17.5%; height: auto; }
.cv-title { font-size: calc(var(--pt) * 33); font-weight: 700; letter-spacing: -.005em; color: var(--violet); white-space: nowrap; line-height: 1; }
.cv-facts { display: grid; grid-template-columns: 30fr 21fr 21fr; gap: 0; }
.cv-facts span { display: block; font-size: calc(var(--pt) * 5); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.75); margin-bottom: calc(var(--pt) * 2); }
.cv-facts b { display: block; font-weight: 400; font-size: calc(var(--pt) * 8); color: #fff; line-height: 1.3; padding-right: 2em; }
</style>
<script>
/* the cover (deck slide 1): the facts come up over the stairs */
ACKO.slide("s-cover", ({ $, plain, reveal }) => ({
  enter(_, sc) { plain(); reveal($(".page.rv", sc), 200); },
}));
</script>
<!-- slide:end -->
</body>
</html>
