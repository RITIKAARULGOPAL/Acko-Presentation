/* ---------- the Möbius (slide 10) ---------- */
/* the deck's photo where and as the deck puts it: x 7.8%, y 0, 84.4% × 100% (the photo's own 3:2), at 35% (alphaModFix 35000) */

#s-mobius .mb-copy > * { position: absolute; display: block; box-sizing: border-box; margin: 0; padding: calc(var(--pt) * 7.2); font-family: var(--body); line-height: 1.2; }

/* the path: purple in front of the strip; lilac behind it, and under the front where they cross (it comes first in the SVG) */
#s-mobius .mb-line { fill: none; stroke-linecap: round; visibility: hidden; }
#s-mobius .mb-line.front { stroke: var(--purple); stroke-width: 2.6; }

</style>
<script>
/* the Möbius (deck slide 10): on the deck's own photo, one line draws the strip's path in a single stroke (6.5 s, after the copy)
   and stays. The path is Ritika's, drawn on a deck screenshot and traced and smoothed into photo pixels (the SVG's viewBox is the
   photo's 1536 × 1024): it runs twice round the strip before it meets itself, in front, behind, then in front again. Those three
   pieces (data-i is their order along the path) are drawn as one line: one progress and one easing over their joint length.
   Reduced motion: drawn, still. */
ACKO.slide("s-mobius", ({ $$, $, plain, reveal, later, reduced }) => {
  const S = { raf: 0 };
  const MS = 6500, ease = (k) => (1 - Math.cos(Math.PI * k)) / 2;
  return {
    enter(_, sc) {
      plain(); reveal($(".mb-copy", sc), 600);
      const parts = $$(".mb-line", sc).sort((a, b) => a.dataset.i - b.dataset.i).map((el) => ({ el, L: el.getTotalLength() }));
      const total = parts.reduce((a, p) => a + p.L, 0);
      const show = (k) => {                                  // k: 0 → 1 over the whole path, as one line
        let d = k * total;
        parts.forEach(({ el, L }) => {
          const a = Math.max(0, Math.min(L, d)); d -= L;
          el.style.strokeDasharray = `${L} ${L}`; el.style.strokeDashoffset = L - a;
          el.style.visibility = a > 0 ? "visible" : "hidden";      // not even a round cap before the line arrives
        });
      };
      cancelAnimationFrame(S.raf);
      if (reduced) { show(1); return; }
      show(0);
      later(() => {
        const t0 = performance.now();
        const frame = (now) => {
          if (document.body.dataset.scene !== sc.id) return;
          const k = Math.min(1, (now - t0) / MS); show(ease(k));
          if (k < 1) S.raf = requestAnimationFrame(frame);
        };
        S.raf = requestAnimationFrame(frame);
      }, 1200);
    },
    leave() { cancelAnimationFrame(S.raf); },
  };
});
</script>
