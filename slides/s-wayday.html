<section class="scene" id="s-wayday" data-part="5" data-title="A day in ACKO" data-steps="7" data-mins="1.5"
  data-beats="Arrival,Work,Meeting Rooms,Collab,Café,Board Room,Wellness"
  data-notes="A day in ACKO on the SketchUp model (acko2A_model, in its own colours under a soft sun): the Loop’s seven stops by the clock, walked by one Acker, a purple figure of a cone and a sphere at his real size (1.7 m); the path he has walked is drawn behind him as the Loop’s ribbon. 09:00 Arrival: through the lift lobby to Reception, I feel welcomed. 09:30 Work: at their desks in the neighbourhood, these are my folks. 11:00 Meeting Rooms: a team review, my impact. 12:00 Collab: a huddle, worth the commute. 13:00 Café: lunch together, hey, we finally meet. 15:00 Board Room: the review, my big moment. 17:00 Wellness: a pause on the terrace garden, they thought of me too. The camera goes with his walk and settles on each beat as he stops. Whole floor shows the whole campus and the whole of his path; the strip along the bottom jumps to any part of the day. Drag to pan, right-drag (or Shift-drag) to turn it all the way round, scroll to zoom; a double-click (or Reset view) goes back to the day.">
  <div class="page">
    <div class="wd-gl ui"></div>
    <div class="wd-veil"></div>
    <div class="hdr"><b>Schematic Axonometric</b><span>Space Planning &nbsp;| Wayfinding</span></div>
    <div class="lt-tools ui"><button type="button" class="wd-rs" title="Back to the day's view"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>Reset view</button><button type="button" class="wd-play on">The day</button><button type="button" class="wd-all">Whole floor</button></div>
    <div class="wd-title"><h1>A day in ACKO</h1><p>From arrival to the evening: one Acker’s day, walked along the Loop.</p></div>
    <div class="wd-now"><div class="t"></div><b></b><span></span><q></q></div>
    <div class="wd-day ui"></div>
    <p class="wd-nogl">The live model needs WebGL on this machine.</p>
  </div>
</section>

<script>
/* a day in ACKO (Ritika, 22–23 Oct: "wayfinding will be in axo"; 26 Oct: "build the axo based on this skp file", "go with sample
   5": on the SketchUp model, assets/js/axo-skp.js and data/axo-skp.js, in its own colours; the DXF model, assets/js/axo-model.js,
   if that data is missing; on the deck's one renderer). Ritika, 27 Oct, picking the light column from the hotspot samples
   (index-pins.html): "use the yellow in the text for light column ... model should rotate 360 degs ... the light column hotspot
   would have pop up and we will also have different other parts of the day apart from the hotspots ... tiny humans doing
   activity in each space when we zoom to that particular space ... one guy walking throughout is not required, instead we'll
   have a day in acko and only show spaces with human activity in it and hotspots for way finding ... humans can be in
   monochromatic dark grey ... the shadow is too harsh, make it soft" (the sketchup look's soft sun, axo-model.js), and by her
   answers: the Loop's seven stops by the clock, a beat each (BEATS), the camera easing to each space; the hotspots,
   amber light columns at her six marked spots (WAY, from tools/acko/wayday_marks.py), one a beat (29 Oct), a click opening its pop-up;
   "A day in ACKO". The people (PEOPLE, from tools/acko/wayday_people.py: the layout's chairs, each space's scene, walkers on
   the corridors) show once the view is close. The lights, her marks and the people are this slide's own group, added to the
   shared scene on entering and taken off on leaving. A left-drag pans, a right-drag (or Shift-drag) turns it (all the way
   round), the wheel (or a trackpad's pinch) zooms on the cursor; the view is then hers until a double-click, Reset view, The day, Whole
   floor or the next beat gives it back (eased the short way round to the deck's angle). */
ACKO.slide("s-wayday", ({ $, $$, plain, asset, reduced, go, sceneIx, plan }) => {
  // the day (Ritika, 27 Oct: the Loop's seven stops by the clock): per beat the time, the stop and its line, the Loop's words,
  // the space it frames (plan mm: the room's middle, not its label's point), how much of it (half the view's height, m) and, for the
  // Acker Garden, its own angle (Ritika, 27 Oct: "do it like the render"); @NB is the neighbourhood's name. sp: the space in focus,
  // the only one in purple (29 Oct: "the only purple theme elements in this axo should be highlighted at each time interval"):
  // the plan's room of that type at the beat's point (or nearest it), or the beat's neighbourhood (@NB). spot: the one hotspot
  // that shows on the beat (kept in the data, not shown: no wayfinding here, Ritika 19 Nov)
  const BEATS = [
    { t: "09:00", n: "Arrival", s: "Through the lift lobby to Reception", q: "I feel welcomed", at: [85500, 31500], half: 14, sp: "Reception", spot: 0 },
    { t: "09:30", n: "Work", s: "At their desks in @NB", q: "These are my folks!", at: [33300, 33500], half: 14, sp: "@NB", spot: 3 },
    { t: "11:00", n: "Meeting Rooms", s: "A team review in the departmental room", q: "My impact", at: [36745, 24148], half: 11, sp: "Departmental room", spot: 2 },
    { t: "12:00", n: "Collab", s: "In the Acker Garden: the swing, a punch bag and foosball", q: "Wow, worth the commute", at: [18279, 18618], half: 6.5, theta: 1.68, sp: "Collab", spot: 4 },
    { t: "13:00", n: "Café", s: "Lunch together in the café", q: "Hey, we finally meet!", at: [67562, 40539], half: 15, sp: "Cafeteria", spot: 5 },
    { t: "15:00", n: "Board Room", s: "The quarterly review in the boardroom", q: "This is my big moment", at: [106776, 42102], half: 11, sp: "Boardroom", spot: -1 },
    { t: "17:00", n: "Wellness", s: "A pause on the terrace garden", q: "They thought of me too!", at: [84216, 43565], half: 12, sp: "Terrace", spot: 6 },
  ];
  // the Acker Garden's foosball (a prop, not a person): plan mm, angle in centiradians, the deck's height in mm
  const FOOSBALL = [19539, 17138, -157, 130];
  // the SketchUp model when its data is in, else the DXF model
  const SKP = !!(window.AxoSkp && window.AxoSkp.available()), MODEL = SKP ? window.AxoSkp : window.AxoModel;
  const VIEW = { theta: -0.62, phi: 0.92 }, FIT = [0.30, 0.16, 0.99, 0.82];
  const RW = 1.2, RY = 0.07, PACE = 1.4;                            // the path's width (m) and height, his walking pace (m/s)
  const S = { built: false, beat: 0, view: null, follow: true, raf: 0, fresh: true, jump: false, asp: 1, home: null, user: false, wired: false, open: -1 };
  let T, M, R, cam, host, sc, group, W, man, trail, P = [], legEnd = [];
  const ringsOf = (d) => (d.match(/M[^Z]+/g) || []).map((r) => r.slice(1).split("L").map((q) => q.trim().split(/\s+/).map(Number)));
  const inRing = (p, ring) => { let c = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const [xi, yi] = ring[i], [xj, yj] = ring[j]; if ((yi > p[1]) !== (yj > p[1]) && p[0] < ((xj - xi) * (p[1] - yi)) / (yj - yi) + xi) c = !c; } return c; };
  // the neighbourhood of the day's desks, by the drawing's own name ("06 · Home")
  const nbName = () => { const p = BEATS[1].at, z = (plan.data.zones || []).find((q) => ringsOf(q.zone).filter((r) => inRing(p, r)).length % 2 === 1); return z ? z.name : "The neighbourhood"; };
  // a beat's space in focus (its outlines, plan mm): the neighbourhood its point is in, or the room of its type holding the point,
  // else the one whose box is nearest it
  const spaceOf = (b) => {
    const p = b.at, holds = (d) => ringsOf(d).filter((r) => inRing(p, r)).length % 2 === 1;
    if (b.sp === "@NB") { const z = (plan.data.zones || []).find((q) => holds(q.zone)); return z ? ringsOf(z.zone) : null; }
    const off = (d) => { const q = ringsOf(d).flat(), xs = q.map((v) => v[0]), ys = q.map((v) => v[1]);
      return Math.hypot(Math.max(Math.min(...xs) - p[0], 0, p[0] - Math.max(...xs)), Math.max(Math.min(...ys) - p[1], 0, p[1] - Math.max(...ys))); };
    const rooms = (plan.data.spaces || []).filter((r) => r.type === b.sp && r.d);
    const r = rooms.find((q) => holds(q.d)) || rooms.sort((a, c) => off(a.d) - off(c.d))[0];
    return r ? ringsOf(r.d) : null;
  };

  // one Acker (Ritika, 19 Nov: "make a human, remove other humans, a triangular body and a spherical face ... he can move and his path
  // would come as the Loop's ribbon ... to scale"): a cone body and a sphere head, 1.7 m in all (the model is in metres), in the deck's
  // purple, with a soft round shadow; and the path he has walked, drawn behind him as the Loop's ribbon
  function human() {
    man = new T.Group(); man.name = "acker";
    const body = new T.Mesh(new T.ConeGeometry(0.28, 1.4, 28).translate(0, 0.7, 0), new T.MeshLambertMaterial({ color: 0x5222d0 }));
    const head = new T.Mesh(new T.SphereGeometry(0.125, 24, 16).translate(0, 1.565, 0), new T.MeshLambertMaterial({ color: 0xb9a6f0 }));
    const disc = new T.Mesh(new T.CircleGeometry(0.38, 24).rotateX(-Math.PI / 2).translate(0, 0.03, 0), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.16, depthWrite: false }));
    body.castShadow = head.castShadow = true; disc.renderOrder = 3; man.add(body, head, disc); man.userData.head = head; man.frustumCulled = false; group.add(man);
    // his route: from each beat's spot to the next along the Loop's own route (ACKO_LOOP.ring, plan mm; the shorter way round), eased
    const LP = window.ACKO_LOOP, ring = LP && LP.ring && LP.ring.length > 3 ? LP.ring : null, N = ring ? ring.length : 0;
    const near = (q) => { let j = 0, d0 = 1e18; for (let i = 0; i < N; i++) { const d = (ring[i][0] - q[0]) ** 2 + (ring[i][1] - q[1]) ** 2; if (d < d0) { d0 = d; j = i; } } return j; };
    const arc = (a, b) => {                                       // ring indices a to b, the shorter way round
      const walkIt = (step) => { const o = []; let L = 0; for (let i = a; ; i = (i + step + N) % N) { o.push(ring[i]); if (i === b) break; if (o.length > 1) L += Math.hypot(o[o.length - 1][0] - o[o.length - 2][0], o[o.length - 1][1] - o[o.length - 2][1]); } return { o, L }; };
      const f = walkIt(1), r = walkIt(-1); return (f.L <= r.L ? f : r).o;
    };
    const chaikin = (Q, it) => { for (let k = 0; k < it; k++) { const O = [Q[0]]; for (let i = 0; i + 1 < Q.length; i++) { const a = Q[i], b = Q[i + 1]; O.push([0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]], [0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]]); } O.push(Q[Q.length - 1]); Q = O; } return Q; };
    const dense = (Q) => { const o = [Q[0]]; for (let i = 1; i < Q.length; i++) { const a = Q[i - 1], b = Q[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(L / 0.25)); for (let k = 1; k <= n; k++) o.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]); } return o; };
    P = []; legEnd = [0];
    BEATS.forEach((b, i) => {
      const here = [b.p.x, b.p.z]; if (i === 0) { P.push(here); return; }
      const prev = [BEATS[i - 1].p.x, BEATS[i - 1].p.z];
      let pts = [prev];
      if (ring) pts = pts.concat(arc(near(BEATS[i - 1].at), near(b.at)).map((q) => [M.X(q[0]), M.Z(q[1])]));
      pts.push(here);
      const leg = dense(chaikin(pts, 2)); P.push(...leg.slice(1)); legEnd.push(P.length - 1);
    });
    // the ribbon: the Loop's lilac stroke on a paler, wider edge, drawn as far as he has walked
    const strip = (wid, col, op, ro, off) => {
      const n = P.length, E = P.map((q, i) => { const a = P[Math.max(0, i - 2)], c = P[Math.min(n - 1, i + 2)], dx = c[0] - a[0], dz = c[1] - a[1], l = Math.hypot(dx, dz) || 1; return [[q[0] - dz / l * wid / 2, q[1] + dx / l * wid / 2], [q[0] + dz / l * wid / 2, q[1] - dx / l * wid / 2]]; });
      const pos = []; for (let i = 0; i + 1 < n; i++) { const [a, b] = E[i], [c, d] = E[i + 1]; for (const q of [a, b, c, b, d, c]) pos.push(q[0], RY + off, q[1]); }
      const g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); g.setDrawRange(0, 0);
      const m = new T.Mesh(g, new T.MeshBasicMaterial({ color: col, transparent: true, opacity: op, side: T.DoubleSide, depthWrite: false, polygonOffset: true, polygonOffsetFactor: off ? -6 : -4, polygonOffsetUnits: off ? -12 : -8 }));
      m.renderOrder = ro; m.frustumCulled = false; return m;
    };
    trail = new T.Group(); trail.add(strip(RW + 0.35, 0xd9cbfa, 0.9, 8, -0.01), strip(RW, 0x8f6cf0, 0.9, 9, 0)); group.add(trail);
    S.p = 0; S.pt = 0; S.last = 0; place();
  }
  // where he stands and how much of the path shows
  function place() {
    const k = Math.max(0, Math.min(P.length - 1, S.p)), i = Math.floor(k), f = k - i, a = P[i], b = P[Math.min(P.length - 1, i + 1)];
    man.position.set(a[0] + (b[0] - a[0]) * f, 0, a[1] + (b[1] - a[1]) * f);
    trail.children.forEach((m) => m.geometry.setDrawRange(0, 6 * Math.max(0, Math.min(P.length - 1, Math.floor(k)))));
  }
  // the next beat: he walks the path to its spot (at least PACE m/s, never more than 6 s for a stretch); on arriving at a beat from outside, or
  // with reduced motion, he is simply there
  function walkTo(i) { S.pt = legEnd[i] || 0; if (S.fresh || reduced) S.p = S.pt; S.last = 0; }
  // the Acker Garden's foosball (white, as in Ritika's view of the model; it is not in the model's file), where FOOSBALL puts
  // it, on the deck: a body on four legs, eight rods across it with dark grips, its long side along the plan angle
  function foosball([x, y, a, h]) {
    const g = new T.Group(), white = new T.MeshLambertMaterial({ color: 0xf4f4f2 }), steel = new T.MeshLambertMaterial({ color: 0x9c9c9c }), grip = new T.MeshLambertMaterial({ color: 0x2f2f2f });
    const box = (w, ht, d, px, py, pz) => { const b = new T.Mesh(new T.BoxGeometry(w, ht, d), white); b.position.set(px, py, pz); b.castShadow = b.receiveShadow = true; g.add(b); };
    box(1.42, 0.26, 0.76, 0, 0.78, 0);
    for (const sx of [-0.62, 0.62]) for (const sz of [-0.3, 0.3]) box(0.07, 0.66, 0.07, sx, 0.33, sz);
    for (let i = 0; i < 8; i++) {
      const rx = -0.56 + i * 0.16, rod = new T.Mesh(new T.CylinderGeometry(0.012, 0.012, 1.2, 6), steel), gp = new T.Mesh(new T.CylinderGeometry(0.024, 0.024, 0.13, 8), grip);
      rod.rotation.x = gp.rotation.x = Math.PI / 2; rod.position.set(rx, 0.86, 0); gp.position.set(rx, 0.86, (i % 2 ? 1 : -1) * 0.64); g.add(rod, gp);
    }
    const p = W([x, y]), d = W([x + Math.cos(a / 100) * 1000, y + Math.sin(a / 100) * 1000]).sub(p);
    g.position.set(p.x, h / 1000, p.z); g.rotation.y = Math.atan2(-d.z, d.x);      // its x along the plan angle
    return g;
  }

  function build() {
    T = window.THREE; M = MODEL.get(asset);
    cam = new T.OrthographicCamera(-1, 1, 1, -1, 1, 900);
    W = (p) => new T.Vector3(M.X(p[0]), 0, M.Z(p[1]));
    const NB = nbName();
    BEATS.forEach((b) => { b.s = b.s.replace("@NB", NB); b.p = W(b.at); });
    group = new T.Group(); group.name = "wayday";
    human(); group.add(foosball(FOOSBALL));
    // the strip of the day
    $(".wd-day", sc).innerHTML = BEATS.map((b, i) => `<button type="button" data-k="${i + 1}"><b>${b.t}</b><span>${b.n}</span></button>`).join("");
    $$(".wd-day button", sc).forEach((b) => (b.onclick = () => { b.blur(); go(sceneIx("s-wayday"), +b.dataset.k); }));
    S.built = true;
  }
  // a beat's view: its space right of the copy, at the deck's angle or its own (the Acker Garden: from inside, toward the glass,
  // as in its render)
  const beatView = (i, half) => { const b = BEATS[i], p = b.p, h = half || b.half, v = { theta: b.theta ?? VIEW.theta, phi: VIEW.phi }, { right, up } = window.AxoModel.basis(v);
    const off = right.clone().multiplyScalar(-h * S.asp * 0.18).add(up.clone().multiplyScalar(h * 0.05));
    return { theta: v.theta, phi: v.phi, half: h, t: [p.x + off.x, 0.8 + off.y, p.z + off.z] }; };
  const wrap = (a) => a - 2 * Math.PI * Math.round(a / (2 * Math.PI));              // the short way round
  const mix = (a, b, k) => ({ theta: a.theta + wrap(b.theta - a.theta) * k, phi: a.phi + (b.phi - a.phi) * k, half: a.half + (b.half - a.half) * k, t: a.t.map((v, i) => v + (b.t[i] - v) * k) });
  function sizeUp() {
    const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return false;           // a hidden pane: wait for a real size
    const pr = R.getPixelRatio();
    if (R.domElement.width !== Math.floor(w * pr) || R.domElement.height !== Math.floor(h * pr) || !S.home) {
      R.setSize(w, h, false); S.asp = w / h; S.home = window.AxoModel.frame(M, VIEW, -1e9, 1e9, FIT, S.asp);
    }
    if (!S.view || !isFinite(S.view.half)) S.view = S.home;
    if (S.hand) handOver();
    return true;
  }
  // arriving from the Detailed axonometric (window.ACKO_AXO_HAND): this model starts from that camera (the AxoLayers floor is the plan + (185842, -182802)
  // mm, as the walk reads it), glides to the beat's view, and the detailed axo's last frame stays over it a moment and dissolves away
  function handOver() {
    const H = S.hand; S.hand = null; if (!H || !H.st) return;
    const AL = window.AxoLayers && window.AxoLayers.get(); if (!AL || M.CX === undefined) return;
    const dx = (185842 + AL.CX - M.CX) / 1000, dz = (-182802 + AL.CY - M.CY) / 1000, st = H.st;
    S.view = { theta: st.theta, phi: st.phi, half: st.half, t: [st.t[0] + dx, st.t[1], st.t[2] + dz] }; S.user = false; S.follow = true;
    if (!H.snap || H.day) return;                         // from the day beat of the Detailed axo: the frame is already this one, nothing to dissolve
    const c = H.snap; c.className = "wd-hand"; host.appendChild(c);
    requestAnimationFrame(() => requestAnimationFrame(() => { c.style.opacity = 0; }));
    setTimeout(() => { if (c.parentNode) c.parentNode.removeChild(c); }, 2000);
  }
  function setNow(i) {
    const b = BEATS[i], now = $(".wd-now", sc);
    $(".t", now).textContent = b.t; $("b", now).textContent = b.n; $("span", now).textContent = b.s; $("q", now).textContent = b.q;
    $$(".wd-day button", sc).forEach((el, k) => { el.classList.toggle("on", k === i); el.classList.toggle("done", k < i); });
    if (MODEL.focus) { if (b.ring === undefined) b.ring = spaceOf(b); MODEL.focus(b.ring); }
  }
  // each frame: he walks toward the current beat's spot, slowing into the stop, and the path shows as far as he has gone
  function tick(now) {
    if (!man) return;
    const dt = S.last ? Math.min(0.25, (now - S.last) / 1000) : 0; S.last = now;
    const head = man.userData.head; let dx = 0, dz = 0;
    if (S.p !== S.pt) {
      const span = Math.abs(S.pt - S.p), speed = Math.max(PACE, (Math.abs(S.pt - (legEnd[S.beat - 1] ?? 0)) * 0.25) / 7);   // m/s: at least PACE, no stretch longer than ~7 s
      const slow = Math.min(1, 0.25 + (span * 0.25) / 2);                                                              // slows over the last 2 m
      const step = (speed / 0.25) * dt * slow, dir = S.p < S.pt ? 1 : -1;
      S.p = span <= Math.max(step, 0.05) ? S.pt : S.p + dir * step;
      const i = Math.max(0, Math.min(P.length - 2, Math.floor(S.p))), a = P[i], b = P[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      dx = dir * (b[0] - a[0]) / l; dz = dir * (b[1] - a[1]) / l;
    }
    if (head) head.position.set(dx * 0.04, 0, dz * 0.04);                                                              // a small lean the way he walks; upright when he stops
    place();
  }
  // the camera goes with his walk: from the previous beat's view to the next by how far along the stretch he is, its target his own position,
  // so it settles on the beat's framing exactly as he stops (at rest this is the beat's view)
  function walkView() {
    const q = S.p; let k = 1; while (k < legEnd.length - 1 && q > legEnd[k]) k++;                                       // the stretch from beat k-1 to beat k
    const a = legEnd[k - 1], b = legEnd[k], f = b > a ? Math.max(0, Math.min(1, (q - a) / (b - a))) : 1, e = f * f * (3 - 2 * f);
    const v = mix(beatView(k - 1), beatView(k), e), { right, up } = window.AxoModel.basis(v), h = v.half;
    const off = right.clone().multiplyScalar(-h * S.asp * 0.18).add(up.clone().multiplyScalar(h * 0.05));
    return { theta: v.theta, phi: v.phi, half: h, t: [man.position.x + off.x, 0.8 + off.y, man.position.z + off.z] };
  }
  function frame(now) {
    S.raf = 0;
    if (document.body.dataset.scene !== "s-wayday" || !R) return;
    if (!sizeUp()) { S.raf = requestAnimationFrame(frame); return; }
    if (S.jump) { S.view = S.follow ? beatView(S.beat) : S.home; S.jump = false; }
    if (!S.user) S.view = mix(S.view, S.follow ? (man && P.length ? walkView() : beatView(S.beat)) : S.home, reduced ? 1 : S.p !== S.pt ? 0.2 : 0.07);
    window.AxoModel.apply(cam, S.view, S.asp); cam.updateMatrixWorld(); tick(now); R.render(M.scene, cam);
    S.raf = requestAnimationFrame(frame);
  }
  const loop = () => { if (!S.raf) S.raf = requestAnimationFrame(frame); };
  // the view hers (turned, panned or zoomed: the day's camera stops) or the day's again
  const user = (on) => { S.user = on; sc.classList.toggle("wd-user", on); };
  // the same mouse on every axo (29 Oct: "LMB for pan, mouse wheel for zoom in zoom out and RMB for rotate"): a left-drag pans
  // (in the axo's right/up), a right-drag (or Shift-drag, for a trackpad) turns it (all the way round; 0.35-1.22 from the
  // vertical), the wheel zooms on the cursor (its point on the floor stays put); a double-click gives the view back
  function wire() {
    S.wired = true; let drag = null;
    const ground = (e, v) => {
      const r = host.getBoundingClientRect(), nx = ((e.clientX - r.left) / r.width) * 2 - 1, ny = -((e.clientY - r.top) / r.height) * 2 + 1;
      window.AxoModel.apply(cam, v, S.asp); const { f, right, up } = window.AxoModel.basis(v);
      const o = cam.position.clone().add(right.multiplyScalar(nx * v.half * S.asp)).add(up.multiplyScalar(ny * v.half));
      return o.add(f.multiplyScalar(-o.y / f.y));
    };
    host.addEventListener("pointerdown", (e) => { if (!S.view || e.button > 2) return; drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, on: false, turn: e.button === 2 || e.shiftKey, b: e.button }; try { host.setPointerCapture(e.pointerId); } catch (_) { /* not an active pointer */ } });
    host.addEventListener("pointermove", (e) => {
      if (!drag) return;
      if (!drag.on && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 3) return;        // a click, not a drag
      drag.on = true; host.classList.add("drag"); user(true);
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y, v = S.view; drag.x = e.clientX; drag.y = e.clientY;
      if (drag.turn) S.view = Object.assign({}, v, { theta: v.theta - dx * 0.005, phi: Math.max(0.35, Math.min(1.22, v.phi - dy * 0.004)) });
      else {
        const { right, up } = window.AxoModel.basis(v), k = (2 * v.half) / host.clientHeight, m = right.multiplyScalar(-dx * k).add(up.multiplyScalar(dy * k));
        S.view = Object.assign({}, v, { t: [v.t[0] + m.x, v.t[1] + m.y, v.t[2] + m.z] });
      }
      loop();
    });
    const up = () => { drag = null; host.classList.remove("drag"); };
    host.addEventListener("pointerup", up); host.addEventListener("pointercancel", up);
    host.addEventListener("contextmenu", (e) => e.preventDefault());
    host.addEventListener("wheel", (e) => {
      if (!S.view) return; e.preventDefault(); user(true);
      const v = S.view, before = ground(e, v), w = Object.assign({}, v, { half: Math.max(4, Math.min(90, v.half * Math.exp(e.deltaY * 0.0012))) });
      const after = ground(e, w); w.t = [w.t[0] + before.x - after.x, w.t[1], w.t[2] + before.z - after.z]; S.view = w; loop();
    }, { passive: false });
    host.addEventListener("dblclick", () => user(false));
  }
  function whole(on) {
    user(false); S.follow = !on; sc.classList.toggle("wd-whole", on);
    $(".wd-play", sc).classList.toggle("on", !on); $(".wd-all", sc).classList.toggle("on", on);
  }
  return {
    enter(_, s) {
      sc = s; host = $(".wd-gl", sc); plain();
      const ok = !!(window.AxoModel && (SKP || window.AxoModel.available()) && (R = window.AxoModel.renderer()));
      sc.classList.toggle("wd-fallback", !ok);
      if (!ok) return;
      if (!S.built) build();
      if (R.domElement.parentNode !== host) host.appendChild(R.domElement);
      M.reset(); M.scene.add(group);
      if (SKP) window.AxoSkp.look("sketchup");
      S.fresh = true; whole(false);
      const H = window.ACKO_AXO_HAND; window.ACKO_AXO_HAND = null;
      S.hand = H && !reduced && performance.now() - H.t < 6000 ? H : null;
      if (!S.hand) document.body.classList.remove("ax-hand");
      $(".wd-play", sc).onclick = (e) => { e.currentTarget.blur(); whole(false); };
      $(".wd-all", sc).onclick = (e) => { e.currentTarget.blur(); whole(true); };
      $(".wd-rs", sc).onclick = (e) => { e.currentTarget.blur(); user(false); };
      if (!S.wired) wire();
      loop();
    },
    step(k, s) {
      if (!S.built || sc.classList.contains("wd-fallback")) return;
      if (!S.follow) whole(false); else user(false);
      S.beat = Math.max(0, Math.min(BEATS.length - 1, k - 1)); setNow(S.beat); walkTo(S.beat);
      S.jump = false; S.fresh = false; loop();                       // entering (from either side) moves to that part of the day, as a step does (28 Oct)
    },
    leave() {
      cancelAnimationFrame(S.raf); S.raf = 0;
      if (M && group) { M.scene.remove(group); M.reset(); }
      if (MODEL.focus) MODEL.focus(null);
    },
  };
});
</script>
