  const beatView = (i, half) => { const p = BEATS[i].p, h = half || BEATS[i].half, { right, up } = window.AxoModel.basis(VIEW), off = right.clone().multiplyScalar(-h * S.asp * 0.18).add(up.clone().multiplyScalar(h * 0.05));

      const right = sx + bw * 0.06 + cw < bw - 12, cx = right ? sx + bw * 0.06 : sx - bw * 0.06 - cw, cy = Math.max(bh * 0.15, Math.min(bh * 0.8 - ch, sy - ch - bh * 0.04));

  // the light under the pointer (on screen: each beam's line from the floor to its top, within its width or 14 px), or -1

  // as on the schematic axo: a drag turns it (all the way round; 0.35-1.22 from the vertical), a right-drag or Shift pans (in
