      $(".wd-all", sc).onclick = (e) => { e.currentTarget.blur(); whole(true); };
      $(".wd-rs", sc).onclick = (e) => { e.currentTarget.blur(); user(false); };
      if (!S.wired) wire();
      loop();
    },
    step(k, s) {
      if (!S.built || sc.classList.contains("wd-fallback")) return;
      if (!S.follow) whole(false); else user(false);
      S.beat = Math.max(0, Math.min(BEATS.length - 1, k - 1)); setNow(S.beat); shine(-1);
      S.jump = false; S.fresh = false; loop();                       // entering (from either side) moves to that part of the day, as a step does (28 Oct)
    },
    leave() {
      cancelAnimationFrame(S.raf); S.raf = 0; shine(-1);
      if (M && group) { M.scene.remove(group); M.reset(); }
      if (MODEL.focus) MODEL.focus(null);
    },
  };
});
</script>
<!-- slide:end -->
</body>
