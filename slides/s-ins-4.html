<style>

#s-ins-4 .ix small { display: block; font-size: calc(var(--pt) * 9); font-style: italic; color: rgba(255,255,255,.6); margin-bottom: calc(var(--pt) * 10); }
#s-ins-4 .ix h2 { margin: 0; font-size: calc(var(--pt) * 34); line-height: 1.05; font-weight: 700; color: var(--lilac, #c9b3f3); }
#s-ins-4 .ix h3 { margin: calc(var(--pt) * 10) 0 0; font-size: calc(var(--pt) * 17); font-weight: 700; color: #fff; }
#s-ins-4 .ix p { margin: calc(var(--pt) * 12) 0 0; max-width: 30em; font-size: calc(var(--pt) * 11); line-height: 1.45; color: rgba(255,255,255,.72); }
#s-ins-4 .ix-hand { margin: 0; font-size: calc(var(--pt) * 22); color: var(--lilac, #c9b3f3); opacity: 0; transform: translateY(8px); transition: opacity .9s var(--ease), transform .9s var(--ease); }

#s-ins-4 .dr .ln > * { fill: none; stroke: var(--lilac, #c9b3f3); stroke-width: 1.3; stroke-dasharray: 1; stroke-dashoffset: 1; }

#s-ins-4 .c4-court { transition: transform 1.2s var(--ease), left 1.2s var(--ease), width 1.2s var(--ease), top 1.2s var(--ease), height 1.2s var(--ease); }
#s-ins-4 .b2 .c4-court { left: 4% !important; top: 40% !important; width: 22% !important; height: 26% !important; }

</style>
<script>
ACKO.slide("s-ins-4", ({ $, plain, reveal, reduced }) => {
  function floor(svg) {                                         // the bare floor (core and shell), its terraces and cut-out as courtyards
    const F = window.ACKO_FLOOR; if (!F || svg.childElementCount) return;
    const k = F.unit, P = (pts) => pts.map(([x, y]) => (x * k).toFixed(2) + " " + (y * k).toFixed(2)).join("L"), mid = (pts) => [pts.reduce((a, p) => a + p[0], 0) / pts.length * k, pts.reduce((a, p) => a + p[1], 0) / pts.length * k];
    const yards = [...(F.terraces || []), ...(F.cutout ? [F.cutout] : [])];
    svg.innerHTML = `<path class="plate" d="M${P(F.plate)}Z"/>` + (F.cores || []).map((c) => `<path class="core" d="M${P(c)}Z"/>`).join("") +
      yards.map((t) => `<path class="yard" d="M${P(t)}Z"/>`).join("") +
      yards.map((t) => { const [x, y] = mid(t); return `<text x="${x.toFixed(1)}" y="${(y + 9).toFixed(1)}" text-anchor="middle">courtyard</text>`; }).join("");
  }
  return {
    enter(_, sc) { plain(); floor($(".c4-floor", sc)); const pg = $(".page", sc); pg.classList.remove("drawn"); void pg.offsetWidth; sc.querySelectorAll(".rv").forEach((e) => reveal(e, 120)); setTimeout(() => pg.classList.add("drawn"), reduced ? 0 : 40); },
    step(k, sc) { $(".page", sc).classList.toggle("b2", k >= 2); },
  };
});
</script>
