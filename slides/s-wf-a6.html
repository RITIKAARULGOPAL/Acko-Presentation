#s-wf-a6 .bob { transition: transform .4s; } #s-wf-a6 .sit .bob { transform: translateY(43px); } #s-wf-a6 .sit .a1 { transform: rotate(-55deg); } #s-wf-a6 .sit .a2 { transform: rotate(-45deg); }
#s-wf-a6 .mycup { opacity: 0; transition: opacity .3s; } #s-wf-a6 .hold .mycup { opacity: 0; }

@keyframes wf6-steam { 0% { transform: translateY(4px); opacity: 0; } 50% { opacity: .6; } 100% { transform: translateY(-8px); opacity: 0; } }
#s-wf-a6 .bub { opacity: 0; transition: opacity .35s; } #s-wf-a6 .bub.on { opacity: 1; }

#s-wf-a6 .tail circle { fill: #fffdf8; stroke: #2b2440; stroke-width: 2.6; }
#s-wf-a6 .bub text { font: 400 38px var(--hand, cursive); fill: #2b2440; } #s-wf-a6 .bub .ans { fill: var(--mark); font-size: 36px; opacity: 0; transition: opacity .5s, fill .7s; }
#s-wf-a6 .bub.ok .ans { opacity: 1; }

#s-wf-a6 .wf-close.on { opacity: 1; transform: none; }

  font: 600 calc(var(--pt) * 5.6) / 1.1 inherit; cursor: pointer; }
/* the Material look: the same drawing, its surfaces in real finishes (textures cropped from the project's own material and render images) */
#s-wf-a6 .mat { opacity: 0; pointer-events: none; transition: opacity .7s; }
#s-wf-a6 .wf-el[data-look="mat"] .mat { opacity: 1; }

#s-wf-a6 .wf-el[data-look="mat"] .ink0 { filter: none; }

#s-wf-a6 .hat { transition: opacity .7s; }
#s-wf-a6 .mat :is(.m-slats rect, .m-collab rect, .m-wsg rect, .m-ctable) { mix-blend-mode: multiply; }
#s-wf-a6 .m-collab rect, #s-wf-a6 .m-wsg rect { fill: url(#wfa6-t-fabric); opacity: .7; } #s-wf-a6 .m-ctable { stroke: #2b2440; stroke-width: 3; }
#s-wf-a6 .m-slats rect { fill: url(#wfa6-t-slats); opacity: .8; }
#s-wf-a6 .m-img { filter: grayscale(1) brightness(1.12) contrast(1.05); }

#s-wf-a6 .m-film { fill: rgba(255, 255, 255, .5); stroke: none; }
#s-wf-a6 .m-sign { fill: url(#wfa6-brass); stroke: #2b2440; stroke-width: 2.5; }
#s-wf-a6 .m-carpet { mix-blend-mode: multiply; opacity: .75; }

</style>
<script>
ACKO.slide("s-wf-a6", ({ $, $$, plain, reveal, later, reduced }) => {
  // the six accents (ACKO's logo colours: violet, green, yellow; deep and light), one per neighbourhood; indicative
  // the ACKO logo's colours, deep and light (violet, green, yellow): the six read apart at a glance; the wall paint is eased toward the paper below
  const NB = [["01", "#5222d0", "Violet"], ["02", "#a98bf2", "Violet, light"], ["03", "#0fa458", "Green"], ["04", "#8fd8ae", "Green, light"],
    ["05", "#f2ae00", "Yellow"], ["06", "#ffd866", "Yellow, light"]];
  const hx = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)), toh = (c) => "#" + c.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
  const mix = (a, b, t) => toh(hx(a).map((v, i) => v + (hx(b)[i] - v) * t));
  // 19 Nov (Ritika: "two tones lighter"): the surfaces use the accent lifted toward white; the chips keep the logo colours
  const lift = (c) => mix(c, "#ffffff", 0.32);
  // each layer's tone from the accent
  const LAYERS = [
    ["paint", "Paint accent", "the neighbourhood's own wall", (c) => mix(c, "#fbf8f1", 0.06)],
    ["graphic", "Wall graphics", "its number, large, at the way in", (c) => c],
    ["carpet", "Carpet", "grey underfoot, the accent worked into it", (c) => c],
    ["privacy", "Privacy panels", "the film on the glass, a light tint", (c) => mix(c, "#ffffff", 0.68)],
    ["art", "Artwork", "a piece chosen for the neighbourhood", (c) => mix(c, "#ffffff", 0.2)],
    ["tone", "Artwork tonality", "light to deep, in its colour", (c) => `linear-gradient(90deg, ${mix(c, "#ffffff", 0.55)}, ${mix(c, "#1d1733", 0.35)})`],
    ["acoustic", "Meeting-room acoustics", "the panels inside its rooms", (c) => mix(c, "#ffffff", 0.35)],
    ["collab", "Collab area", "the soft seating, in its own tone", (c) => mix(c, "#ffffff", 0.18)],
    ["ws", "Privacy panel", "the desk screens, in its own tone", (c) => mix(c, "#ffffff", 0.12)]];
  const GENERAL = [["Signage", "one family across the floor: rooms named for a Modern Indian Institution (Nalanda, Sabha, Takshashila)"],
    ["Inclusivity", "braille and tactile signs, high contrast, at reach height"]];
  const tones = (c) => Object.fromEntries(LAYERS.map(([k, , , f]) => [k, f(c)]));

  function pick(sc, i, paint) {
    $$(".wf-chips button", sc).forEach((b, j) => b.classList.toggle("on", j === i));
    paint(sc, i);
  }
  function chips(sc, paint) {
    const box = $(".wf-chips", sc); if (box.childElementCount) return;
    box.innerHTML = NB.map(([n, c]) => `<button type="button" style="--c:${c}">${n}</button>`).join("");
    $$("button", box).forEach((b, j) => (b.onclick = (e) => { e.stopPropagation(); b.blur(); pick(sc, j, paint); }));
  }

  const WORD = ["Violet", "Light violet", "Green", "Light green", "Yellow", "Light yellow"];
  // the stops: where he stands (x on the carpet), which way he faces, his pose, the question, the answer, which labels ink in
  const STOPS = [
    { x: 450, face: -1, side: 1, q: "Where's my team?", a: (w, n) => `${w}, ${n}. That's us!`, labs: [0, 1], lit: ["paint"] },
    { x: 675, face: -1, side: 1, q: "Still us?", a: (w) => `Our art, our ${w.toLowerCase()} floor.`, labs: [2, 3, 9], lit: ["t1", "t2", "carpet"] },
    { x: 1062, face: -1, side: 1, pose: "reach", q: "Which room is my 3 pm?", a: () => "Nalanda. Found it by touch.", labs: [4, 5, 6, 7], lit: ["privacy", "dot", "acoustic"] },
    { x: 1160, face: 1, side: 1, pose: "sit", q: "And my desk?", a: () => "Our desk, our privacy panel.", labs: [10], lit: ["ws"] },
    { x: 1366, face: 1, side: 1, pose: "hold", q: "Where can we huddle?", a: () => "Collab area, right here.", labs: [8], lit: ["collab"] }];
  // the rings, drawn here: centre and radii of what each stop circles, a hand-drawn loop that overshoots its start
  const RINGS = [[235, 305, 172, 126], [555, 235, 128, 104], [997, 247, 78, 60], [1274, 420, 92, 84], [1500, 420, 90, 90]];
  const ringD = (cx, cy, rx, ry, k) => {
    const pts = [], n = 60, a0 = -2.3 + k * 0.9, sweep = Math.PI * 2.1;
    for (let i = 0; i <= n; i++) {
      const a = a0 + (sweep * i) / n, f = 1 + 0.028 * Math.sin(3 * a + k) + 0.02 * Math.sin(5 * a + 2 * k) + 0.03 * (i / n);
      pts.push((i ? "L" : "M") + (cx + rx * f * Math.cos(a)).toFixed(1) + " " + (cy + ry * f * Math.sin(a)).toFixed(1));
    }
    return pts.join("");
  };
  document.querySelectorAll("#s-wf-a6 .ring").forEach((g, k) => g.querySelectorAll("path").forEach((pa) => pa.setAttribute("d", ringD(RINGS[k][0], RINGS[k][1], RINGS[k][2], RINGS[k][3], k))));
  // the framed artwork per neighbourhood: pieces that hang in the project's own renders (tapestry, carved panel, painting, living wall, rug, planting); paths written out so the single file embeds them
  const ART = ["assets/img/s-wf-a6/art-1.webp", "assets/img/s-wf-a6/art-2.webp", "assets/img/s-wf-a6/art-3.webp", "assets/img/s-wf-a6/art-4.webp", "assets/img/s-wf-a6/art-5.webp", "assets/img/s-wf-a6/art-6.webp"]
    .map((p) => (window.ASSET_URLS && window.ASSET_URLS[p]) || p);
  const SPEED = 230, START = -70;
  let T = [], cur = -1, nb = 2, X = START;
  const at = (fn, ms) => T.push(setTimeout(fn, ms)), stop = () => { T.forEach(clearTimeout); T = []; };
  let TONE = {}, lit = [];
  const grey = (c) => { const [r, g, b] = hx(c), L = 0.2126 * r + 0.7152 * g + 0.0722 * b; return mix(toh([L, L * 0.99, L * 0.965]), "#f4f1ec", 0.3); };
  function light(sc, keys) {
    if (keys) lit = keys;
    const el = $(".wf-el", sc);
    Object.entries(TONE).forEach(([k, c]) => el.style.setProperty("--" + k, lit === "all" || lit.includes(k) ? c : grey(c)));
    el.style.setProperty("--artg", lit === "all" || lit.includes("t1") ? 0 : 1);
  }
  function paint(sc, i) {
    nb = i;
    const [n, c0, name] = NB[i], c = lift(c0), t = tones(c), el = $(".wf-el", sc);
    TONE = { paint: t.paint, carpet: t.carpet, privacy: t.privacy, acoustic: t.acoustic, collab: t.collab, ws: t.ws, dot: t.paint,
      t1: mix(c, "#ffffff", 0.55), t2: mix(c, "#1d1733", 0.35) };
    light(sc); $(".m-img", sc).setAttribute("href", ART[i]);
    el.style.setProperty("--mark", mix(c0, "#1d1733", [1, 3, 5].includes(i) ? 0.5 : 0.12));
    $$(".graphic", sc).forEach((g) => (g.textContent = n)); $(".wf-name", sc).textContent = `Neighbourhood ${n} · ${name}`;
    if (cur >= 0) bubble(sc, cur, $(".bub", sc).classList.contains("ok"));
  }
  // the thought bubble over his head, sized to its words
  function bubble(sc, k, ok) {
    const s = STOPS[k], b = $(".bub", sc), q = $(".q", b), a = $(".ans", b);
    q.textContent = s.q; a.textContent = s.a(WORD[nb], NB[nb][0]);
    let w = 300; try { w = Math.max(q.getComputedTextLength(), ok ? a.getComputedTextLength() : 0, a.getComputedTextLength()) + 68; } catch (e) {}
    const h = 124, top = 58, left = Math.max(16, Math.min(1584 - w, s.side > 0 ? s.x + 18 : s.x - 18 - w));
    $(".bb", b).setAttribute("width", w); $(".bb", b).setAttribute("x", 0); b.setAttribute("transform", `translate(${left} ${top})`);
    // three little circles rising from his head to the bubble
    const hx = s.x + s.side * 14 - left, hy = 212 - top + (s.pose === "sit" ? 50 : 0), ex = Math.max(40, Math.min(w - 40, s.x + s.side * 40 - left)), ey = h + 6;
    $$(".tail circle", b).forEach((c, j) => { const f = (j + 1) / 3.4; c.setAttribute("cx", hx + (ex - hx) * f); c.setAttribute("cy", hy + (ey - hy) * f); });
    b.classList.toggle("ok", !!ok);
  }
  function place(sc, x, ms) {
    const who = $(".who", sc); X = x;
    who.style.transitionDuration = (ms / 1000) + "s, .5s"; who.style.transform = `translate(${x}px, 480px)`;
  }
  let shown = 0;   // the stop on screen, 1–4 (0: none yet)
  function reset(sc) {
    stop(); cur = -1; shown = 0; light(sc, []);
    const el = $(".wf-el", sc), who = $(".who", sc);
    el.classList.add("walk"); $$(".seen", el).forEach((e) => e.classList.remove("seen")); $$(".ring", el).forEach((r) => r.classList.remove("on", "done"));
    $(".bub", sc).classList.remove("on", "ok"); $(".wf-close", sc).classList.remove("on");
    who.classList.remove("walking", "left", "reach", "hold", "sit", "wonder"); who.style.opacity = 1; place(sc, START, 0);
  }
  function found(sc, k, settled) {
    const labs = $$(".lab text", sc), leads = $$(".lead path", sc), r = $(`.ring[data-s="${k}"]`, sc);
    r.classList.add("on"); r.classList.toggle("done", !!settled); if (!settled) light(sc, STOPS[k].lit);
    STOPS[k].labs.forEach((j) => { labs[j].classList.add("seen"); leads[j].classList.add("seen"); });
  }
  function close(sc, ms) {
    at(() => { light(sc, "all"); $$(".lab text, .lead path", sc).forEach((e) => e.classList.add("seen")); $(".wf-el", sc).classList.remove("walk"); $(".wf-close", sc).classList.add("on"); }, ms);
  }
  // going back, or opening a beat directly: him at stop k at once, answered; the stops before it found
  function jump(sc, k) {
    reset(sc);
    const s = STOPS[k - 1], who = $(".who", sc);
    for (let i = 0; i < k; i++) found(sc, i, i < k - 1);
    place(sc, s.x, 0); who.classList.toggle("left", s.face < 0); if (s.pose) who.classList.add(s.pose);
    cur = k - 1; bubble(sc, k - 1, true); $(".bub", sc).classList.add("on"); shown = k;
    if (k === STOPS.length) close(sc, 300);
  }
  // one beat on: the last stop's bubble goes, he walks to stop k, wonders, and the neighbourhood answers; then he waits for the next click
  function walkTo(sc, k) {
    stop();
    const who = $(".who", sc), prev = STOPS[k - 2], s = STOPS[k - 1], ms = Math.abs(s.x - X) / SPEED * 1000, go = prev ? 300 : 350;
    $(".bub", sc).classList.remove("on"); cur = -1; shown = k; light(sc, []);
    if (prev) { $(`.ring[data-s="${k - 2}"]`, sc).classList.add("done"); if (prev.pose) who.classList.remove(prev.pose); }
    who.classList.remove("wonder");
    at(() => { who.classList.remove("left"); who.classList.add("walking"); place(sc, s.x, ms); }, go);
    at(() => {
      who.classList.remove("walking"); who.classList.toggle("left", s.face < 0);
      at(() => { cur = k - 1; who.classList.add("wonder"); bubble(sc, k - 1, false); $(".bub", sc).classList.add("on"); }, 300);
      at(() => { who.classList.remove("wonder"); if (s.pose) who.classList.add(s.pose); found(sc, k - 1, false); bubble(sc, k - 1, true); }, 1350);
      if (k === STOPS.length) close(sc, 2600);
    }, go + ms + 30);
  }
  return {
    enter(_, sc) {
      plain(); chips(sc, paint); pick(sc, 2, paint); reset(sc);
      // Sketch | Material: how the walls are drawn
      $$(".wf-look button", sc).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); b.blur(); $$(".wf-look button", sc).forEach((o) => o.classList.toggle("on", o === b)); $(".wf-el", sc).dataset.look = b.dataset.look; }));
      // the small replay plays the stop on screen again, from the one before
      const again = $(".wf-again", sc);
      again.onclick = (e) => { e.stopPropagation(); again.blur(); if (reduced || !shown) return; const k = shown; if (k > 1) jump(sc, k - 1); else reset(sc); walkTo(sc, k); };
    },
    step(k, sc) { if (!reduced && k === shown + 1) walkTo(sc, k); else jump(sc, k); },
    leave() { stop(); },
  };

});
</script>
