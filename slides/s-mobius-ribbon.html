<script>
/* the Möbius (deck slide 10), ribbon version (Ritika, 22 Oct): on the deck's own photo, a ribbon (the Loop's lavender) runs
   along Ritika's path in a single stroke (5 s, after the copy) from her path's left-most point, twice round the strip and
   back to it: narrow at both ends, softly lighter where it passes behind. It rests a moment, then the slide moves on to the
   Loop by itself, with no click (Ritika: "without click, let it start animating the loop"), where it slides off that point to
   the left and the Loop is revealed. Only going forward: back from the Loop, it stays. Reduced motion: drawn at once, and it
   moves on at the same moment. */
ACKO.slide("s-mobius-ribbon", ({ $, plain, reveal, later, reduced, next, sceneIx }) => {
  const S = { raf: 0, R: null };
  // the strip: a stretch [tail, head] of a route, drawn as filled polygons so that both ends narrow to a point (an SVG
  // stroke can't taper). A route is one line in page px, sampled about every STEP: { pts, ss (length along it), nn (normals),
  // F (how far in front of the Möbius strip: 1 in front, 0 behind, easing from one to the other over FADE either side of a
  // switch), starts (where each of its parts begins) }. The strip is laid on two offscreen layers, the parts behind (filled)
  // and the parts in front (filled and edged in white, so a crossing shows which part is on top, as on the deck's ribbon),
  // put down at 35% and at the ribbon's 75%. Near a switch each layer's share eases in or out, so the strip fades softly as
  // it goes behind instead of cutting: there it is laid in short overlapping pieces, every stretch under exactly two, each
  // at 1 − √(1 − share), so the two come to the share with no seams.
  const LAV = "rgb(190,164,245)", WID = 60, TAPER = 220, STEP = 6, FADE = 90;
  const CUT = [344.19, 543.99];                                     // her path's left-most point (page px): where the strip starts, ends and leaves
  const toPage = (p) => [149.76 + 1.055 * p.x, 1.0547 * p.y];          // photo px → page px, as the slide places the photo
  function sample(path, map, l0 = 0, l1 = path.getTotalLength()) {   // points along a path from length l0 to l1
    const n = Math.max(2, Math.ceil((l1 - l0) / STEP)), out = [];
    for (let i = 0; i <= n; i++) { const p = path.getPointAtLength(l0 + (i / n) * (l1 - l0)); out.push(map ? map(p) : [p.x, p.y]); }
    return out;
  }
  function nearest(path, map, q) {                                      // the length along a path of its point nearest q
    const L = path.getTotalLength(), d = (l) => { const p = map(path.getPointAtLength(l)); return Math.hypot(p[0] - q[0], p[1] - q[1]); };
    let best = 0; for (let l = 0; l <= L; l += 4) if (d(l) < d(best)) best = l;
    let a = Math.max(0, best - 4), b = Math.min(L, best + 4);
    for (let i = 0; i < 30; i++) { const m1 = a + (b - a) / 3, m2 = b - (b - a) / 3; if (d(m1) < d(m2)) b = m2; else a = m1; }
    return (a + b) / 2;
  }
  // parts: [{ pts, back, lead }] in order (each starting where the last ends); lead: how far into the part the last part's
  // side carries on, so that a switch's fade falls inside it
  function route(parts) {
    const pts = [], kind = [], first = [];                // first: the index of each part's first point (shared with the last part's end)
    parts.forEach(({ pts: P, back }, k) => { first.push(k ? pts.length - 1 : 0); P.forEach((p, i) => { if (k && !i) return; pts.push(p); kind.push(back ? 0 : 1); }); });
    const ss = [0]; for (let i = 1; i < pts.length; i++) ss.push(ss[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const starts = first.map((i) => ss[i]);
    parts.forEach(({ lead }, k) => { if (k && lead) for (let i = first[k] + 1; i < pts.length && ss[i] - starts[k] < lead; i++) kind[i] = kind[first[k]]; });
    const nn = pts.map((_, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
    const sw = []; for (let i = 1; i < pts.length; i++) if (kind[i] !== kind[i - 1]) sw.push([(ss[i] + ss[i - 1]) / 2, kind[i - 1], kind[i]]);
    const F = ss.map((s, i) => {
      let w = null; sw.forEach((x) => { if (Math.abs(s - x[0]) < FADE && (!w || Math.abs(s - x[0]) < Math.abs(s - w[0]))) w = x; });
      if (!w) return kind[i];
      const u = (s - w[0] + FADE) / (2 * FADE), e = u * u * (3 - 2 * u); return w[1] + (w[2] - w[1]) * e;
    });
    return { pts, ss, nn, F, starts, end: ss[ss.length - 1] };
  }
  const lay1 = document.createElement("canvas"), lay2 = document.createElement("canvas");   // behind · in front
  function strip(cv, R, tail, head, alpha) {
    const r = Math.min(2, devicePixelRatio || 1), W = Math.round(cv.clientWidth * r), H = Math.round(cv.clientHeight * r);
    if (!W || !H) return;
    [cv, lay1, lay2].forEach((c) => { if (c.width !== W || c.height !== H) { c.width = W; c.height = H; } });
    const k = W / 1920, x = cv.getContext("2d"); x.clearRect(0, 0, W, H);
    if (!R) return;
    tail = Math.max(0, tail); head = Math.min(R.end, head);
    if (head - tail < 1 || alpha <= 0) return;
    const at = (s) => {                                     // a point of the route at length s: place, normal, front share
      let a = 0, b = R.ss.length - 1; while (b - a > 1) { const m = (a + b) >> 1; if (R.ss[m] < s) a = m; else b = m; }
      const f = R.ss[b] > R.ss[a] ? (s - R.ss[a]) / (R.ss[b] - R.ss[a]) : 0, L = (u, v) => u + (v - u) * f;
      return { p: [L(R.pts[a][0], R.pts[b][0]), L(R.pts[a][1], R.pts[b][1])], n: [L(R.nn[a][0], R.nn[b][0]), L(R.nn[a][1], R.nn[b][1])], s, F: L(R.F[a], R.F[b]) };
    };
    const V = [at(tail)]; R.ss.forEach((s, i) => { if (s > tail && s < head) V.push({ p: R.pts[i], n: R.nn[i], s, F: R.F[i] }); }); V.push(at(head));
    const half = (s) => { const u = Math.min(1, Math.min(s - tail, head - s) / TAPER), e = u * u * (3 - 2 * u); return WID * (0.08 + 0.92 * e) / 2; };
    const E = V.map((v) => { const w = half(v.s); return [[(v.p[0] + v.n[0] * w) * k, (v.p[1] + v.n[1] * w) * k], [(v.p[0] - v.n[0] * w) * k, (v.p[1] - v.n[1] * w) * k]]; });
    const band = (c, i0, i1, edge) => {                    // the strip from sample i0 to i1: filled, then (in front) its white edges
      c.beginPath(); for (let i = i0; i <= i1; i++) c.lineTo(E[i][0][0], E[i][0][1]); for (let i = i1; i >= i0; i--) c.lineTo(E[i][1][0], E[i][1][1]);
      c.closePath(); c.fill();
      if (edge) [0, 1].forEach((j) => { c.beginPath(); for (let i = i0; i <= i1; i++) c.lineTo(E[i][j][0], E[i][j][1]); c.stroke(); });
    };
    const layer = (c, share, edge) => {
      c.clearRect(0, 0, W, H); c.fillStyle = LAV; c.strokeStyle = "#fff"; c.lineWidth = 1.6 * k; c.lineJoin = "round";
      const f = V.map(share), full = f.map((v) => v > 0.999), n = V.length - 1;
      for (let i = 0; i < n;) {                             // whole stretches at full share, as one polygon each
        if (!(full[i] && full[i + 1])) { i++; continue; }
        let j = i + 1; while (j < n && full[j + 1]) j++;
        c.globalAlpha = 1; band(c, i, j, edge); i = j;
      }
      for (let i = 0; i < n; i++) {                         // and around a fade, the overlapping two-step pieces
        const j = Math.min(n, i + 2), m = Math.min(n, i + 1);
        if (full[i] && full[m] && full[j]) continue;
        const a = Math.max(0, Math.min(1, f[m])); if (a < 0.001) continue;
        c.globalAlpha = 1 - Math.sqrt(1 - a); band(c, i, j, edge);
      }
      c.globalAlpha = 1;
    };
    layer(lay1.getContext("2d"), (v) => 1 - v.F, false); layer(lay2.getContext("2d"), (v) => v.F, true);
    x.globalAlpha = 0.35 * alpha; x.drawImage(lay1, 0, 0); x.globalAlpha = 0.75 * alpha; x.drawImage(lay2, 0, 0); x.globalAlpha = 1;
  }
  // her path from its left-most point, round twice and back to it: behind, front 2, front 1, behind
  function mobius(f1, bk, f2) {
    const c = nearest(bk, toPage, CUT);
    return [{ pts: sample(bk, toPage, c), back: true }, { pts: sample(f2, toPage), back: false }, { pts: sample(f1, toPage), back: false },
            { pts: sample(bk, toPage, 0, c), back: true }];
  }
  const MS = 5000, HOLD = 800, ease = (k) => (1 - Math.cos(Math.PI * k)) / 2;   // ms: the draw · the rest before the Loop
  const path = (sc) => S.R || (S.R = route(mobius($(".mr-geo.f1", sc), $(".mr-geo.bk", sc), $(".mr-geo.f2", sc))));
  // which slide this one was entered from (the engine sets body[data-scene] just before enter; the record arrives after it),
  // so that it moves on by itself only when the presentation is going forward
  new MutationObserver((rs) => rs.forEach((r) => { if (document.body.dataset.scene === "s-mobius-ribbon") S.from = r.oldValue; }))
    .observe(document.body, { attributes: true, attributeFilter: ["data-scene"], attributeOldValue: true });
  const onward = (sc) => {
    if (document.body.dataset.scene !== sc.id || (S.from && sceneIx(S.from) > sceneIx(sc.id))) return;
    next();
  };
  return {
    enter(_, sc) {
      plain(); reveal($(".mb-copy", sc), 600);
      const cv = $(".mr-strip", sc), R = path(sc);
      cancelAnimationFrame(S.raf);
      later(() => onward(sc), 1000 + MS + HOLD);
      if (reduced) { strip(cv, R, 0, R.end, 1); return; }
      strip(cv, R, 0, 0, 1);
      later(() => {
        const t0 = performance.now();
        const frame = (now) => {
          if (document.body.dataset.scene !== sc.id) return;
          const k = Math.min(1, (now - t0) / MS); strip(cv, R, 0, R.end * ease(k), 1);
          if (k < 1) S.raf = requestAnimationFrame(frame);
        };
        S.raf = requestAnimationFrame(frame);
      }, 1000);
    },
    leave() { cancelAnimationFrame(S.raf); },
  };
});
</script>
