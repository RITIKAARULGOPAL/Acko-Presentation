<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The site · ACKO slide s-site</title>
<!-- Open this file on its own to see and work on the slide (offline, no server). dev.js loads the deck's styles, data, chrome and
     engine around it. The build (tools/build.py) takes only what sits between the two markers below. -->
<base href="../">
<script src="assets/js/dev.js"></script>
</head>
<body>
<!-- slide:start -->
<section class="scene" id="s-site" data-part="2" data-title="The site" data-steps="1" data-mins="0.4"
  data-notes="The site: Regalium, on Hosur Road in Koramangala, 3rd floor. 91,000 sq ft super built-up, 56,650 sq ft carpet, for about 640 people. Nexus Mall and St John's are a few minutes' walk; the Silk Board metro is about two kilometres. The map turns 11.5° so the building lines up with our plans.">
  <div class="page">
    <div class="hdr"><b>The Site</b><span>Design Strategy</span></div>
    <div class="si-copy rv" style="left:1.8%;top:22%;width:30%">
      <h2 style="--i:0">Regalium, Koramangala</h2>
      <p style="--i:1">Koramangala Industrial Layout, off Hosur Road, Bengaluru.</p>
      <dl class="si-facts" style="--i:2">
        <div><dt>Floor</dt><dd>3rd floor · one plate</dd></div>
        <div><dt>Super built-up</dt><dd><span data-count="91000">91,000</span> sq ft</dd></div>
        <div><dt>Carpet</dt><dd><span data-count="56650">56,650</span> sq ft</dd></div>
        <div><dt>People</dt><dd>about <span data-count="640">640</span></dd></div>
      </dl>
      <ul class="si-walk" style="--i:3"></ul>
    </div>
  </div>
</section>
<style>
.vm-land { fill: #e3ecdd; stroke: none; }
.vm-water { fill: #d7e4f0; }
.vm-road { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; }
.vm-road.c { stroke: #d9d6df; }
.vm-rail { fill: none; stroke: #c06; stroke-width: 3; stroke-dasharray: 10 6; opacity: .5; }
.vm-hosur { fill: none; stroke: #cfc6e6; stroke-width: 9; stroke-linecap: round; }
.vm-bld path { fill: #dcd8e3; stroke: #cdc8d6; stroke-width: .4; }
.vm-foot { fill: #c9b3f3; stroke: #5222d0; stroke-width: 1.4; }
.vm-plate { fill: #5222d0; opacity: .55; }
.vm-gate { fill: #980000; }
.vm-lab { font-family: var(--body); font-size: 11px; fill: #8a849a; letter-spacing: .06em; }
.vm-mark circle { fill: #ffffff; stroke: #5222d0; stroke-width: 2; }
.vm-mark text { font-family: var(--body); font-size: 11px; font-weight: 600; fill: #3b3550; paint-order: stroke; stroke: #f2f1f5; stroke-width: 4px; }
.vm-pin text { font-family: var(--body); font-size: 15px; font-weight: 700; fill: #5222d0; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
.si-copy h2 { font-size: calc(var(--pt) * 22); font-weight: 600; color: var(--purple-2); line-height: 1.1; }
.si-copy > p { margin-top: calc(var(--pt) * 4); font-size: calc(var(--pt) * 8.6); color: #555; }
.si-facts { margin: calc(var(--pt) * 12) 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--pt) * 8) calc(var(--pt) * 14); }
.si-facts dt { font-size: calc(var(--pt) * 6); letter-spacing: .12em; text-transform: uppercase; color: #888; }
.si-facts dd { margin: 0; font-size: calc(var(--pt) * 11); font-weight: 600; }
.si-facts dd span { font-family: var(--num); font-weight: 400; color: var(--purple); }
.si-walk { list-style: none; margin: calc(var(--pt) * 14) 0 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--pt) * 4); font-size: calc(var(--pt) * 7.6); }
.si-walk li { display: flex; justify-content: space-between; gap: 1em; border-top: 1px solid #e3e0ea; padding-top: calc(var(--pt) * 3); }
.si-walk b { font-weight: 500; }
.si-walk span { color: var(--purple); font-family: var(--num); white-space: nowrap; }
</style>
<script>
/* the site: Koramangala as a vector map (Overture/OSM, data/site-floor.js); it closes in on Regalium, then turns 11.5° so the
   building lines up with the plans. Drawn in the world's map layer (#vmap) */
ACKO.slide("s-site", ({ $, $$, later, reveal, countUp, world, shade, reduced }) => {
  const SV = { built: false, vb: [-760, -590, 1520, 1180], rot: 0, raf: 0 };
  function siteMap() {
    if (SV.built || !window.ACKO_SITE) return;
    const S = window.ACKO_SITE, svg = $("#vmap");
    const roads = S.roads.slice().sort((a, b) => b.rank - a.rank);
    const land = S.land ? Object.entries(S.land).map(([k, d]) => `<path class="vm-land ${k}" d="${d}"/>`).join("") : "";
    const water = (S.water || []).map((w) => `<path class="vm-water" d="${w.d}"/>`).join("");
    const rail = (S.rail || []).map((r) => `<path class="vm-rail" d="${r.d}"/>`).join("");
    const hosur = S.hosur.map((seg) => `<path class="vm-hosur" d="M${seg.map((q) => q.join(" ")).join("L")}"/>`).join("");
    const marks = S.marks.slice(0, 5).map((m) => `<g class="vm-mark" transform="translate(${m.x} ${m.y})"><circle r="6"/><text x="10" y="4">${m.n}</text></g>`).join("");
    const labels = S.labels.map((l) => `<text class="vm-lab" transform="translate(${l.x} ${l.y}) rotate(${l.a})" text-anchor="middle">${l.t}</text>`).join("");
    svg.setAttribute("viewBox", SV.vb.join(" ")); svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
    svg.innerHTML = `<g id="vm-root">${land}${water}` +
      roads.map((r) => `<path class="vm-road c" d="${r.d}" style="stroke-width:${r.w + 2.4}"/>`).join("") +
      roads.map((r) => `<path class="vm-road" d="${r.d}" style="stroke-width:${r.w}"/>`).join("") + rail + hosur +
      `<g class="vm-bld">${S.buildings.map((d) => `<path d="${d}"/>`).join("")}</g>` +
      `<path class="vm-foot" d="${S.footprint.d}"/><path class="vm-plate" d="${S.onSite.plate}"/>` +
      `<circle class="vm-gate" cx="${S.gate[0]}" cy="${S.gate[1]}" r="7"/>${labels}${marks}` +
      `<g class="vm-pin" transform="translate(0 10)"><text y="-62" text-anchor="middle">Regalium · 3rd floor</text></g></g>`;
    $("#map-credit").textContent = S.attribution || "© OpenStreetMap contributors, Overture Maps";
    $("#s-site .si-walk").innerHTML = S.marks.slice(0, 5).map((m) => `<li><b>${m.n}</b><span>${m.walk >= 1000 ? (m.walk / 1000).toFixed(1) + " km" : Math.round(m.walk) + " m"} walk</span></li>`).join("");
    SV.built = true;
  }
  function view(vb, rot, ms) {
    cancelAnimationFrame(SV.raf);
    const svg = $("#vmap"), root = $("#vm-root"), from = SV.vb.slice(), r0 = SV.rot, t0 = performance.now();
    if (!root) return;
    const set = (v, r) => { SV.vb = v; SV.rot = r; svg.setAttribute("viewBox", v.map((q) => q.toFixed(1)).join(" ")); root.setAttribute("transform", `rotate(${r.toFixed(2)} 0 10)`); };
    if (!ms || reduced) return set(vb, rot);
    const run = (now) => { const k = Math.min(1, (now - t0) / ms), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      set(from.map((a, i) => a + (vb[i] - a) * e), r0 + (rot - r0) * e); if (k < 1) SV.raf = requestAnimationFrame(run); };
    SV.raf = requestAnimationFrame(run);
  }
  return {
    enter(_, sc) {
      siteMap(); world("map"); shade("left");
      // the whole neighbourhood, then closer, with Regalium right of the copy; then the turn that lines it up with the plans
      view([-1060, -590, 2100, 1180], 0, 0);
      later(() => view([-860, -360, 1300, 731], 0, 3000), 500);
      later(() => view([-713, -315, 1150, 647], -(window.ACKO_SITE ? window.ACKO_SITE.grid : 11.5), 1800), 3700);
      reveal($(".si-copy", sc), 300);
      $$("[data-count]", sc).forEach((e, i) => later(() => countUp(e, 1400), 900 + i * 150));
    },
    leave() { cancelAnimationFrame(SV.raf); },
  };
});
</script>
<!-- slide:end -->
</body>
</html>
