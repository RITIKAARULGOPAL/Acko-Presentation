<section class="scene lay" id="s-net" data-part="2" data-title="Layout Option 02" data-lens="explore" data-steps="3" data-mins="2.5" data-crumb="Level 03 › Layout Option 02" data-opt="opt2"
  data-notes="Option 02, the same layers. 1) The brief: one square per space, sized by its area, under the empty floor. 2) Zoning: the squares move onto the floor and take each zone's exact outline; each zone lands where it works best; hover a zone, on the plan or in the key, for its reason; the core is fixed on the east edge and not in contract. 3) The layout: the walls, glass and furniture of the 09.10 test fit, in the zoning colours. On the layout the buttons bottom left switch the colours: spaces, teams (every team has its own TV screen), acoustics, or none for the bare plan; the column shows the legend of the colours on; Occupancy opens the count against the brief.">
  <div class="copy lay-copy">
    <div class="kicker">09 · Layout Option 02</div>
    <!-- on the zoning, the zones' key in the column; each zone's reason shows on hover (Sathwick) -->
    <div class="zone-key only-step" data-only="2"><ul class="lgd why-lgd" data-lg="why"></ul></div>
    <!-- on the layout, the legend of the colours on the plan, in the column like the zoning's key (Sathwick) -->
    <div class="zone-key col-key" data-key="layout" hidden><ul class="lgd why-lgd" data-lg="zones"></ul></div>
    <div class="zone-key col-key" data-key="teams" hidden><p class="note" data-facts="teams"></p><ul class="lgd why-lgd" data-lg="teams"></ul></div>
    <ol class="layer-list">
      <li data-step="1" role="button" title="Go to this step"><b class="lt">The brief</b></li>
      <li data-step="2" role="button" title="Go to this step"><b class="lt">Zoning</b></li>
      <li data-step="3" role="button" title="Go to this step"><b class="lt">The layout</b></li>
    </ol>
  </div>
  <!-- the plan's colour layers, bottom left (Sathwick): one base plan; "Spaces", "Teams" or "Acoustics" lays its colours
       over it (one at a time, or neither), its legend in the column; Occupancy opens the count -->
  <div class="lay-tools ui">
    <div class="lay-panel" data-panel="occ">
      <details class="occ" open><summary></summary><div class="occ-body"></div></details>
    </div>
    <div class="lay-btns">
      <button type="button" data-tool="occ" class="only-step" data-only="3">Occupancy</button>
      <button type="button" data-tool="layout" class="only-step" data-only="3"><i class="sw" style="background:linear-gradient(90deg,#B5F4D9 0 33%,#F2CA9C 0 66%,#B6B9FF 0)"></i>Spaces</button>
      <button type="button" data-tool="teams" class="only-step" data-only="3"><i class="sw" style="background:linear-gradient(90deg,#B6B9FF 0 33%,#D88E83 0 66%,#5A8B85 0)"></i>Teams</button>
      <button type="button" data-tool="acoustics" class="only-step" data-only="3"><i class="sw" style="background:linear-gradient(90deg,#C8C8C8 0 33%,#92AD91 0 66%,#55634A 0)"></i>Acoustics</button>
    </div>
  </div>
