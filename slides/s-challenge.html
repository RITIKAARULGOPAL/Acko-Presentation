<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The challenge at hand · ACKO slide s-challenge</title>
<!-- Open this file on its own to see and work on the slide (offline, no server). dev.js loads the deck's styles, data, chrome and
     engine around it. The build (tools/build.py) takes only what sits between the two markers below. -->
<base href="../">
<script src="assets/js/dev.js"></script>
</head>
<body>
<!-- slide:start -->
<section class="scene" id="s-challenge" data-part="1" data-mode="lavender" data-title="The challenge at hand" data-steps="3" data-mins="0.8" data-beats="The worry,The answer,One place"
  data-notes="1 · It's not a move. Moving offices is easy; moving people isn't. Everyone coming in from the two locations asks the same things: where do I go, will I fit, where's my desk, where's my team. 2 · So we design a place that already feels like home: teams kept together, easy to find your way, room to explore, the same rhythm of the working day. 3 · One place, one experience.">
  <div class="page">
    <svg class="ch-grid at" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <line x1="858" y1="0" x2="858" y2="1080"/><line x1="1759" y1="0" x2="1759" y2="1080"/><line x1="1891" y1="0" x2="1891" y2="1080"/>
      <line x1="0" y1="513" x2="1920" y2="513"/><line x1="0" y1="848" x2="1920" y2="848"/><line x1="0" y1="964" x2="1920" y2="964"/>
    </svg>
    <!-- beat 1 · the worry: the top band, in the people's own words -->
    <div class="ch-row rv dim" style="left:0;top:26.5%;width:44.7%;height:21%">
      <div class="ch-w" style="--i:0"><span class="hand">“Where do I go?”</span><img src="assets/img/ch-disoriented.webp" alt=""></div>
      <div class="ch-w" style="--i:1"><span class="hand">“Will I fit?”</span><img src="assets/img/ch-unsettled.webp" alt=""></div>
      <div class="ch-w" style="--i:2"><span class="hand">“Where’s my desk?”</span><img src="assets/img/ch-displaced.webp" alt=""></div>
      <div class="ch-w" style="--i:3"><span class="hand">“Where’s my team?”</span><img class="i-plug" src="assets/img/ch-disconnected.webp" alt=""></div>
    </div>
    <div class="ch-copy rv dim" style="left:46.1%;top:30%;width:44%"><small style="--i:0">It’s not a move</small><h3 style="--i:1">Moving offices is easy. <b>Moving people isn’t.</b></h3></div>
    <!-- beat 2 · the answer: the bottom band, where the slide always had it; the worry stays on above, quieter -->
    <i class="ch-turn" data-step="2" style="left:44.7%;top:47.5%">&darr;</i>
    <div class="ch-row" data-step="2" style="left:0;top:59.4%;width:44.7%;height:19.1%">
      <div class="ch-w st" style="--i:0"><span class="hand">Teams together</span><img class="i-fam" src="assets/img/ch-familiar.webp" alt=""></div>
      <div class="ch-w st" style="--i:1"><span class="hand">Easy to find</span><img class="i-com" src="assets/img/ch-comfort.webp" alt=""></div>
      <div class="ch-w st" style="--i:2"><span class="hand">Room to explore</span><img class="i-spa" src="assets/img/ch-spatial.webp" alt=""></div>
      <div class="ch-w st" style="--i:3"><span class="hand">Same rhythm</span><img class="i-dyn" src="assets/img/ch-dynamics.webp" alt=""></div>
    </div>
    <div class="ch-copy" data-step="2" style="left:46.1%;top:58.5%;width:44%"><small class="st" style="--i:0">So we design</small><h3 class="st" style="--i:1"><b>A place that already feels like home.</b></h3></div>
    <!-- beat 3 · the promise, on its own click -->
    <span class="ch-one" data-step="3" style="left:46.1%;top:71.5%">One Place. One Experience.</span>
  </div>
</section>
<style>
/* ---------- the challenge → the answer (slide 6), lavender: one slide in two bands, the worry above, the answer below ---------- */
#s-challenge .ch-grid { left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
#s-challenge .ch-grid line { stroke: rgba(255,255,255,.55); stroke-width: 1; vector-effect: non-scaling-stroke; }
/* a word as the PPT sets it: a small handwritten label, a dotted lead down to its icon, the icon standing on the band's line */
#s-challenge .ch-row { display: grid; grid-template-columns: repeat(4, 1fr); }
#s-challenge .ch-w { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; }
#s-challenge .ch-w span { position: relative; display: block; max-width: calc(var(--pt) * 62); font-size: calc(var(--pt) * 11.7); line-height: 1.3; color: #434343; padding-bottom: calc(var(--pt) * 19); }
#s-challenge .ch-w span::after { content: ""; position: absolute; left: 50%; bottom: calc(var(--pt) * 2); height: calc(var(--pt) * 14); border-left: 1.5px dotted #6b6b6b; }
#s-challenge .ch-w img { height: calc(var(--pt) * 30); width: auto; mix-blend-mode: multiply; }
#s-challenge img.i-plug { height: calc(var(--pt) * 42); margin-top: calc(var(--pt) * -12); }   /* the plug: its picture has more air round it */
#s-challenge img.i-fam, #s-challenge img.i-dyn { height: calc(var(--pt) * 24.8); }
#s-challenge img.i-com { height: calc(var(--pt) * 23.5); }
#s-challenge img.i-spa { height: calc(var(--pt) * 31); }
/* the copy: the italic line, then the headline */
#s-challenge .ch-copy small { display: block; font-size: calc(var(--pt) * 8.8); font-style: italic; color: #555; margin-bottom: calc(var(--pt) * 12); }
#s-challenge .ch-copy h3 { font-size: calc(var(--pt) * 17.9); line-height: 1.24; font-weight: 400; color: var(--purple-2); }
#s-challenge .ch-copy h3 b { font-weight: 700; }
#s-challenge .ch-one { font-size: calc(var(--pt) * 22); font-style: italic; font-weight: 700; color: #fff; white-space: nowrap; }
#s-challenge .ch-turn { width: calc(var(--pt) * 14); height: calc(var(--pt) * 14); margin: calc(var(--pt) * -7) 0 0 calc(var(--pt) * -7); border-radius: 50%; background: var(--purple-2); color: #fff;
  display: grid; place-items: center; font-style: normal; font-size: calc(var(--pt) * 8); }
/* beat 2: the answer's parts come in one after another; the worry stays, a little quieter */
#s-challenge [data-step="2"] .st { opacity: 0; transform: translateY(8px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
#s-challenge [data-step="2"].shown .st { opacity: 1; transform: none; transition-delay: calc(.25s + var(--i, 0) * 220ms); }
#s-challenge .dim { transition: opacity .8s var(--ease); }
#s-challenge .b2 .dim { opacity: .62; }
/* stepping back a beat: what goes, goes at once, without the delays it came in with */
#s-challenge .page:not(.b2) [data-step="2"], #s-challenge .page:not(.b2) [data-step="2"] .st,
#s-challenge .page:not(.b3) [data-step="3"] { transition-delay: 0s !important; }
</style>
<script>
/* the challenge → the answer (slide 6): the worry comes in as the slide is entered (1); the answer comes in below it, the worry
   staying on, quieter (2); then One Place. One Experience. (3) */
ACKO.slide("s-challenge", ({ $, plain, reveal }) => ({
  enter(_, sc) { plain(); sc.querySelectorAll(".rv").forEach((e) => reveal(e, 120)); },
  step(k, sc) { const pg = $(".page", sc); pg.classList.toggle("b2", k >= 2); pg.classList.toggle("b3", k >= 3); },
}));
</script>
<!-- slide:end -->
</body>
</html>
