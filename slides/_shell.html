<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACKO · The Loop</title>
<meta name="description" content="SKV × ACKO — the Loop: an interactive design presentation for ACKO's head office at Regalium, Koramangala, Bengaluru.">
<link rel="stylesheet" href="assets/css/app.css?v=1">
<link rel="stylesheet" href="assets/css/plan-hover.css?v=1">
<!-- @styles: tools/build.py puts each slide's <style> here -->
</head>
<body>

<header class="topbar">
  <!-- the ACKO symbol (purple; white on dark pages and over photos); hover lists the deck's five sections, a click opens one -->
  <div class="topic-mark" id="topic-mark"><button type="button" class="tm-btn" aria-label="ACKO · sections"><img class="logo-ink" src="assets/img/acko-mark.webp" alt="ACKO"><img class="logo-light" src="assets/img/acko-mark-white.webp" alt=""></button><div class="tm-list" id="tm-list"></div></div>
</header>

<!-- ======================= THE WORLD (persistent, full bleed) ======================= -->
<div id="world">
  <div class="w-layer" id="w-map"><svg class="vmap" id="vmap" aria-hidden="true"></svg><div class="credit" id="map-credit"></div></div>
  <div class="w-layer" id="w-plan">
    <div class="plan-frame" id="frame-a"><div class="plan-host" id="world-plan" style="position:absolute;inset:0"></div><span class="frame-tag" id="tag-a" style="display:none"></span></div>
  </div>
  <div class="w-layer" id="w-photo"><div id="photo-stack"></div><div class="credit" id="photo-credit"></div></div>
</div>
<div id="shade"></div>
<!-- a render opened full size: ✕, Esc, a click beside it, or moving on closes it -->
<div class="lightbox" id="lightbox" hidden><figure><img alt=""><figcaption></figcaption></figure><button type="button" class="lb-close" aria-label="Close">✕</button></div>

<div class="progress" id="progress"></div>
<div class="hint" id="hint">Copyright © 2026 Studiokon Ventures Pvt Ltd. All rights reserved</div>
<!-- the deck's footer lockup; the logos switch decks: ACKO presentation ↔ About SKV -->
<div class="lockup">
  <button class="brand-btn" id="brand-main" data-track="main" title="Back to the presentation, where you left it">
    <img class="logo-ink" src="assets/img/acko-ink.webp" alt="ACKO"><img class="logo-light" src="assets/img/acko-white.webp" alt="ACKO">
  </button>
  <i></i>
  <button class="brand-btn" id="brand-skv" data-track="skv" title="About SKV">
    <img class="logo-light" src="assets/img/skv-light.png" alt="SKV"><img class="logo-ink" src="assets/img/skv-ink.webp" alt="SKV">
  </button>
</div>

<!-- the walk's controls, one set for every walk slide (s-w-*): moved into whichever is open -->
<div id="walk-ui" hidden>
  <div class="walk-ctl">
    <span class="wk-vol"><button type="button" class="wk-btn" id="wk-mute" title="Music on / off" aria-label="Music on / off"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path class="wave" d="M16 8a5 5 0 0 1 0 8"/><path class="wave" d="M18.5 5.5a9 9 0 0 1 0 13"/><path class="muted-line" d="M3 3l18 18"/></svg></button><input type="range" id="wk-level" min="0" max="100" value="35" aria-label="Volume" title="Volume"></span>
    <button type="button" class="wk-btn" id="wk-pan" title="Pan mode: drag the render" aria-label="Pan mode"><svg viewBox="0 0 24 24"><path d="M8 11V6.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V5a1.5 1.5 0 0 1 3 0v6"/><path d="M14 10.5V6a1.5 1.5 0 0 1 3 0v7"/><path d="M17 12v-2a1.5 1.5 0 0 1 3 0v5c0 3.5-2 6-5.5 6h-2c-2 0-3-.6-4.3-2.2L5 15c-.6-.8-.4-1.7.3-2.2.7-.5 1.6-.4 2.2.2L8 14"/></svg></button>
    <button type="button" class="wk-btn on" id="wk-kp" title="Keyplan on / off" aria-label="Keyplan on / off"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg></button>
  </div>
  <audio id="wk-audio" loop preload="none" src="assets/audio/gallery-ambient.mp3"></audio>
  <!-- the keyplan: the deck's plan with the maroon camera mark (until the DXF's cameras replace it) -->
  <div class="wk-kp" id="wk-kpimg"><div class="wk-kp-in"><img alt=""><i class="wk-cam"><svg viewBox="-10 -10 20 20"><path d="M-6 -7L0 6L6 -7"/></svg></i></div></div>
  <div class="wk-name">
    <div class="wk-kick" id="wk-kick">Visual Direction</div>
    <h2 id="wk-n"></h2>
    <div class="wk-opt" id="wk-opt"></div>
    <p class="wk-q" id="wk-q"></p>
    <p class="wk-p" id="wk-p"></p>
  </div>
  <nav class="wk-nav" id="wk-nav" aria-label="Spaces"></nav>
</div>

<main id="stage">

<!-- @slides: tools/build.py puts slides/order.txt here -->

</main>

<div class="overview" id="overview"><div class="ov-kick">All chapters</div><div id="overview-grid"></div></div>
<div class="notes" id="notes"><b><span>Speaker notes</span><span id="notes-time"></span></b><span id="notes-text"></span><span class="keys">← → beats · O index · N notes · F fullscreen · B blank · L laser</span></div>
<div class="blank" id="blank"></div>
<div class="cur" id="cur"><canvas class="cur-trail"></canvas><i class="cur-ring"></i><i class="cur-dot"></i><i class="cur-laser"></i></div>

<script src="assets/vendor/three.min.js"></script>
<script src="data/keyplans.js?v=1"></script>
<script src="data/plan-dxf.js?v=1"></script>
<script src="assets/js/plan-hover.js?v=1"></script>
<script src="data/site-floor.js?v=1"></script>
<script src="assets/js/app.js?v=1"></script>
<!-- @scripts: tools/build.py puts each slide's <script> here, then ACKO.start() -->
</body>
</html>
