<script>
/* memories (deck slide 8): the deck's page as placed — map, trees, the six photographs — with the dashed route across the
   campus, one memory per click. The same three friends walk the route from memory to memory: each click, the line draws on
   ahead of them, they walk (stepping off the line where a memory sits beside it) and act that memory out — a dribble and
   a wave at the court, a look at the forest path, laughs on a bench, lunch at the café, study at a desk, a huddle on the
   stairs. Each memory's props stay where they left them. */
ACKO.slide("s-memories", ({ $, $$, plain, reveal, reduced }) => {
  // the line's stop for each beat (share of the route's length); an element belongs to the beat whose stretch holds its data-s
  const STOP = [0, .065, .358, .5, .76, .84, 1];
  const beatOf = (s) => STOP.findIndex((v, i) => i > 0 && s <= v + 1e-6);

  /* ---------- a person, flat like the deck's cut-outs: stands on (0,0) facing right, about 97 tall. The limbs turn about fixed
     joints (hip 48, knee 25, shoulder 77, elbow 62 up from the soles); pose() sets them every frame ---------- */
  const NS = "http://www.w3.org/2000/svg";
  const HIP = 48, KNEE = 25, SHO = 77, ELB = 62, WRI = 48, NECK = 83;
  const shade = (hex, k) => "#" + hex.slice(1).match(/../g).map((h) => Math.round(parseInt(h, 16) * (1 - k)).toString(16).padStart(2, "0")).join("");
  const HAIR = {
    short: (c) => `<path fill="${c}" d="M-4.8-85.2C-6.8-88-6.2-94.6-.6-95.9 3.4-96.8 6.8-95.2 7.4-92.2 5.4-92.9 3-93 1.2-92 0-91.2-.6-89.6-1.6-88.6-2.4-87.6-3.2-86.6-4.8-85.2Z"/>`,
    long: (c) => `<path fill="${c}" d="M-5.6-86C-7.2-91-5.6-96.2 0-96.3 4-96.4 7-94.2 7.4-91.6 5.4-92.6 2.6-92.8.8-91.8-.6-90.8-1-88.6-1.2-86-1.4-82.8-.8-80-.2-77.4L-6.6-76.6C-7.2-79.6-6.4-83-5.6-86Z"/>`,
    bun: (c) => HAIR.short(c) + `<circle cx="-4.6" cy="-94.4" r="3.1" fill="${c}"/>`,
    curly: (c) => [[-4.4, -89.6], [-3.6, -93.6], [.2, -95.8], [4.2, -95], [-5.2, -86]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.9" fill="${c}"/>`).join(""),
  };
  function person(o) {
    const skin = o.skin || "#f0c8a4", legs = o.legs || "#c9ccd1", shin = o.shin || legs, shoe = o.shoe || "#efefec", top = o.top;
    const leg = (k, dk) => `<g data-j="${k}"><path d="M0-${HIP}V-${KNEE}" stroke="${shade(legs, dk)}" stroke-width="6.4"/>` +
      `<g data-j="${k}2"><path d="M0-${KNEE}V-4.2" stroke="${shade(shin, dk)}" stroke-width="5.4"/><path fill="${shade(shoe, dk)}" d="M-2.8-4.8h5.8c2.8 0 3.9 1.7 3.9 3.4V0H-2.8Z"/></g></g>`;
    const arm = (k, dk, hold) => `<g data-j="${k}"><path d="M0-${SHO}V-${ELB}" stroke="${shade(o.sleeve || top, dk)}" stroke-width="5"/>` +
      `<g data-j="${k}2"><path d="M0-${ELB}V-${WRI + 1.6}" stroke="${shade(o.cuff || o.sleeve || top, dk)}" stroke-width="4.3"/><circle cy="-${WRI}" r="2.4" fill="${shade(skin, dk)}"/>${hold || ""}</g></g>`;
    const hips = o.skirt ? `<path fill="${o.skirt}" d="M-6.2-53H6.2L9.4-31.5H-9.4Z"/>` : `<path fill="${legs}" d="M-6-53H6V-45.5H-6Z"/>`;
    const body = `<path fill="${top}" d="M-5.8-80.6C-2-82.4 2-82.4 5.8-80.6L${o.coat ? "8.6-30H-8.6" : "6.6-48.5H-6.6"}Z"/>` +
      (o.shirt ? `<path fill="${o.shirt}" d="M1-81.4H4.8L3.2-69Z"/>` : "") +
      (o.bag ? `<path stroke="${shade(o.bag, .2)}" stroke-width="1" d="M2.6-80.6L-5.6-58"/><rect x="-10.4" y="-60" width="7.6" height="9.4" rx="2" fill="${o.bag}"/>` : "");
    const head = `<g data-j="hd"><path fill="${skin}" d="M-1.6-84.6H1.8V-79H-1.6Z"/><circle cx=".9" cy="-89" r="6.1" fill="${skin}"/>${HAIR[o.hair || "short"](o.hc || "#2a211c")}</g>`;
    return `${leg("lb", .18)}<g data-j="ub">${arm("ab", .18)}</g>${leg("lf", 0)}${hips}<g data-j="uf">${body}${head}${arm("af", 0, o.hold)}</g>`;
  }
  // a figure at (x, y): its soles, or the seat it sits on when seated; scale s; facing left when flip
  function place(root, o) {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "mem-p"); g.innerHTML = person(o); root.appendChild(g);
    const j = {}; g.querySelectorAll("[data-j]").forEach((e) => (j[e.dataset.j] = e));
    const s = o.s || 1;
    return { g, j, s, x: o.x, y: o.y + (o.seated ? (HIP - 3) * s : 0), flip: !!o.flip, seated: !!o.seated, dy: 0, bd: 0 };
  }
  const rad = Math.PI / 180, cos = (d) => Math.cos(d * rad), sin = (d) => Math.sin(d * rad);
  const R = (a, x, y) => `rotate(${(+a || 0).toFixed(2)} ${x} ${y})`;
  // p: lf / lb / af / ab = [upper, lower] in degrees (0 hangs straight down, negative swings forward); bd leans the body forward;
  // hd nods the head forward. A standing figure keeps its lower foot on the ground.
  function pose(f, p) {
    const J = f.j;
    J.lf.setAttribute("transform", R(p.lf[0], 0, -HIP)); J.lf2.setAttribute("transform", R(p.lf[1], 0, -KNEE));
    J.lb.setAttribute("transform", R(p.lb[0], 0, -HIP)); J.lb2.setAttribute("transform", R(p.lb[1], 0, -KNEE));
    J.af.setAttribute("transform", R(p.af[0], 0, -SHO)); J.af2.setAttribute("transform", R(p.af[1], 0, -ELB));
    J.ab.setAttribute("transform", R(p.ab[0], 0, -SHO)); J.ab2.setAttribute("transform", R(p.ab[1], 0, -ELB));
    const up = R(p.bd, 0, -HIP); J.ub.setAttribute("transform", up); J.uf.setAttribute("transform", up);
    J.hd.setAttribute("transform", R(p.hd, .5, -NECK));
    let dy = 0;
    if (!f.seated) { const ext = (l) => 23 * cos(l[0]) + 21 * cos(l[0] + l[1]); dy = 44 - Math.max(ext(p.lf), ext(p.lb)); }
    f.dy = dy; f.bd = p.bd || 0;
    f.g.setAttribute("transform", `translate(${f.x.toFixed(1)} ${(f.y + dy * f.s).toFixed(1)}) scale(${f.flip ? -f.s : f.s} ${f.s})`);
  }
  // where the hand of an arm at [upper, lower] is on the page, for the figure's last pose
  function handAt(f, a) {
    const e = [-15 * sin(a[0]), -SHO + 15 * cos(a[0])], b = a[0] + a[1], h = [e[0] - 14 * sin(b), e[1] + 14 * cos(b) + HIP];
    const c = cos(f.bd), s = sin(f.bd), x = h[0] * c - h[1] * s, y = h[0] * s + h[1] * c - HIP;
    return [f.x + (f.flip ? -1 : 1) * f.s * x, f.y + f.dy * f.s + f.s * y];
  }
  const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
  const mix = (a, b, k) => a + (b - a) * k;
  // seated legs: the shins hang almost straight down to a floor `drop` below the seat (the ground, or the step below), so the
  // knees come up as the floor comes closer
  const sit = (drop) => { const th = Math.acos(Math.max(-1, Math.min(1, (drop - 21.8) / 23))) / rad; return { lf: [-th, th - 8], lb: [-th + 6, th - 12] }; };
  // a walking stride at phase w (radians)
  const stride = (w, amp) => ({
    lf: [-amp * Math.sin(w), 3 + 30 * Math.pow(Math.max(0, Math.cos(w)), 1.5)],
    lb: [amp * Math.sin(w), 3 + 30 * Math.pow(Math.max(0, -Math.cos(w)), 1.5)],
    af: [amp * .8 * Math.sin(w), -10 - 8 * Math.max(0, -Math.sin(w))],
    ab: [-amp * .8 * Math.sin(w), -10 - 8 * Math.max(0, Math.sin(w))],
  });
  const scene = (svg, s) => { const g = document.createElementNS(NS, "g"); g.setAttribute("class", "mem-sc"); g.dataset.s = s; svg.appendChild(g); return g; };
  const draw = (root, markup) => { const g = document.createElementNS(NS, "g"); g.innerHTML = markup; root.appendChild(g); return g; };

  const mixPose = (p, q, k) => ({ lf: [mix(p.lf[0], q.lf[0], k), mix(p.lf[1], q.lf[1], k)], lb: [mix(p.lb[0], q.lb[0], k), mix(p.lb[1], q.lb[1], k)],
    af: [mix(p.af[0], q.af[0], k), mix(p.af[1], q.af[1], k)], ab: [mix(p.ab[0], q.ab[0], k), mix(p.ab[1], q.ab[1], k)], bd: mix(p.bd || 0, q.bd || 0, k), hd: mix(p.hd || 0, q.hd || 0, k) });
  const STAND = { lf: [0, 2], lb: [0, 2], af: [3, -8], ab: [-3, -8], bd: 1, hd: 0 };
  const SEAT = (drop) => ({ ...sit(drop), af: [-22, -44], ab: [-16, -40], bd: 4, hd: 0 });

  /* ---------- the three friends, and where they stand (or sit) at each memory: [x, ground y, facing (1 right, −1 left), seat y] ---------- */
  const FRIENDS = {
    A: { top: "#cfae86", shirt: "#f4f4f2", legs: "#577aa8", hair: "curly", hc: "#2a211c", skin: "#b67c58" },
    B: { top: "#e7b6c2", legs: "#efe8dc", hair: "long", hc: "#bd4430" },
    C: { top: "#a7c0df", shirt: "#f4f4f2", legs: "#2d3b58", hair: "short", hc: "#6a4733", skin: "#e0ad85" },
  };
  const WHO = ["A", "B", "C"];
  const yAt = (x) => 576 - (x + 25) * 34 / 629;            // the first stretch of the route
  const SPOT = [
    { A: [-118, yAt(-118), 1], C: [-84, yAt(-84), 1], B: [-50, yAt(-50), 1] },               // 0 · off the page, left
    { A: [58, yAt(58), 1], C: [112, yAt(112), -1], B: [160, yAt(160), -1] },                 // 1 · the court
    { A: [478, yAt(478), 1], C: [510, yAt(510), 1], B: [542, yAt(542), 1] },                 // 2 · the pathway, at the forest
    { A: [857, 972, 1, 947], B: [927, 972, -1, 947], C: [958, 972, -1] },                    // 3 · the bench, under the line
    { A: [1209, 401, 1, 377], B: [1266, 401, -1, 377], C: [1296, 401, -1] },                 // 4 · the café table
    { B: [1481, 828, 1, 804], A: [1566, 828, -1, 804], C: [1604, 828, -1] },                 // 5 · the desk, below the line
    { C: [1628, 505, 1], B: [1714, 491, -1, 477], A: [1757, 477, -1, 463] },                 // 6 · the steps
  ];
  // the route's corners: from one memory to the next they follow the line, and step off it where a memory sits beside it
  const R1 = [604, 542], R2 = [617, 881], R3 = [1001, 881], R4 = [1001, 428], R5 = [1132, 428], R6 = [1180, 401], R7 = [1449, 401];
  const VIA = [null, () => [], () => [], (f, t) => [R1, R2, [t[0], 881]], (f) => [[f[0], 881], R3, R4, R5, R6], () => [R7], () => []];
  const V = 180, STRIDE = 93, AMP = 32, UP = .35, DOWN = .45;   // px/s; px per stride cycle at AMP°; standing up / sitting down (s)
  const polyline = (pts) => { const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, c, L: c[c.length - 1] }; };
  const along = (r, d) => {
    d = Math.min(r.L, Math.max(0, d)); let i = 1;
    while (i < r.pts.length - 1 && r.c[i] < d) i++;
    const a = r.pts[i - 1], b = r.pts[i], k = (d - r.c[i - 1]) / ((r.c[i] - r.c[i - 1]) || 1);
    return [mix(a[0], b[0], k), mix(a[1], b[1], k), b[0] - a[0]];
  };

  /* ---------- the memories: their props, and what the three do there (poses, then the props that follow a hand) ---------- */
  function build(svg) {
    const P = {};
    {   // 1 · the court: a ball
      const g = scene(svg, .03);
      P.ball = draw(g, `<circle r="6.4" fill="#d9772f"/><path stroke="#7a3a12" stroke-width=".8" d="M-6.4 0H6.4M0-6.4V6.4M-4.6-4.4C-1.8-1.6-1.8 1.6-4.6 4.4M4.6-4.4C1.8-1.6 1.8 1.6 4.6 4.4"/>`);
    }
    {   // 3 · a bench under the line
      const g = scene(svg, .46);
      draw(g, `<path fill="#9c7550" d="M846 930H934V934H846Z"/><path fill="#b5895c" d="M842 947H938V951H842Z"/><path fill="#55534e" d="M850 951H853V972H850ZM927 951H930V972H927ZM850 934H853V947H850ZM927 934H930V947H927Z"/>`);
    }
    {   // 4 · the café: a small table, two stools, a plate and a steaming cup
      const g = scene(svg, .74);
      draw(g, `<path fill="#55534e" d="M1236.6 372H1239.4V399H1236.6ZM1229 399H1247V401.2H1229ZM1209.6 380H1212V401H1209.6ZM1264 380H1266.4V401H1264Z"/>` +
        `<path fill="#b5895c" d="M1203 377H1219V380H1203ZM1257 377H1273V380H1257Z"/><path fill="#efe8dc" d="M1219 369.2H1257V372.2H1219Z"/>` +
        `<ellipse cx="1246" cy="368.6" rx="6.4" ry="1.4" fill="#f4f4f2"/><path fill="#8db7a5" d="M1242 368.4C1242 365.8 1250 365.8 1250 368.4Z"/><path fill="#d9772f" d="M1245 367.8C1245 366.2 1248 366.2 1248 367.8Z"/>` +
        `<path fill="#f4f4f2" d="M1226.6 363.4H1231.4L1231 369.2H1227Z"/>`);
      P.steam = [...draw(g, [0, 1, 2].map((i) => `<path stroke="#e9e3f7" stroke-width=".9" d="M${1228 + i * 1.6} 361C${1226.4 + i * 1.6} 358.4 ${1230.6 + i * 1.6} 356.4 ${1228.6 + i * 1.6} 353.4"/>`).join("")).children];
    }
    {   // 5 · a desk with a laptop, a chair and a stool
      const g = scene(svg, .84);
      draw(g, `<path fill="#55534e" d="M1471 807H1473.4V828H1471ZM1485.6 807H1488V828H1485.6ZM1469.6 778H1472.2V807H1469.6ZM1500 797H1502.4V828H1500ZM1544.6 797H1547V828H1544.6ZM1559 807H1561.4V828H1559ZM1571.6 807H1574V828H1571.6Z"/>` +
        `<path fill="#b5895c" d="M1468 804H1490V807H1468ZM1557 804H1576V807H1557Z"/><path fill="#efe8dc" d="M1496 794H1551V797H1496Z"/>` +
        `<path fill="#8db7a5" d="M1532 788H1548V791H1532Z"/><path fill="#e7b6c2" d="M1533.5 791H1547V794H1533.5Z"/><path fill="#f4f4f2" d="M1539 783H1543.6V788H1539Z"/>` +
        `<path fill="#9aa2ad" d="M1505 792.4H1522V794H1505Z"/><path fill="#9aa2ad" d="M1521.4 793.4L1524.6 776.6L1526.4 777L1523.2 794Z"/>`);
      P.glow = draw(g, `<path fill="#e6defa" d="M1521 792.6L1524.2 777.6L1525.4 777.8L1522.2 792.8Z"/><radialGradient id="mem-glow"><stop offset="0" stop-color="#e6defa" stop-opacity=".55"/><stop offset="1" stop-color="#e6defa" stop-opacity="0"/></radialGradient><ellipse cx="1520" cy="786" rx="11" ry="9" fill="url(#mem-glow)"/>`);
    }
    {   // 6 · a few steps under the stairs photo
      const g = scene(svg, .95);
      draw(g, `<path fill="#2b2a28" d="M1646 491H1772V505H1646ZM1688 477H1772V491H1688ZM1730 463H1772V477H1730Z"/><path stroke="#5f5c56" stroke-width="1.2" d="M1646 491H1688V477H1730V463H1772"/>`);
    }
    // the three, above every prop; then what they hold: A's cup (it waits on the café table) and B's notebook
    const folk = draw(svg, ""), F = {};
    WHO.forEach((w) => (F[w] = place(folk, { x: 0, y: 0, ...FRIENDS[w] })));
    P.cup = draw(scene(svg, .74), `<path fill="#f4f4f2" d="M-2.4-4.6H2.4L2 0H-2Z"/><path stroke="#f4f4f2" stroke-width=".8" d="M2.3-3.6C4-3.6 4-1.2 2.1-1.2"/>`);
    P.note = draw(svg, `<path fill="#efe8dc" d="M-4.2-3.4H4.2V3.4H-4.2Z"/><path stroke="#9aa2ad" stroke-width=".6" d="M-2.6-1.4H2.6M-2.6.6H2.6"/>`);
    return { P, F, folk };
  }

  // what the three do at each memory, t seconds after they've all arrived: their poses, then props(F) for what follows a hand
  const T = .62;
  const MEM = [null,
    {   // 1 · the court: A dribbles, C claps, B waves
      pose(t) {
        const u = (t % T) / T, h = Math.abs(Math.sin(Math.PI * u)), kn = 1 - h, clap = t % 2.6 < 1.5 ? Math.abs(Math.sin(t * 7)) : 0;
        const v = t % 4.2, up = ss(0, .5, v) * (1 - ss(2.1, 2.6, v)), wv = v > .5 && v < 2.1 ? Math.sin((v - .5) / .53 * 2 * Math.PI) : 0;
        this.h = h;
        return {
          A: { lf: [-16 - 3 * kn, 24 + 6 * kn], lb: [8, 14 + 4 * kn], af: [-30 - 4 * h, -28 - 12 * h], ab: [-26, -46], bd: 9, hd: -7 },
          C: { lf: [-2, 2], lb: [3, 1], af: [-44, -58 + 22 * clap], ab: [-40, -52 + 22 * clap], bd: 3, hd: -3 },
          B: { lf: [-2, 2], lb: [3, 1], af: [mix(6, -160, up), mix(-8, -12 + 26 * wv, up)], ab: [-3, -10], bd: -1, hd: -4 * up },
        };
      },
      props(F, P, p) {
        const hp = handAt(F.A, p.A.af), h = this.h, by = mix(570.1 - 6.4, hp[1] + 8.8, h), sq = Math.max(0, 1 - h / .1);
        P.ball.setAttribute("transform", `translate(${hp[0].toFixed(1)} ${(by + 6.4 * sq * .2).toFixed(1)}) scale(${(1 + .14 * sq).toFixed(3)} ${(1 - .2 * sq).toFixed(3)})`);
      },
      rest(P) { P.ball.setAttribute("transform", "translate(84 563.7)"); },
    },
    {   // 2 · the pathway: they stop by the forest path; C points at it, the others look and chat
      pose(t) {
        const pt = ss(0, .5, t % 5) * (1 - ss(2.6, 3.1, t % 5));
        return {
          A: { ...STAND, hd: 3 * Math.sin(t * .9), af: [3, -8 - 6 * Math.max(0, Math.sin(t * 1.7))] },
          B: { ...STAND, hd: -3 - 4 * pt + 2 * Math.sin(t * 1.2) },
          C: { ...STAND, af: [mix(3, -84, pt), mix(-8, -4, pt)], bd: 1, hd: -5 * pt },
        };
      },
    },
    {   // 3 · the bench: A and B sit and laugh, C stands by them
      pose(t) {
        const la = Math.max(0, Math.sin(t * 2.1)), lb = Math.max(0, Math.sin(t * 2.1 + 2)), lc = Math.max(0, Math.sin(t * 1.7 + 4)), legs = sit(25);
        return {
          A: { ...legs, af: [-34, -70 + 10 * Math.sin(t * 9) * la], ab: [-20, -50], bd: 4 - 6 * la, hd: -8 * la + 2 * Math.sin(t * 14) * la },
          B: { ...legs, af: [-24, -60], ab: [-10, -40], bd: 8 + 6 * lb, hd: 4 + 6 * lb * Math.sin(t * 13) },
          C: { lf: [2, 0], lb: [-6, 2], af: [-18 - 10 * lc, -96 + 8 * Math.sin(t * 8) * lc], ab: [6, -8], bd: 2 - 5 * lc, hd: -6 * lc },
        };
      },
    },
    {   // 4 · the café: A sips from her cup, B talks, C chats beside them; the steam rises
      pose(t) {
        const v = t % 4.6, k = ss(.6, 1.2, v) * (1 - ss(2.2, 2.8, v)), talk = Math.max(0, Math.sin(t * 1.3)), g = Math.max(0, Math.sin(t * 1.1 + 2)), legs = sit(24);
        this.tilt = -26 * ss(1.1, 1.4, v) * (1 - ss(2, 2.3, v)); this.t = t;
        return {
          A: { ...legs, af: [mix(-22, -14, k), mix(-62, -150, k)], ab: [-16, -60], bd: mix(6, 0, k), hd: -7 * k },
          B: { ...legs, af: [-26 - 8 * talk, -56 - 22 * talk * Math.abs(Math.sin(t * 4))], ab: [-18, -56], bd: 7, hd: 5 * Math.sin(t * 3) * talk },
          C: { lf: [2, 0], lb: [-4, 2], af: [-20 - 14 * g, -60 + 14 * Math.sin(t * 6) * g], ab: [4, -10], bd: 3, hd: 3 * Math.sin(t * 1.7) },
        };
      },
      props(F, P, p) {
        const hp = handAt(F.A, p.A.af);
        P.cup.setAttribute("transform", `translate(${hp[0].toFixed(1)} ${(hp[1] + 1.6).toFixed(1)}) rotate(${this.tilt.toFixed(1)})`);
        P.steam.forEach((w, i) => { const q = (this.t * .45 + i / 3) % 1; w.setAttribute("transform", `translate(0 ${(-7 * q).toFixed(2)})`); w.setAttribute("opacity", (Math.sin(Math.PI * q) * .8).toFixed(2)); });
      },
      rest(P) { P.cup.setAttribute("transform", "translate(1237 369.2)"); P.steam.forEach((w) => w.setAttribute("opacity", 0)); },
    },
    {   // 5 · the desk: B types, A leans in from the stool and nods, C thinks, a hand at the chin, and points at the screen now and then
      pose(t) {
        const c = t % 5.2, burst = c < 3.6, ty = burst ? Math.sin(t * 22) : 0, ty2 = burst ? Math.sin(t * 22 + 1.7) : 0, look = ss(3.6, 4.1, c) * (1 - ss(4.7, 5.2, c));
        const pt = ss(2, 2.5, t % 6) * (1 - ss(3.8, 4.3, t % 6)), legs = sit(24); this.t = t;
        return {
          B: { ...legs, af: [-30, -58 + 4 * ty], ab: [-26, -60 + 4 * ty2], bd: mix(10, 2, look), hd: mix(9, -6, look) + .6 * ty },
          A: { ...legs, af: [-28, -52], ab: [-20, -48], bd: 12 + 2 * Math.sin(t * 1.1), hd: 6 + 4 * Math.sin(t * 2.6) },
          C: { lf: [2, 0], lb: [-4, 2], af: [mix(-14, -62, pt), mix(-136, -14, pt)], ab: [-12, -30], bd: 6, hd: 5 },
        };
      },
      props(F, P) { P.glow.setAttribute("opacity", (.75 + .25 * Math.sin(this.t * 2.4)).toFixed(2)); },
      rest(P) { P.glow.setAttribute("opacity", .85); },
    },
    {   // 6 · the steps: A and B sit, C stands at the foot; they lean in, C points at B's notebook
      pose(t) {
        const br = (ph) => Math.sin(t * 1.9 + ph), pt = ss(0, .6, t % 6) * (1 - ss(2.6, 3.2, t % 6)), legs = sit(14);
        return {
          A: { ...legs, af: [-34, -40], ab: [-24, -50], bd: 16 + 3 * br(0), hd: 6 + 4 * br(1.4) },
          B: { ...legs, af: [-40, -42], ab: [-30, -48], bd: 14 + 3 * br(2.1), hd: 8 + 3 * br(.6) },
          C: { lf: [-4, 4], lb: [6, 2], af: [mix(-20, -78, pt), mix(-30, -6, pt)], ab: [-10, -22], bd: 12 + 2 * br(3), hd: 4 * br(4.2) },
        };
      },
      props(F, P, p) { const hp = handAt(F.B, p.B.af); P.note.setAttribute("transform", `translate(${hp[0].toFixed(1)} ${(hp[1] - 2).toFixed(1)})`); P.note.setAttribute("opacity", 1); },
      rest(P) { P.note.setAttribute("opacity", 0); },
    },
  ];

  /* ---------- one memory per beat: the walk there, the line ahead of it, then the memory ---------- */
  let W = null, EL = [], mask = null, LEN = 0, cur = 0, raf = 0, trip = null;
  function lineTo(s, ms) {
    mask.style.transition = ms ? `stroke-dashoffset ${Math.round(ms)}ms cubic-bezier(.45,.05,.3,1)` : "none";
    mask.style.strokeDashoffset = LEN * (1 - s);
  }
  // a friend at x, y: standing (on the ground) or seated (k = 1) on a seat, blending between the two
  function settle(f, s, k, p) {
    f.x = s[0]; f.flip = s[2] < 0;
    if (s[3] == null) { f.seated = false; f.y = s[1]; pose(f, p); return; }
    f.seated = true; f.y = mix(s[1], s[3] + (HIP - 3), k); pose(f, p);
  }
  // the trip to memory k: each friend's path from where memory k−1 left them, and when they each get there
  function plan(k, walk) {
    const legs = {};
    WHO.forEach((w) => {
      const a = SPOT[k - 1][w], z = SPOT[k][w];
      const r = polyline([[a[0], a[1]], ...VIA[k]([a[0], a[1]], [z[0], z[1]]), [z[0], z[1]]]);
      const t0 = a[3] != null ? UP : 0;
      legs[w] = { r, a, z, t0, t1: t0 + r.L / V, face: a[2] };
    });
    const t1 = Math.max(...WHO.map((w) => legs[w].t1));
    return { k, walk, legs, t1, go: walk ? t1 + DOWN : 0, start: performance.now(), line: [STOP[walk ? k - 1 : k], STOP[k]] };
  }
  function frame(now) {
    if (document.body.dataset.scene !== "s-memories" || !trip) { raf = 0; return; }
    // (the first frame's timestamp can come from just before the trip was planned)
    const t = Math.max(0, (now - trip.start) / 1000), k = trip.k, M = MEM[k], { F, P } = W;
    if (trip.walk) {
      // the line runs ahead of them, at a steady speed, and each piece of the memory comes up as it reaches it
      const head = mix(trip.line[0], trip.line[1], Math.min(1, t / Math.max(.6, trip.t1 * .85)));
      mask.style.strokeDashoffset = LEN * (1 - head);
      EL.forEach((e) => { if (e.b === k && head >= e.s - 1e-6) e.el.classList.add("on"); });
      W.folk.setAttribute("opacity", k === 1 ? ss(0, .5, t).toFixed(3) : 1);
    }
    const act = t >= trip.go ? M.pose(t - trip.go) : null, mixIn = act ? ss(0, .4, t - trip.go) : 0;
    WHO.forEach((w) => {
      const f = F[w], L = trip.legs[w], z = L.z;
      if (trip.walk && t < L.t1) {
        if (t < L.t0) { settle(f, L.a, 1 - ss(0, UP, t), mixPose(SEAT(L.a[1] - L.a[3]), STAND, ss(0, UP, t))); return; }   // standing up
        const d = (t - L.t0) * V, [x, y, dx] = along(L.r, d);
        if (Math.abs(dx) > 2) L.face = Math.sign(dx);
        f.x = x; f.y = y; f.flip = L.face < 0; f.seated = false;
        pose(f, { ...stride((d / STRIDE) * 2 * Math.PI, AMP), bd: 3, hd: 0 });
        return;
      }
      // there: sit down if this memory has a seat, wait for the others, then join in
      const down = z[3] != null ? ss(0, DOWN, t - (trip.walk ? L.t1 : -1)) : 0, idle = z[3] != null ? mixPose(STAND, SEAT(z[1] - z[3]), down) : STAND;
      settle(f, z, down, act ? mixPose(idle, act[w], mixIn) : idle);
    });
    if (act && M.props) M.props(F, P, act);
    raf = requestAnimationFrame(frame);
  }
  function beat(k) {
    cancelAnimationFrame(raf); raf = 0;
    const prev = cur; cur = k;
    const walk = !reduced && k === prev + 1;
    MEM.forEach((m) => m && m.rest && m.rest(W.P));
    EL.forEach((e) => { if (e.b < k) e.el.classList.add("on"); else if (e.b > k || (walk && e.b === k)) e.el.classList.remove("on"); });
    trip = plan(k, walk);
    if (walk) { lineTo(STOP[k - 1], 0); void mask.getBoundingClientRect(); }
    else {
      // back, a jump (the overview, or ← from the next slide) or reduced motion: they are simply there
      lineTo(STOP[k], reduced ? 0 : 400);
      EL.forEach((e) => e.b === k && e.el.classList.add("on"));
      W.folk.setAttribute("opacity", 1);
    }
    if (reduced) {   // one still moment of the memory
      const p = MEM[k].pose(1.2);
      WHO.forEach((w) => settle(W.F[w], SPOT[k][w], 1, p[w]));
      if (MEM[k].props) MEM[k].props(W.F, W.P, p);
      return;
    }
    raf = requestAnimationFrame(frame);
  }
  return {
    enter(_, sc) {
      plain();
      if (!W) W = build($(".mem-folk", sc));
      EL = $$("[data-s]", sc).map((el) => ({ el, s: +el.dataset.s, b: beatOf(+el.dataset.s) }));
      EL.forEach((e) => e.el.classList.remove("on"));
      mask = $(".mem-route .mask", sc); LEN = mask.getTotalLength(); mask.style.strokeDasharray = LEN; lineTo(0, 0);
      cancelAnimationFrame(raf); raf = 0; cur = 0; trip = null;
      W.folk.setAttribute("opacity", 0);
      MEM.forEach((m) => m && m.rest && m.rest(W.P));
      reveal($(".mem-h", sc), 100);
      $$(".mem-h > *", sc).forEach((e, i) => e.style.setProperty("--i", i * 4));
    },
    step(k) { beat(k); },
    leave() { cancelAnimationFrame(raf); raf = 0; trip = null; },
  };
});
</script>
