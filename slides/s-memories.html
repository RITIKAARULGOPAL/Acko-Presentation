<script>
/* memories (deck slide 8): the deck's page as placed — map, trees, the six photographs — while the dashed route draws itself
   across the campus. Each memory comes up as the line reaches it, with its own people acting out its label: a dribble and a
   wave at the court, a stroll on the pathway, friends on a bench, lunch at the café, study at a desk, a huddle on the stairs. */
ACKO.slide("s-memories", ({ $, $$, plain, reveal, later, drawPath, reduced }) => {
  const DRAW = 5200, D0 = 500;
  // when drawPath's line (cubic-bezier(.45,.05,.3,1)) has reached a share s of the route, in ms after enter
  const reach = (s) => {
    const B = (p1, p2, u) => 3 * (1 - u) * (1 - u) * u * p1 + 3 * (1 - u) * u * u * p2 + u * u * u;
    let a = 0, b = 1;
    for (let k = 0; k < 28; k++) { const m = (a + b) / 2; if (B(.05, 1, m) < s) a = m; else b = m; }
    return D0 + B(.45, .3, a) * DRAW;
  };

  /* ---------- a person, flat like the deck's cut-outs: stands on (0,0) facing right, about 97 tall. The limbs turn about fixed
     joints (hip 48, knee 25, shoulder 77, elbow 62 up from the soles); pose() sets them every frame ---------- */
  const NS = "http://www.w3.org/2000/svg";
  const HIP = 48, KNEE = 25, SHO = 77, ELB = 62, WRI = 48, NECK = 83;
  const shade = (hex, k) => "#" + hex.slice(1).match(/../g).map((h) => Math.round(parseInt(h, 16) * (1 - k)).toString(16).padStart(2, "0")).join("");
  const HAIR = {
    short: (c) => `<path fill="${c}" d="M-4.8-85.2C-6.8-88-6.2-94.6-.6-95.9 3.4-96.8 6.8-95.2 7.4-92.2 5.4-92.9 3-93 1.2-92 0-91.2-.6-89.6-1.6-88.6-2.4-87.6-3.2-86.6-4.8-85.2Z"/>`,
    long: (c) => `<path fill="${c}" d="M-5.6-86C-7.2-91-5.6-96.2 0-96.3 4-96.4 7-94.2 7.4-91.6 5.4-92.6 2.6-92.8.8-91.8-.6-90.8-1-88.6-1.2-86-1.4-82.8-.8-80-.2-77.4L-6.6-76.6C-7.2-79.6-6.4-83-5.6-86Z"/>`,
    bun: (c) => HAIR.short(c) + `<circle cx="-4.6" cy="-94.4" r="3.1" fill="${c}"/>`,
    curly: (c) => [[-4.4, -89.6], [-3.6, -93.6], [.2, -95.8], [4.2, -95], [-5.2, -86]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.9" fill="${c}"/>`).join(""),
  };
  function person(o) {
    const skin = o.skin || "#f0c8a4", legs = o.legs || "#c9ccd1", shin = o.shin || legs, shoe = o.shoe || "#efefec", top = o.top;
    const leg = (k, dk) => `<g data-j="${k}"><path d="M0-${HIP}V-${KNEE}" stroke="${shade(legs, dk)}" stroke-width="6.4"/>` +
      `<g data-j="${k}2"><path d="M0-${KNEE}V-4.2" stroke="${shade(shin, dk)}" stroke-width="5.4"/><path fill="${shade(shoe, dk)}" d="M-2.8-4.8h5.8c2.8 0 3.9 1.7 3.9 3.4V0H-2.8Z"/></g></g>`;
    const arm = (k, dk, hold) => `<g data-j="${k}"><path d="M0-${SHO}V-${ELB}" stroke="${shade(o.sleeve || top, dk)}" stroke-width="5"/>` +
      `<g data-j="${k}2"><path d="M0-${ELB}V-${WRI + 1.6}" stroke="${shade(o.cuff || o.sleeve || top, dk)}" stroke-width="4.3"/><circle cy="-${WRI}" r="2.4" fill="${shade(skin, dk)}"/>${hold || ""}</g></g>`;
    const hips = o.skirt ? `<path fill="${o.skirt}" d="M-6.2-53H6.2L9.4-31.5H-9.4Z"/>` : `<path fill="${legs}" d="M-6-53H6V-45.5H-6Z"/>`;
    const body = `<path fill="${top}" d="M-5.8-80.6C-2-82.4 2-82.4 5.8-80.6L${o.coat ? "8.6-30H-8.6" : "6.6-48.5H-6.6"}Z"/>` +
      (o.shirt ? `<path fill="${o.shirt}" d="M1-81.4H4.8L3.2-69Z"/>` : "") +
      (o.bag ? `<path stroke="${shade(o.bag, .2)}" stroke-width="1" d="M2.6-80.6L-5.6-58"/><rect x="-10.4" y="-60" width="7.6" height="9.4" rx="2" fill="${o.bag}"/>` : "");
    const head = `<g data-j="hd"><path fill="${skin}" d="M-1.6-84.6H1.8V-79H-1.6Z"/><circle cx=".9" cy="-89" r="6.1" fill="${skin}"/>${HAIR[o.hair || "short"](o.hc || "#2a211c")}</g>`;
    return `${leg("lb", .18)}<g data-j="ub">${arm("ab", .18)}</g>${leg("lf", 0)}${hips}<g data-j="uf">${body}${head}${arm("af", 0, o.hold)}</g>`;
  }
  // a figure at (x, y): its soles, or the seat it sits on when seated; scale s; facing left when flip
  function place(root, o) {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "mem-p"); g.innerHTML = person(o); root.appendChild(g);
    const j = {}; g.querySelectorAll("[data-j]").forEach((e) => (j[e.dataset.j] = e));
    const s = o.s || 1;
    return { g, j, s, x: o.x, y: o.y + (o.seated ? (HIP - 3) * s : 0), flip: !!o.flip, seated: !!o.seated, dy: 0, bd: 0 };
  }
  const rad = Math.PI / 180, cos = (d) => Math.cos(d * rad), sin = (d) => Math.sin(d * rad);
  const R = (a, x, y) => `rotate(${(+a || 0).toFixed(2)} ${x} ${y})`;
  // p: lf / lb / af / ab = [upper, lower] in degrees (0 hangs straight down, negative swings forward); bd leans the body forward;
  // hd nods the head forward. A standing figure keeps its lower foot on the ground.
  function pose(f, p) {
    const J = f.j;
    J.lf.setAttribute("transform", R(p.lf[0], 0, -HIP)); J.lf2.setAttribute("transform", R(p.lf[1], 0, -KNEE));
    J.lb.setAttribute("transform", R(p.lb[0], 0, -HIP)); J.lb2.setAttribute("transform", R(p.lb[1], 0, -KNEE));
    J.af.setAttribute("transform", R(p.af[0], 0, -SHO)); J.af2.setAttribute("transform", R(p.af[1], 0, -ELB));
    J.ab.setAttribute("transform", R(p.ab[0], 0, -SHO)); J.ab2.setAttribute("transform", R(p.ab[1], 0, -ELB));
    const up = R(p.bd, 0, -HIP); J.ub.setAttribute("transform", up); J.uf.setAttribute("transform", up);
    J.hd.setAttribute("transform", R(p.hd, .5, -NECK));
    let dy = 0;
    if (!f.seated) { const ext = (l) => 23 * cos(l[0]) + 21 * cos(l[0] + l[1]); dy = 44 - Math.max(ext(p.lf), ext(p.lb)); }
    f.dy = dy; f.bd = p.bd || 0;
    f.g.setAttribute("transform", `translate(${f.x.toFixed(1)} ${(f.y + dy * f.s).toFixed(1)}) scale(${f.flip ? -f.s : f.s} ${f.s})`);
  }
  // where the hand of an arm at [upper, lower] is on the page, for the figure's last pose
  function handAt(f, a) {
    const e = [-15 * sin(a[0]), -SHO + 15 * cos(a[0])], b = a[0] + a[1], h = [e[0] - 14 * sin(b), e[1] + 14 * cos(b) + HIP];
    const c = cos(f.bd), s = sin(f.bd), x = h[0] * c - h[1] * s, y = h[0] * s + h[1] * c - HIP;
    return [f.x + (f.flip ? -1 : 1) * f.s * x, f.y + f.dy * f.s + f.s * y];
  }
  const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
  const mix = (a, b, k) => a + (b - a) * k;
  // seated legs: the shins hang almost straight down to a floor `drop` below the seat (the ground, or the step below), so the
  // knees come up as the floor comes closer
  const sit = (drop) => { const th = Math.acos(Math.max(-1, Math.min(1, (drop - 21.8) / 23))) / rad; return { lf: [-th, th - 8], lb: [-th + 6, th - 12] }; };
  // a walking stride at phase w (radians)
  const stride = (w, amp) => ({
    lf: [-amp * Math.sin(w), 3 + 30 * Math.pow(Math.max(0, Math.cos(w)), 1.5)],
    lb: [amp * Math.sin(w), 3 + 30 * Math.pow(Math.max(0, -Math.cos(w)), 1.5)],
    af: [amp * .8 * Math.sin(w), -10 - 8 * Math.max(0, -Math.sin(w))],
    ab: [-amp * .8 * Math.sin(w), -10 - 8 * Math.max(0, Math.sin(w))],
  });
  const scene = (svg, s) => { const g = document.createElementNS(NS, "g"); g.setAttribute("class", "mem-sc"); g.dataset.s = s; svg.appendChild(g); return g; };
  const draw = (root, markup) => { const g = document.createElementNS(NS, "g"); g.innerHTML = markup; root.appendChild(g); return g; };

  /* ---------- the six scenes, in page units (1920 × 1080) ---------- */
  function build(svg) {
    const S = [];
    // 1 · meet @ the basketball court: one dribbles, a friend waves (on the street above the court)
    {
      const g = scene(svg, .03);
      const d = place(g, { x: 60, y: 571, top: "#9fbbe0", shirt: "#f4f4f2", legs: "#2d3b58", shin: "#f0c8a4", shoe: "#f4f4f2", hair: "short" });
      const ball = draw(g, `<circle r="6.4" fill="#d9772f"/><path stroke="#7a3a12" stroke-width=".8" d="M-6.4 0H6.4M0-6.4V6.4M-4.6-4.4C-1.8-1.6-1.8 1.6-4.6 4.4M4.6-4.4C1.8-1.6 1.8 1.6 4.6 4.4"/>`);
      const f = place(g, { x: 150, y: 568, flip: true, skin: "#e0ad85", top: "#e7b6c2", legs: "#a7c0df", hair: "long", hc: "#3a271d", bag: "#9a6b77" });
      const T = .62;
      S.push((t) => {
        const u = (t % T) / T, h = Math.abs(Math.sin(Math.PI * u)), kn = 1 - h, af = [-30 - 4 * h, -28 - 12 * h];
        pose(d, { lf: [-16 - 3 * kn, 24 + 6 * kn], lb: [8, 14 + 4 * kn], af, ab: [-26, -46], bd: 9, hd: -7 });
        const hp = handAt(d, af), top = hp[1] + 2.4 + 6.4, by = mix(571 - 6.4, top, h), sq = Math.max(0, 1 - h / .1);
        ball.setAttribute("transform", `translate(${hp[0].toFixed(1)} ${(by + 6.4 * sq * .2).toFixed(1)}) scale(${(1 + .14 * sq).toFixed(3)} ${(1 - .2 * sq).toFixed(3)})`);
        const v = t % 4.2, up = ss(0, .5, v) * (1 - ss(2.1, 2.6, v)), wv = v > .5 && v < 2.1 ? Math.sin((v - .5) / .53 * 2 * Math.PI) : 0;
        pose(f, { lf: [-2, 2], lb: [3, 1], af: [mix(6, -160, up), mix(-8, -12 + 26 * wv, up)], ab: [-3, -10], bd: -1, hd: -4 * up });
      });
    }
    // 2 · walk through memorable pathways: two friends stroll the first stretch of the route, towards the forest path
    {
      const g = scene(svg, .08), walk = draw(g, "");
      const a = place(walk, { x: 0, y: 0, top: "#577aa8", shirt: "#f4f4f2", legs: "#cfd3d8", shoe: "#2a2a2a", hair: "short", hc: "#1f1a17" });
      const b = place(walk, { x: 0, y: 0, s: .97, skin: "#e0ad85", top: "#8db7a5", shirt: "#efe8dc", legs: "#2d3b58", shoe: "#efefec", hair: "bun", hc: "#5a3a26" });
      const L = 6.6, REST = 1.2, X0 = 238, X1 = 560, yAt = (x) => 576 - (x + 25) * 34 / 629;
      S.push((t) => {
        const k = t % (L + REST), m = Math.min(1, k / L), xa = mix(X0, X1, m), xb = xa + 30;
        walk.setAttribute("opacity", (ss(0, .5, k) * (1 - ss(L - .5, L, k))).toFixed(3));
        a.x = xa; a.y = yAt(xa); b.x = xb; b.y = yAt(xb);
        const w = (k / 1.05) * 2 * Math.PI;
        pose(a, { ...stride(w, 17), bd: 2, hd: -3 + 2 * Math.sin(t * .9) });
        pose(b, { ...stride(w + Math.PI * .85, 17), bd: 1, hd: 6 * Math.sin(t * .7) });
      });
    }
    // 3 · chill with friends: two on a bench, one standing by them, laughing (under the route, beside the label)
    {
      const g = scene(svg, .5);
      draw(g, `<path fill="#9c7550" d="M846 930H934V934H846Z"/><path fill="#b5895c" d="M842 947H938V951H842Z"/><path fill="#55534e" d="M850 951H853V972H850ZM927 951H930V972H927ZM850 934H853V947H850ZM927 934H930V947H927Z"/>`);
      const a = place(g, { x: 857, y: 947, seated: true, top: "#cfae86", shirt: "#f4f4f2", legs: "#577aa8", hair: "curly", hc: "#2a211c", skin: "#b67c58" });
      const b = place(g, { x: 927, y: 947, seated: true, flip: true, top: "#e7b6c2", legs: "#efe8dc", hair: "long", hc: "#bd4430" });
      const c = place(g, { x: 958, y: 972, flip: true, top: "#a7c0df", shirt: "#f4f4f2", legs: "#2d3b58", hair: "short", hc: "#6a4733", skin: "#e0ad85" });
      const legs = sit(25);
      S.push((t) => {
        const la = Math.max(0, Math.sin(t * 2.1)), lb = Math.max(0, Math.sin(t * 2.1 + 2)), lc = Math.max(0, Math.sin(t * 1.7 + 4));
        pose(a, { ...legs, af: [-34, -70 + 10 * Math.sin(t * 9) * la], ab: [-20, -50], bd: 4 - 6 * la, hd: -8 * la + 2 * Math.sin(t * 14) * la });
        pose(b, { ...legs, af: [-24, -60], ab: [-10, -40], bd: 8 + 6 * lb, hd: 4 + 6 * lb * Math.sin(t * 13) });
        pose(c, { lf: [2, 0], lb: [-6, 2], af: [-18 - 10 * lc, -96 + 8 * Math.sin(t * 8) * lc], ab: [6, -8], bd: 2 - 5 * lc, hd: -6 * lc });
      });
    }
    // 4 · the cafe lunches: two at a small table; one sips, the other talks (right of the café, on the route)
    {
      const g = scene(svg, .73);
      draw(g, `<path fill="#55534e" d="M1236.6 372H1239.4V399H1236.6ZM1229 399H1247V401.2H1229ZM1209.6 380H1212V401H1209.6ZM1264 380H1266.4V401H1264Z"/>` +
        `<path fill="#b5895c" d="M1203 377H1219V380H1203ZM1257 377H1273V380H1257Z"/><path fill="#efe8dc" d="M1219 369.2H1257V372.2H1219Z"/>` +
        `<ellipse cx="1246" cy="368.6" rx="6.4" ry="1.4" fill="#f4f4f2"/><path fill="#8db7a5" d="M1242 368.4C1242 365.8 1250 365.8 1250 368.4Z"/><path fill="#d9772f" d="M1245 367.8C1245 366.2 1248 366.2 1248 367.8Z"/>` +
        `<path fill="#f4f4f2" d="M1226.6 363.4H1231.4L1231 369.2H1227Z"/>`);
      const steam = draw(g, [0, 1, 2].map((i) => `<path stroke="#e9e3f7" stroke-width=".9" d="M${1228 + i * 1.6} 361C${1226.4 + i * 1.6} 358.4 ${1230.6 + i * 1.6} 356.4 ${1228.6 + i * 1.6} 353.4"/>`).join(""));
      const wisps = [...steam.children];
      const cup = draw(g, `<path fill="#f4f4f2" d="M-2.4-4.6H2.4L2 0H-2Z"/><path stroke="#f4f4f2" stroke-width=".8" d="M2.3-3.6C4-3.6 4-1.2 2.1-1.2"/>`);
      const a = place(g, { x: 1209, y: 377, seated: true, skin: "#f2cba8", top: "#a7c0df", shirt: "#f4f4f2", legs: "#2d3b58", hair: "long", hc: "#3a271d" });
      const b = place(g, { x: 1266, y: 377, seated: true, flip: true, skin: "#b67c58", top: "#cfae86", shirt: "#f4f4f2", legs: "#577aa8", hair: "short", hc: "#1f1a17" });
      const legs = sit(24);
      S.push((t) => {
        const v = t % 4.6, k = ss(.6, 1.2, v) * (1 - ss(2.2, 2.8, v)), af = [mix(-22, -14, k), mix(-62, -150, k)];
        pose(a, { ...legs, af, ab: [-16, -60], bd: mix(6, 0, k), hd: -7 * k });
        const hp = handAt(a, af);
        cup.setAttribute("transform", `translate(${hp[0].toFixed(1)} ${(hp[1] + 1.6).toFixed(1)}) rotate(${(-26 * ss(1.1, 1.4, v) * (1 - ss(2, 2.3, v))).toFixed(1)})`);
        const talk = Math.max(0, Math.sin(t * 1.3));
        pose(b, { ...legs, af: [-26 - 8 * talk, -56 - 22 * talk * Math.abs(Math.sin(t * 4))], ab: [-18, -56], bd: 7, hd: 5 * Math.sin(t * 3) * talk });
        wisps.forEach((w, i) => { const q = (t * .45 + i / 3) % 1; w.setAttribute("transform", `translate(0 ${(-7 * q).toFixed(2)})`); w.setAttribute("opacity", (Math.sin(Math.PI * q) * .8).toFixed(2)); });
      });
    }
    // 5 · focus on study time: one at a desk with a laptop, typing in bursts (right of the study photo)
    {
      const g = scene(svg, .84);
      draw(g, `<path fill="#55534e" d="M1471 807H1473.4V828H1471ZM1485.6 807H1488V828H1485.6ZM1469.6 778H1472.2V807H1469.6ZM1500 797H1502.4V828H1500ZM1544.6 797H1547V828H1544.6Z"/>` +
        `<path fill="#b5895c" d="M1468 804H1490V807H1468Z"/><path fill="#efe8dc" d="M1496 794H1551V797H1496Z"/>` +
        `<path fill="#8db7a5" d="M1532 788H1548V791H1532Z"/><path fill="#e7b6c2" d="M1533.5 791H1547V794H1533.5Z"/><path fill="#f4f4f2" d="M1539 783H1543.6V788H1539Z"/>` +
        `<path fill="#9aa2ad" d="M1505 792.4H1522V794H1505Z"/><path fill="#9aa2ad" d="M1521.4 793.4L1524.6 776.6L1526.4 777L1523.2 794Z"/>`);
      const glow = draw(g, `<path fill="#e6defa" d="M1521 792.6L1524.2 777.6L1525.4 777.8L1522.2 792.8Z"/><radialGradient id="mem-glow"><stop offset="0" stop-color="#e6defa" stop-opacity=".55"/><stop offset="1" stop-color="#e6defa" stop-opacity="0"/></radialGradient><ellipse cx="1520" cy="786" rx="11" ry="9" fill="url(#mem-glow)"/>`);
      const p = place(g, { x: 1481, y: 804, seated: true, skin: "#e0ad85", top: "#e7b6c2", shirt: "#f4f4f2", legs: "#577aa8", hair: "bun", hc: "#2a211c" });
      const legs = sit(24);
      S.push((t) => {
        const c = t % 5.2, burst = c < 3.6, ty = burst ? Math.sin(t * 22) : 0, ty2 = burst ? Math.sin(t * 22 + 1.7) : 0, look = ss(3.6, 4.1, c) * (1 - ss(4.7, 5.2, c));
        pose(p, { ...legs, af: [-30, -58 + 4 * ty], ab: [-26, -60 + 4 * ty2], bd: mix(10, 2, look), hd: mix(9, -6, look) + .6 * ty });
        glow.setAttribute("opacity", (.75 + .25 * Math.sin(t * 2.4)).toFixed(2));
      });
    }
    // 6 · huddle on stairs: three on a few steps under the stairs photo, leaning in together
    {
      const g = scene(svg, .95);
      draw(g, `<path fill="#2b2a28" d="M1646 491H1772V505H1646ZM1688 477H1772V491H1688ZM1730 463H1772V477H1730Z"/><path stroke="#5f5c56" stroke-width="1.2" d="M1646 491H1688V477H1730V463H1772"/>`);
      const c = place(g, { x: 1757, y: 463, seated: true, flip: true, top: "#a7c0df", shirt: "#f4f4f2", legs: "#cfd3d8", hair: "curly", hc: "#2a211c", skin: "#b67c58" });
      const b = place(g, { x: 1714, y: 477, seated: true, flip: true, top: "#e7b6c2", legs: "#efe8dc", hair: "long", hc: "#6a4733", hold: `<path fill="#efe8dc" d="M-3-52H5V-46H-3Z"/>` });
      const a = place(g, { x: 1628, y: 505, top: "#efe8dc", shirt: "#577aa8", legs: "#577aa8", hair: "short", hc: "#1f1a17", skin: "#e0ad85" });
      const legs = sit(14);
      S.push((t) => {
        const br = (ph) => Math.sin(t * 1.9 + ph), pt = ss(0, .6, t % 6) * (1 - ss(2.6, 3.2, t % 6));
        pose(c, { ...legs, af: [-34, -40], ab: [-24, -50], bd: 16 + 3 * br(0), hd: 6 + 4 * br(1.4) });
        pose(b, { ...legs, af: [-40, -42], ab: [-30, -48], bd: 14 + 3 * br(2.1), hd: 8 + 3 * br(.6) });
        pose(a, { lf: [-4, 4], lb: [6, 2], af: [mix(-20, -78, pt), mix(-30, -6, pt)], ab: [-10, -22], bd: 12 + 2 * br(3), hd: 4 * br(4.2) });
      });
    }
    return S;
  }

  let S = null, raf = 0, t0 = 0;
  const frame = (now) => {
    if (document.body.dataset.scene !== "s-memories") { raf = 0; return; }
    const t = (now - t0) / 1000; S.forEach((f) => f(t)); raf = requestAnimationFrame(frame);
  };
  return {
    enter(_, sc) {
      plain();
      if (!S) S = build($(".mem-folk", sc));
      const on = $$("[data-s]", sc); on.forEach((e) => e.classList.remove("on"));
      reveal($(".mem-h", sc), 100);
      $$(".mem-h > *", sc).forEach((e, i) => e.style.setProperty("--i", i * 4));
      t0 = performance.now(); S.forEach((f) => f(reduced ? 2.5 : 0));   // reduced motion: one still moment, the walkers mid-stride
      if (reduced) { drawPath($(".mem-route .mask", sc), 1, 0); on.forEach((e) => e.classList.add("on")); return; }
      drawPath($(".mem-route .mask", sc), DRAW, D0);
      on.forEach((e) => later(() => e.classList.add("on"), reach(+e.dataset.s)));
      cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
    },
    leave() { cancelAnimationFrame(raf); raf = 0; },
  };
});
</script>
